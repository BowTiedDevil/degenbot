# Foundry project for Tier-3 on-chain accuracy oracles (ergo epic UP5NH6).
#
# This project compiles *reference* Solidity (canonical deployed bytecode from
# Uniswap V2/V3/V4, Curve, Balancer cores) into runtime bytecode that a Rust
# `#[test]` deploys into an offline revm `CacheDB<EmptyDB>` and calls, so the
# Rust swap-math / solver code is compared against the real on-chain contract
# logic byte-for-byte — closing the "Rust == Rust" blind spot of Tier 2 (see
# ADR-005 dual-path coverage in AGENTS.md, and the ADR filed as task 5WYE5Y).
#
# `forge build` compiles the V4 swap-math harness + the V4 PoolManager oracle
# under `src-v4/` (the other families build via direct solc — see the
# per-family build scripts, since mixed solc versions <0.8 are resolved by
# fetching solc binaries into the svm dir rather than foundry's solc manager).

[profile.default]
src = "src-v4"
out = "out"
libs = ["lib"]
# Solidity version: multi-version compilation. v3-core's FullMath declares
# `pragma >=0.4.0 <0.8.0` (must compile under solc 0.7.x); v4-core + the Tier-3
# harnesses declare `^0.8.x`. `auto_detect_solc = true` lets foundry pick the
# matching solc per source file (0.7.6 for v3-core, 0.8.26 for v4-core).
# `solc_version` is the fallback for ambiguous pragmas (the V4 harness pins 0.8.26).
solc_version = "0.8.26"
auto_detect_solc = true
