# hotpath Cloud performance regression and budgets config.
#
# Docs: https://hotpath.rs/cloud

# A regression or a broken budget fails the pull request's check.
pr_check = "fail"

[functions]
min_percent_total = 2

[functions.alloc]
judged = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 1
