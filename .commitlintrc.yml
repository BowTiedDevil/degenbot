rules:
  # ── Type ──────────────────────────────────────────────────
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - refactor
      - docs
      - lint
      - test
      - chore
      - remove

  type-case:
    - 2
    - always
    - lower-case

  type-empty:
    - 2
    - never

  # ── Scope ─────────────────────────────────────────────────
  # Scope is OPTIONAL and FREE-FORM, per the Conventional Commits spec: no
  # scope-enum is enforced, so any domain token is accepted and scope may be
  # omitted entirely for cross-cutting changes. The old closed scope-enum kept
  # going stale relative to the active domains (backrun, solver, evm, oracle,
  # ... all postdate it) and caused needless lint churn on correct messages.
  # scope-case is likewise not enforced; prefer lower-case by convention only.

  # ── Subject ───────────────────────────────────────────────
  # subject-case: not enforced — 'lower-case' rejects proper nouns
  # like AGENTS.md; convention is documented in template and AGENTS.md

  subject-empty:
    - 2
    - never

  subject-full-stop:
    - 2
    - never

  subject-max-length:
    - 2
    - always
    - 100

  # ── Body ──────────────────────────────────────────────────
  body-max-line-length:
    - 1
    - always
    - 100

  body-min-length:
    - 0

  # ── Footer ────────────────────────────────────────────────
  footer-max-line-length:
    - 2
    - always
    - 100

  # ── Overall ───────────────────────────────────────────────
  header-max-length:
    - 2
    - always
    - 100
