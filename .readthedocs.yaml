# Read the Docs config for the Sphinx + MyST documentation site.
# The Rust side is documented on docs.rs directly (cargo doc); this config
# covers the Python/driver + prose docs only.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Existing docs/ markdown was not written against a doc tool; keep warnings
  # non-fatal until the tree is cleaned up, then flip to true.
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
  # NOTE: the project itself is NOT installed here. Building the PyO3
  # extension requires a Rust toolchain + maturin on the build host; until a
  # stub-driven API reference (sphinx-autoapi over src/degenbot/*.pyi) lands,
  # no docs page needs to import the compiled module.
