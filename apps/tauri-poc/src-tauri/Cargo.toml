[package]
name = "degenbot-tauri-poc"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
degenbot-tauri-feed-model = { path = "../feed-model" }
degenbot = { path = "../../../rust/crates/facade/degenbot" }
degenbot-ingestion = { path = "../../../rust/crates/integrations/degenbot-ingestion" }
futures-util = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
