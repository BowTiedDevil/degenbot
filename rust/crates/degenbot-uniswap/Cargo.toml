[package]
name = "degenbot-uniswap"
description = "Pure-Rust Uniswap-protocol domain crate — DEX identity presets + V2 swap callldata encoding."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.3" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-core = { path = "../degenbot-core" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
