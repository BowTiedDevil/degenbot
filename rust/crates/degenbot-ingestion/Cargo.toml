[package]
name = "degenbot-ingestion"
description = "PyO3-free WS ingestion crate: newHeads + logs subscriptions, Rust-side topic filtering, gap backfill fetching, and the header/logs watchdog windows. Emits PoolEvent { epoch, log_index, payload } into the stage-machine runtime."
keywords = ["mev", "ingestion", "websocket", "evm", "uniswap"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
# `AlloyProvider` (the typed HTTP/WS provider) — the crate owns the transport;
# the stage-machine runtime (degenbot-bot) owns the state machine.
degenbot-rpc.workspace = true
degenbot-decoders.workspace = true
degenbot-core.workspace = true
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
tokio = { version = "^1.53", features = ["time", "sync"] }
tracing = { version = "^0.1" }

[dev-dependencies]
# Test-only constructors (`AlloyProvider::from_provider`) — mock transports.
alloy = { version = "^2.5", features = ["full"] }
degenbot-rpc = { workspace = true, features = ["test-utils"] }
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros", "test-util"] }
