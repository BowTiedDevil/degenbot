[package]
name = "degenbot-aave"
description = "Pure-Rust Aave V3 domain crate: the updater chunk-loop (transactional apply of decoded Aave events under one rusqlite Transaction) + the position-analysis math (health-factor / LTV / eMode / isolation). Epic AZGJUN."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4" }
degenbot-core = { path = "../degenbot-core" }
degenbot-db = { path = "../degenbot-db" }
degenbot-decoders = { path = "../degenbot-decoders" }
degenbot-evm-math = { path = "../degenbot-evm-math" }
degenbot-rpc = { path = "../degenbot-rpc" }
rusqlite = { version = "^0.40" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros", "sync"] }

[features]
default = []
