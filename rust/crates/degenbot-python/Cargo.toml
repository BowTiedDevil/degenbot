[package]
name = "degenbot_rs"
description = "Rust implementations used by the degenbot Python package."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "degenbot_rs"
crate-type = ["rlib", "cdylib"]

# The PyO3 binding layer (cdylib) over the seven pyo3-free core crates. It is a
# workspace member at `rust/crates/degenbot-python/` (a peer of the cores),
# mirroring `polars-python`'s position in the `polars` workspace. The workspace
# root `rust/Cargo.toml` is a pure virtual manifest. (ergo UG6FKN follow-up:
# ADR-005 deferral — binding layer lifted out of the workspace root.)

[dependencies]
alloy = { version = "^2.4", features = ["full", "transport-throttle"] }
# Path dependency enables the `pyo3` feature so `From<Error> for PyErr`
# conversions from core are available at this binding layer.
degenbot-rpc = { path = "../degenbot-rpc", optional = true }

degenbot-bot = { path = "../degenbot-bot", optional = true }
degenbot-solvers = { path = "../degenbot-solvers", optional = true }
degenbot-pools = { path = "../degenbot-pools" }
degenbot-decoders = { path = "../degenbot-decoders", optional = true }
degenbot-uniswap = { path = "../degenbot-uniswap", optional = true }
degenbot-abi = { path = "../degenbot-abi", optional = true }
degenbot-math = { path = "../degenbot-math", optional = true }
degenbot-db = { path = "../degenbot-db", optional = true }
degenbot-pathfinding = { path = "../degenbot-pathfinding", optional = true }
degenbot-price = { path = "../degenbot-price", optional = true, features = ["pyo3"] }
degenbot-submission = { path = "../degenbot-submission", optional = true, features = ["pyo3"] }
degenbot-simulation = { path = "../degenbot-simulation", optional = true }
revm = { version = "^42.0", default-features = false }
degenbot-arbitrage = { path = "../degenbot-arbitrage", optional = true, features = ["order-index"] }
degenbot-executor = { path = "../degenbot-executor", optional = true }
degenbot-execution = { path = "../degenbot-execution", optional = true }
degenbot-fork = { path = "../degenbot-fork", optional = true }
degenbot-pool-updater = { path = "../degenbot-pool-updater", optional = true }
degenbot-aave = { path = "../degenbot-aave", optional = true }
degenbot-core = { path = "../degenbot-core", features = ["pyo3"] }
dashmap = { version = "^6.2" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
log = { version = "^0.4" }
lru = { version = "^0.18" }
parking_lot = { version = "^0.12" }
pyo3 = { version = "^0.29", features = [ "abi3-py312", "serde", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "^0.29", features = ["tokio-runtime"] }
crossbeam-queue = { version = "^0.3" }
tracing = { version = "^0.1" }
tracing-log = { version = "^0.2" }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry", "alloc"] }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }
toml = "1.1.4"

[features]
# Per-domain binding-layer features (ergo UG6FKN task UKDOUR). Each gates its optional
# core-crate path dep + the corresponding binding module/mod registrations, mirroring
# how polars gates polars-python with features matching polars-core/-plan/etc.
# Default = all-on (byte-equivalent to the pre-feature surface). Implicit coupling
# (documented in the task completion body): `bot` implies `rpc`+`decoders`+`uniswap`
# (the engine wrapper references degenbot_rpc::provider::AlloyProvider + degenbot_decoders::PoolId
# + degenbot_uniswap::dex_identity directly), and `rpc` implies `abi` (rpc/contract wraps
# crate::abi_types). `async` gates the rpc/ async submodules (no new dep).
# The `degenbot-arbitrage` dep spec carries `features = ["order-index"]`, so
# every `simulation` build (default) gets ADR-024's deterministic profit-
# descending pre-sim selection inside `dispatch_profitable` (B5L2XA).
default = ["auto-initialize", "bot", "rpc", "price", "submission", "simulation", "abi", "concentrated-liquidity-math", "balancer-math", "curve-math", "solidly-math", "v2-math", "uniswap", "pathfinding", "async", "db", "executor", "execution", "pool", "aave-updater", "fork"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]
bot = ["dep:degenbot-bot", "dep:degenbot-solvers", "rpc", "decoders", "uniswap"]
price = ["dep:degenbot-price", "rpc"]
submission = ["dep:degenbot-submission", "rpc"]
simulation = ["dep:degenbot-simulation", "dep:degenbot-arbitrage", "rpc", "executor", "submission"]
executor = ["dep:degenbot-executor"]
execution = ["dep:degenbot-execution", "executor"]
fork = ["dep:degenbot-fork"]
rpc = ["dep:degenbot-rpc", "abi"]
abi = ["dep:degenbot-abi"]
concentrated-liquidity-math = ["dep:degenbot-math"]
db = ["dep:degenbot-db"]
pool = ["dep:degenbot-pool-updater", "db", "rpc"]
aave-updater = ["dep:degenbot-aave", "db", "rpc"]
balancer-math = ["dep:degenbot-math"]
curve-math = ["dep:degenbot-math"]
solidly-math = ["dep:degenbot-math"]
v2-math = ["dep:degenbot-math"]
uniswap = ["dep:degenbot-uniswap"]
decoders = ["dep:degenbot-decoders"]
pathfinding = ["dep:degenbot-pathfinding"]
async = []
# OTel span export for the Python-driven path (K6PCKP): pulls degenbot-bot
# with its `otel` feature (OTLP exporter + layer). NOT in `default` -
# release/CI wheels must not ship the OTLP client footprint (same
# exclusion story as hotpath; pyproject [tool.maturin] dev builds enable it).
otel = ['bot', 'degenbot-bot/otel']

[dev-dependencies]
ctor = "^1"
proptest = "^1.11"
# Enable test-only constructors (e.g. `AlloyProvider::from_provider`) for
# the root crate's tests. Production builds pull degenbot-rpc without this
# feature.
degenbot-rpc = { path = "../degenbot-rpc", features = ["test-utils"] }

# Seam-C test seam: InMemorySpanExporter (K6PCKP). Same version lock as
# degenbot-bot (tracing-opentelemetry 0.33 <-> opentelemetry(-sdk) 0.32).
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }

[[test]]
name = "python_integration"
required-features = ["auto-initialize"]

[[test]]
name = "concurrency_stress"
required-features = ["auto-initialize"]
