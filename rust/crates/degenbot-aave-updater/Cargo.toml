[package]
name = "degenbot-aave-updater"
description = "Pure-Rust Aave V3 updater chunk-loop core: transactional apply of decoded Aave events under one rusqlite Transaction (epic AZGJUN, task CXRGX4)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-core = { path = "../degenbot-core" }
degenbot-db = { path = "../degenbot-db" }
degenbot-decoders = { path = "../degenbot-decoders" }
degenbot-evm-math = { path = "../degenbot-evm-math" }
degenbot-rpc = { path = "../degenbot-rpc" }
rusqlite = { version = "^0.31" }
thiserror = { version = "^1.0" }
tokio = { version = "^1.52", features = ["rt", "macros"] }

[features]
default = []