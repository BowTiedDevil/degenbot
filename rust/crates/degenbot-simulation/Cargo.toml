[package]
name = "degenbot-simulation"
description = "Pure-Rust eth_simulateV1 stateOverrides construction — code injection + ETH/WETH funding + warmup-slot integration + WETH9 balanceOf override (pyo3-free core leaf)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-executor = { path = "../degenbot-executor" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-rpc = { path = "../degenbot-rpc" }
degenbot-core = { path = "../degenbot-core" }
degenbot-decoders = { path = "../degenbot-decoders" }
# `degenbot-evm` — the in-process EVM execution core (revm). This crate owns the
# SHARED sim primitives (`SimResult`, `FailBuckets`, `compute_priority_fee`,
# `fits_int128`, `SimulateContext`, `SimulatePath`, `BlockPriorityFees` + the
# constants) so `simulate_in_process` (degenbot-evm) + `simulate_one` (this
# crate, the eth_simulateV1 path) share one type home. This crate re-exports
# them (`pub use degenbot_evm::{...}`) so existing `use degenbot_simulation::...`
# call sites + the PyO3 wrappers stay unchanged. revm is already compiled in
# the workspace (the umbrella + degenbot-aave + degenbot-evm-math depend on
# degenbot-evm), so this edge costs link-time, not a new heavy compile; the
# eventual dispatch swap (retire `dispatch::simulate_v1` for
# `degenbot-evm::simulate_in_process`) needs this edge anyway.
degenbot-evm = { path = "../degenbot-evm" }
degenbot-submission = { path = "../degenbot-submission" }
thiserror = { version = "^2.0" }
futures = { version = "^0.3" }
# `JoinSet` (`rt`) + `Semaphore` (`sync`) for the dispatch_profitable_results
# fan-out cap (D1). The `macros` feature is dev-test only (the `#[tokio::test]`
# attribute used by the §4.2 parity tests).
tokio = { version = "^1.52", features = ["rt", "sync"] }

[dev-dependencies]
serde_json = { version = "^1.0" }
tokio = { version = "^1.52", features = ["macros", "rt"] }
# `test-utils` gates `AlloyProvider::from_provider` (the mock-transport
# constructor) so the §4.2 wire-shape tests can drive the typed dispatch
# without a live RPC. Production builds (the umbrella, the cdylib) never
# enable this feature.
degenbot-rpc = { path = "../degenbot-rpc", features = ["test-utils"] }