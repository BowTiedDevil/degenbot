[package]
name = "degenbot-simulation"
description = "Pure-Rust eth_simulateV1 stateOverrides construction — code injection + ETH/WETH funding + warmup-slot integration + WETH9 balanceOf override (pyo3-free core leaf)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-executor = { path = "../degenbot-executor" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-rpc = { path = "../degenbot-rpc" }
degenbot-core = { path = "../degenbot-core" }
degenbot-decoders = { path = "../degenbot-decoders" }
degenbot-submission = { path = "../degenbot-submission" }
thiserror = { version = "^2.0" }
futures = { version = "^0.3" }
# `JoinSet` (`rt`) + `Semaphore` (`sync`) for the dispatch_profitable_results
# fan-out cap (D1). The `macros` feature is dev-test only (the `#[tokio::test]`
# attribute used by the §4.2 parity tests).
tokio = { version = "^1.52", features = ["rt", "sync"] }

[dev-dependencies]
serde_json = { version = "^1.0" }
tokio = { version = "^1.52", features = ["macros", "rt"] }
# `test-utils` gates `AlloyProvider::from_provider` (the mock-transport
# constructor) so the §4.2 wire-shape tests can drive the typed dispatch
# without a live RPC. Production builds (the umbrella, the cdylib) never
# enable this feature.
degenbot-rpc = { path = "../degenbot-rpc", features = ["test-utils"] }