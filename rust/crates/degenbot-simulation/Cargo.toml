[package]
name = "degenbot-simulation"
description = "In-process revm simulation executor + dispatch fan-out (pyo3-free core; ADR-019 D4 fold)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# revm — the canonical Rust EVM (audited, used by Reth/Foundry/many L2s).
# `default-features = true` brings std + secp256k1 + c-kzg + blst + portable +
# tracer (all mainnet precompiles — keep). `alloydb` enables `AlloyDB` (the
# RPC-backed DatabaseAsyncRef). `asyncdb` enables `DatabaseAsyncRef` +
# `WrapDatabaseAsync` (the async→sync Database bridge). `dev` is NOT enabled —
# owner-funding uses explicit `CacheDB::insert_account_info` (the owner is
# genuinely credited), keeping the sim a faithful mainnet execution (no
# balance-check bypass).
revm = { version = "^42.0", default-features = true, features = ["alloydb", "asyncdb"] }
# The alloy umbrella (single source, matches degenbot-rpc's convention). The
# umbrella's `DynProvider`/`Provider`/`Ethereum` are the same types revm's
# `AlloyDB<N, P>` consumes. `full` brings the RPC types + provider-http.
alloy = { version = "^2.4", features = ["full"] }
degenbot-core = { path = "../degenbot-core" }
# `WarmupSlots` + `compute_simulation_warmup_slots` + `mapping_slot` + the
# `encode_cmd_stream`/`PathInfo`/`HopInfo`/`EncodeOptions` types the sim
# orchestration consumes — crossed from the executor leaf.
degenbot-executor = { path = "../degenbot-executor" }
# `sqrt_price_math` — the engine's proven V3 amount math, so the harness
# computes V3 hop outputs byte-consistent with the `PoolV3` stub (UQOAHA).
degenbot-concentrated-liquidity-math = { path = "../degenbot-concentrated-liquidity-math" }
# `AlloyProvider` — the typed RPC provider the in-process sim's cold-miss
# fallback (`WrapDatabaseAsync<AlloyDB>`) + the access-list / feeHistory paths
# consume. The `SimulateContext.provider` field holds a borrowed `&AlloyProvider`.
degenbot-rpc = { path = "../degenbot-rpc" }
# `BotState` (ADR-003 state owner; ADR-005 standalone-core) — the snapshot
# surface (`v3_pools_snapshot` / `v4_pools_snapshot`) + the typed pool-state
# structs BotStateDb reads. Depends on `degenbot-pools` (state structs) +
# `degenbot-uniswap` (DexIdentity). Added in EGMSNS (option B).
degenbot-bot = { path = "../degenbot-bot" }
degenbot-pools = { path = "../degenbot-pools" }
# `V4PoolId` — the V4 pool identifier type (crossed from the decoders leaf for
# the V4 swap-event decoder + the swap-capture inspector).
degenbot-decoders = { path = "../degenbot-decoders" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# `Serialize` derive for the inspector captured structs (`CallTrace`,
# `CapturedSwap`) — the diagnostic surface crosses the FFI as `#[pyclass]`
# thin shells (ADR-019 D7).
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
# `parking_lot::RwLock` — backs the cross-block persistent `WarmCodeCacheInner`
# (the bytecode + account-existence layer) AND the `BotState` lock type
# (matches `degenbot-bot` so the `Option<Arc<RwLock<BotState>>>` fan-out param
# is the same lock family).
parking_lot = "^0.12"
# `rt` is required by `WrapDatabaseAsync` (it blocks the async `AlloyDB`
# `DatabaseAsyncRef` calls on a runtime — `WrapDatabaseAsync::new` needs a
# current-thread tokio handle). The fan-out/categorization policy + its
# `buffer_unordered`/`Semaphore` concurrency retired with the strategy
# relocation to `degenbot-arbitrage` (ADR-019 D4/D7).
tokio = { version = "^1.53", features = ["rt"] }

[dev-dependencies]
# sha256 for the tier-3 harness bytecode drift guard (`tier3_harness_artifacts.rs`)
# — the manifest hashes the git-tracked harness sources, so a harness edit
# without a rebuild fails the default suite. sha2 is already in the lock (via
# alloy/revm); this is a dev-only linkage.
sha2 = "0.11"
# `examples/rpc_cache_fanout.rs` uses `#[tokio::main(flavor = "multi_thread")]`
# — `WrapDatabaseAsync<AlloyDB>` blocks on the ambient tokio runtime, which
# requires a multi-thread runtime (`CurrentThread` returns `None`).
tokio = { version = "^1.53", features = ["macros", "rt-multi-thread"] }
# `test-utils` gates `AlloyProvider::from_provider` (the mock-transport
# constructor) so the §4.2 wire-shape tests + the parity fixture can drive the
# typed dispatch without a live RPC. Production builds (the umbrella, the
# cdylib) never enable this feature.
degenbot-rpc = { path = "../degenbot-rpc", features = ["test-utils"] }
# `compute_simulation_warmup_slots` + the `PathInfo`/`HopInfo`/`V2HopInfo`/
# `EncodeOptions` types the smoke test's `SimulatePath` fixture constructs.
degenbot-executor = { path = "../degenbot-executor" }
# `DexVariant` for the `BotStateDb` tripwire tests (register a tracked V2 pool
# so `pool_id_by_address` resolves) — dev-only, no production linkage.
degenbot-uniswap = { path = "../degenbot-uniswap" }
# `IntHopState` — the executor grammar harness computes byte-consistent V2
# hop outputs from the seeded reserves (mirroring the tier-3 V2 oracle) so the
# encoded path round-trips cleanly (UQOAHA).
degenbot-v2-math = { path = "../degenbot-v2-math" }
