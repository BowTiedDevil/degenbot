# Cross-surface config acceptance ledger (task BZ6W4Y) fixed operator file.
#
# The Rust half (config_parity_oracle.rs) resolves this file through
# `degenbot-config` and writes the verdicts to `oracle.json`; the Python half
# (tests/test_config_parity.py) resolves the SAME file + environment through
# `degenbot._ffi` and compares. The file is the only layer either side passes
# beyond the environment recorded per case, so a resolver regression, a stale
# or foreign holder install, or an unknown-layer provenance map shows up as a
# disagreement rather than agreeing with itself.
#
# Layout of the entries, by case:
#   chain 101 (http)              -> file_only_request
#   chain 102 (ipc) + env http    -> env_http_beats_file_ipc
#   chain 103 (http)              -> subscription_never_selects_http
#   chain 104 (ws)                -> file_ws_subscription
#   chain 105 (ipc + http)        -> file_ipc_preferred_request

[nodes]
http = { 101 = "http://file-101.example:8545", 103 = "http://file-103.example:8545", 105 = "http://file-105.example:8545" }
ws = { 104 = "ws://file-104.example:8546" }
ipc = { 102 = "/tmp/file-102.ipc", 105 = "/tmp/file-105.ipc" }
