[package]
name = "degenbot-substrate"
description = "The strategy substrate: BotState (the live state owner), the planning workspace, pool ingress, the connector index, and executor hop views."
keywords = ["mev", "arbitrage", "bot", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5", features = ["full", "transport-throttle"] }
async-trait = { version = "^0.1" }
dashmap = { version = "^6.2" }
hashbrown.workspace = true
indexmap.workspace = true
degenbot-config.workspace = true
degenbot-core.workspace = true
degenbot-db.workspace = true
degenbot-decoders.workspace = true
degenbot-executor.workspace = true
degenbot-ingestion.workspace = true
degenbot-math.workspace = true
degenbot-pathfinding.workspace = true
degenbot-pool-updater.workspace = true
degenbot-pools.workspace = true
degenbot-rpc.workspace = true
degenbot-uniswap.workspace = true
hotpath = { version = "^0.29.0", default-features = false }
parking_lot = { version = "^0.13" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
tokio = { version = "^1.54", features = ["rt-multi-thread", "time", "macros", "sync"] }

[features]
# The foreign-crate state-seeding door (`BotState::seed_v3_pool_ticks_for_test`).
# A consumer's dev-dependency enables it so its harnesses can seed pool state
# the production registration path cannot produce; production builds never
# compile it. In-crate tests reach the same door through `cfg(test)`.
test-fixtures = []

[dev-dependencies]
proptest = "^1.12"
rusqlite = { version = "^0.40", features = ["bundled"] }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
tokio = { version = "^1.54", features = ["test-util"] }
degenbot-rpc = { workspace = true, features = ["test-utils"] }
