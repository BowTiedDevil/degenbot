[package]
name = "degenbot-rpc"
description = "Pure-Rust Ethereum RPC provider, contract interface, and subscription core."
keywords = ["ethereum", "rpc", "evm", "subscriptions"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.6", features = ["full", "transport-throttle", "json-rpc"] }
# Tick-bootstrap structs for degenbot-pools now carry hashbrown maps.
hashbrown.workspace = true
dashmap = { version = "^6.2" }
degenbot-abi.workspace = true
degenbot-math.workspace = true
degenbot-core.workspace = true
# The strategy-readiness default channel has one home (degenbot-config);
# the feed crate re-exports it.
degenbot-config.workspace = true
degenbot-eventhub.workspace = true
degenbot-pools.workspace = true
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
parking_lot = { version = "^0.13" }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
tokio = { version = "^1.54", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Backrun feed: MEVBlocker searcher WS. Version tracks the
# graph (alloy-transport-ws pulls 0.29); TLS via rustls webpki roots.
tokio-tungstenite = { version = "^0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "^0.5", default-features = false }

# Cassette artifact packaging (`src/cassette.rs`): the committed cassettes ship
# as zstd-framed `.json.zst` packages. Optional for the same reason
# `degenbot-pools` keeps `capture-fixtures` optional (ADR-084 D3): the
# pure-Rust tree compiles no zstd by default, and the recording, replay, and
# drift-gate lanes are the ones that opt in.
zstd = { workspace = true, optional = true }

[dev-dependencies]
# The in-crate corpus tests read the committed `.json.zst` cassettes, so the
# test target builds this crate's own `cassette-artifacts` lane.
degenbot-rpc = { path = ".", features = ["cassette-artifacts"] }
# The IPC guard test binds a fake node on a real Unix socket.
tempfile = { version = "^3.27" }
# Virtual time: the simulation call policy's ceiling is asserted against a
# >2s response without a real 2s sleep (`#[tokio::test(start_paused = true)]`).
tokio = { version = "^1.54", features = ["test-util"] }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "registry"] }

[features]
default = []
# The cassette artifact codec: pack canonical cassette bytes into a committed
# `.json.zst` package and decode one back. Real recorders, replay suites, and
# the drift gates enable it; nothing in the product tree needs it.
cassette-artifacts = ["dep:zstd"]
# Test-only support visible to downstream crates' tests: the pending-tx pump's
# frame injection (`PendingTxPump::push`), the subscription item injection
# (`SubscriptionHandle::push_item`), and the ring sender they need. In a
# library crate `#[cfg(test)]` is not visible to consumers' tests, so this
# feature is the seam. `AlloyProvider::from_provider` is not part of it — that
# constructor is ungated, because the offline provider builds on it at runtime.
test-utils = []
