[package]
name = "degenbot-executor"
description = "Pure-Rust cmd-executor domain — simulation warmup-slot storage math (Solidity mapping-slot keccak layout)."
keywords = ["mev", "evm", "execution", "encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
degenbot-abi.workspace = true
degenbot-core.workspace = true
# The neutral opportunity descriptors (`PathInfo` / `HopInfo` / the family hop
# payloads) — the seam's Encode intake, which the command grammar consumes
# (ADR-098 D1). The built-in executor depends on the seam, never the reverse.
degenbot-execution.workspace = true
# The release manifest (`src/release.rs`) is committed JSON: deserialize it
# strictly (`deny_unknown_fields`) and validate every cross-reference.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }

[dev-dependencies]
proptest = "^1.12"
