[package]
name = "degenbot-execution"
description = "The ExecutionAdapter seam (ADR-025) — a pyo3-free crate owning the user-owned execution layer: the ExecutionAdapter trait + its value types (solve-result view, gate protocol, ExecutionResult, ComposerInputs) and the PayloadComposer Encode part. No default strategy ships here."
keywords = ["mev", "execution", "evm", "transactions"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
# The declared contract interface (ADR-100 D2) reads standard ABI JSON. `alloy`'s
# `json-abi` feature re-exports that module but not the `serde_json`-gated
# `JsonAbi::from_json_str` parser, so the alloy family's own ABI crate carries
# that one feature here: the crate is already in the graph through `alloy`, so
# no new dependency enters the lock, and no serde type is named in this crate's
# code or its public API (the parse error renders with `to_string()`).
alloy-json-abi = { version = "^1.7", features = ["serde_json"] }
thiserror = { version = "^2.0" }
# The neutral opportunity descriptors (`PathInfo` / `HopInfo`, ADR-098 D1) are
# this crate's own; the built-in `cmd_executor` implementation depends on this
# seam, never the reverse.
# `SolvePathResult` (amounts) — the solve-result view's amount side (ADR-025 D4).
degenbot-pools.workspace = true
