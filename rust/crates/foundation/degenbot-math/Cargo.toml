[package]
name = "degenbot-math"
description = "Pure-Rust ports of canonical AMM invariant math — Uniswap V2 constant-product, V3/V4 concentrated liquidity, Curve StableSwap, Balancer (fixed-point/log-exp/weighted/stable), and Solidly/Aerodrome/Camelot stable pools. One crate, five family modules (v2, cl, curve, balancer, solidly); ADR-035."
keywords = ["amm", "uniswap", "curve", "balancer", "solidly"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
hashbrown.workspace = true
degenbot-core.workspace = true

[dev-dependencies]
proptest = "^1.12"
serde_json = "^1.0"
criterion = { version = "^0.8", default-features = false, features = ["cargo_bench_support"] }
# Tier-3a byte-exact oracle (cl module): the SwapMath harness executes on
# evm2's in-memory DB (ADR-091). Dev-only, so the no-pyo3-in-cores check is
# unaffected.
# No `version` key: `cargo publish` strips git-only dev-deps at packaging, while a
# `version` becomes a registry requirement that must resolve on crates.io (ADR-089).
evm2 = { git = "https://github.com/alloy-rs/evm2", branch = "main", default-features = false, features = [
    "asm-keccak",
    "blst",
    "c-kzg",
    "secp256k1",
    "serde",
] }
# The oracle builds its fixture transactions as EIP-1559 envelopes, so the
# test build needs alloy's consensus types.
alloy = { version = "^2.5", features = ["consensus"] }

[[bench]]
name = "swap"
harness = false

[[bench]]
name = "stableswap"
harness = false

[[bench]]
name = "leaves"
harness = false
