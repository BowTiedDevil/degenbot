[package]
name = "degenbot-price"
description = "Pure-Rust on-chain price readers — Chainlink aggregator + Aave oracle over degenbot-rpc eth_call."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.3" }
degenbot-core = { path = "../degenbot-core" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-rpc = { path = "../degenbot-rpc" }
tracing = { version = "^0.1" }
thiserror = { version = "^2.0" }

# Gated (not default) so pure-Rust consumers build without pulling pyo3.
# Enables `impl From<degenbot_price::PriceError> for pyo3::PyErr` so the
# `degenbot-python` binding layer can `?`-propagate reader errors as a
# `PyErr` (mirrors `degenbot-core`/`degenbot-rpc`'s `pyo3` feature).
pyo3 = { version = "^0.29", features = ["abi3-py312", "serde"], optional = true }

[features]
default = []
# Enables `impl From<PriceError> for pyo3::PyErr`. Enabled by the
# `degenbot-python` binding crate; never enabled by the umbrella.
pyo3 = ["dep:pyo3"]
