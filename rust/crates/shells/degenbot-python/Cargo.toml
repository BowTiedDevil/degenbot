[package]
name = "degenbot_rs"
description = "Rust implementations used by the degenbot Python package."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "degenbot_rs"
crate-type = ["rlib", "cdylib"]

# The PyO3 binding layer (cdylib) over the pyo3-free core crates. It is a
# workspace member at `rust/crates/shells/degenbot-python/`, beside the Rust-facing
# core roles rather than implementing product behavior. The workspace
# root `rust/Cargo.toml` is a pure virtual manifest (ADR-005 deferral —
# the binding layer lifted out of the workspace root).

[dependencies]
degenbot-config.workspace = true
alloy = { version = "^2.5", features = ["full", "transport-throttle"] }
# The workspace dependency enables the `pyo3` feature so `From<Error> for PyErr`
# conversions from core are available at this binding layer.
degenbot-rpc = { workspace = true, optional = true }

degenbot-bot = { workspace = true, optional = true }
# (5WTYYQ) The WS-ingestion event surface the bot-driven pump consumes.
degenbot-ingestion = { workspace = true, optional = true }
degenbot-solvers = { workspace = true, optional = true }
degenbot-pools.workspace = true
degenbot-decoders = { workspace = true, optional = true }
degenbot-uniswap = { workspace = true, optional = true }
degenbot-abi = { workspace = true, optional = true }
degenbot-math = { workspace = true, optional = true }
degenbot-db = { workspace = true, optional = true }
degenbot-pathfinding = { workspace = true, optional = true }
degenbot-price = { workspace = true, optional = true, features = ["pyo3"] }
degenbot-submission = { workspace = true, optional = true, features = ["pyo3"] }
# The concrete strategy compositions (the backrun arm) the hosted boot
# registers on the strategy host. Reaches down into the core crates; nothing
# outside the binding/CLI/umbrella depends on it.
degenbot-strategy = { workspace = true, optional = true }
degenbot-simulation = { workspace = true, optional = true }
degenbot-workers = { workspace = true, optional = true }
revm = { version = "^43.0", default-features = false }
degenbot-arbitrage = { workspace = true, optional = true, features = ["order-index"] }
degenbot-executor = { workspace = true, optional = true }
degenbot-execution = { workspace = true, optional = true }
degenbot-fork = { workspace = true, optional = true }
degenbot-pool-updater = { workspace = true, optional = true }
degenbot-aave = { workspace = true, optional = true }
degenbot-core = { workspace = true, features = ["pyo3"] }
# ADR-051 D3: the Python console is a passthrough, so the binding depends on
# the argv facade (degenbot-cli, which owns the ONE clap tree + the console
# sinks) and its clap-free semantics crate (degenbot-cli-core, for
# CancelHandle + the single run_with_cancel entry). Both are pyo3-free cores;
# the binding layer reaches UP into the console, never the reverse.
degenbot-cli.workspace = true
degenbot-cli-core.workspace = true
dashmap = { version = "^6.2" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
log = { version = "^0.4" }
lru = { version = "^0.18" }
mimalloc = { version = "0.1", optional = true }
# Engine-slice map type mirrors the core hashbrown maps.
hashbrown.workspace = true
parking_lot = { version = "^0.12" }
pyo3 = { version = "^0.29", features = [ "abi3-py312", "serde", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "^0.29", features = ["tokio-runtime"] }
crossbeam-queue = { version = "^0.3" }
# argv parsing at the Python seam: the Parser::try_parse_from trait the
# console's OWN clap tree exposes (the binary uses <Cli as Parser>::parse).
clap = { version = "4.6", features = ["derive"] }
tracing = { version = "^0.1" }
tracing-log = { version = "^0.2" }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry", "alloc"] }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }
toml = "1.1.6"
degenbot-eventhub.workspace = true

[features]
# Per-domain binding-layer features. Each gates its optional
# optional core-crate dependency + the corresponding binding module/mod registrations, mirroring
# how polars gates polars-python with features matching polars-core/-plan/etc.
# Default = all-on (byte-equivalent to the pre-feature surface). Implicit coupling:
# `bot` implies `rpc`+`decoders`+`uniswap`
# (the engine wrapper references degenbot_rpc::provider::AlloyProvider + degenbot_decoders::PoolId
# + degenbot_uniswap::dex_identity directly), and `rpc` implies `abi` (rpc/contract wraps
# crate::abi_types). `async` gates the rpc/ async submodules (no new dep).
# The `degenbot-arbitrage` dep spec carries `features = ["order-index"]`, so
# every `simulation` build (default) gets ADR-024's deterministic profit-
# descending pre-sim selection inside `dispatch_profitable`.
default = ["auto-initialize", "bot", "rpc", "price", "submission", "simulation", "abi", "concentrated-liquidity-math", "balancer-math", "curve-math", "solidly-math", "v2-math", "uniswap", "pathfinding", "async", "db", "executor", "execution", "pool", "aave-updater", "fork"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]
# FF-T1: `bot` also names degenbot-workers — the intake seam maps
# the workers' typed BootError family onto the BootRefused exception at
# the pyo3 leaf (the simulation feature already pulled the dep; bot-only
# builds now name the type too).
bot = ["dep:degenbot-bot", "dep:degenbot-ingestion", "dep:degenbot-solvers", "dep:degenbot-workers", "rpc", "decoders", "uniswap"]
price = ["dep:degenbot-price", "rpc"]
submission = ["dep:degenbot-submission", "dep:degenbot-strategy", "rpc"]
simulation = ["dep:degenbot-simulation", "dep:degenbot-arbitrage", "dep:degenbot-workers", "rpc", "executor", "submission"]
executor = ["dep:degenbot-executor"]
execution = ["dep:degenbot-execution", "executor"]
fork = ["dep:degenbot-fork"]
rpc = ["dep:degenbot-rpc", "abi"]
abi = ["dep:degenbot-abi"]
concentrated-liquidity-math = ["dep:degenbot-math"]
db = ["dep:degenbot-db"]
pool = ["dep:degenbot-pool-updater", "db", "rpc"]
aave-updater = ["dep:degenbot-aave", "db", "rpc"]
balancer-math = ["dep:degenbot-math"]
curve-math = ["dep:degenbot-math"]
solidly-math = ["dep:degenbot-math"]
v2-math = ["dep:degenbot-math"]
uniswap = ["dep:degenbot-uniswap"]
decoders = ["dep:degenbot-decoders"]
pathfinding = ["dep:degenbot-pathfinding"]
async = []
# mimalloc fixes OOM under bursty allocation vs. the default system allocator.
# local_dynamic_tls is REQUIRED: its default initial-exec TLS model must fit in
# glibc's ~1664-byte static TLS surplus at dlopen() time, which fails whenever
# any other extension module (e.g. pytest) is imported first —
# "ImportError: cannot allocate memory in static TLS block". The dynamic
# TLS model routes the per-thread heaps through the DTV instead. Do not drop
# this feature unless the initial-exec relocation count of _ffi.abi3.so
# (readelf -rW .../abi3.so | grep -c TPOFF64) is verifiably still zero.
mimalloc = ["dep:mimalloc", "mimalloc/local_dynamic_tls"]
# OTel span export for the Python-driven path: pulls degenbot-bot
# with its `otel` feature (OTLP exporter + layer). NOT in `default` -
# release/CI wheels must not ship the OTLP client footprint (same
# exclusion story as hotpath; pyproject [tool.maturin] dev builds enable it).
otel = ['bot', 'degenbot-bot/otel']

[dev-dependencies]
ctor = "^1"
proptest = "^1.11"
# Enable test-only constructors (e.g. `AlloyProvider::from_provider`) for
# the root crate's tests. Production builds pull degenbot-rpc without this
# feature.
degenbot-rpc = { workspace = true, features = ["test-utils"] }

# Seam-C test seam: InMemorySpanExporter. Same version lock as
# degenbot-bot (tracing-opentelemetry 0.33 <-> opentelemetry(-sdk) 0.32).
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }

[[test]]
name = "python_integration"
required-features = ["auto-initialize"]

[[test]]
name = "concurrency_stress"
required-features = ["auto-initialize"]
