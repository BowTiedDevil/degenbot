[package]
name = "degenbot-arbitrage"
description = "The settlement-arbitrage searcher strategy — the 7-call pre/post-balance bundle, gross/net + priority-fee sizing, dispatch fan-out + categorization policy. One example strategy over the degenbot-simulation engine (ADR-019 D4/D7; pyo3-free Rust core)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The simulation engine (revm executor, BlockSimHandle, overrides, AL, warm
# cache). This crate is ONE strategy over the engine — it builds the 7-call
# vector, drives `BlockSimHandle`'s EVM, decodes balances, sizes the priority
# fee, + runs the fan-out/categorization policy. ADR-019 D4/D7: the engine
# stays thin + generic; the settlement-arbitrage bundle is this strategy's concern, not the
# engine's.
degenbot-simulation = { path = "../degenbot-simulation" }
# `BotState` (ADR-003 state owner) — the snapshot surface the dispatch
# fan-out reads via `BlockSimHandle`.
degenbot-bot = { path = "../degenbot-bot" }
# `PathInfo` / `HopInfo` / `EncodeOptions` / `WarmupSlots` / the
# `compute_simulation_warmup_slots` the candidate + context consume.
degenbot-executor = { path = "../degenbot-executor" }
# `PathSuppression` (the dispatcher's per-path suppression ring) +
# `SubmitCandidate` (the submission seam's input shape — the dispatch joins
# survivors into it).
degenbot-submission = { path = "../degenbot-submission" }
# `AlloyProvider` — the typed RPC provider `SimulateContext` borrows (the
# cold-miss fallback underneath the engine's CacheDB).
degenbot-rpc = { path = "../degenbot-rpc" }

# `V4PoolId` (the V4 swap-event decoder's pool-id type) + `encode_rust`
# (the pure-Rust ABI encoder for the balance-call calldata).
degenbot-decoders = { path = "../degenbot-decoders" }
# `encode_rust` / `AbiValue` — the pure-Rust ABI encoder for the 7-call
# balance-call calldata builders (balanceOf / getEthBalance / ERC6909).
degenbot-abi = { path = "../degenbot-abi" }
# `ProviderError` / `ProviderResult` / `AbiDecodeError` — the shared error
# types `simulate_path_on_evm` + the calldata builders return.
degenbot-core = { path = "../degenbot-core" }
# revm — the EVM trait bounds `simulate_path_on_evm<E: ExecuteEvm +
# InspectEvm<...>>` carries (the strategy drives the borrowed `&mut E`
# the engine exposes via `BlockSimHandle::evm_mut`).
revm = { version = "^42.0", default-features = true, features = ["alloydb", "asyncdb"] }
alloy = { version = "^2.4" }
parking_lot = "^0.12"
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# The net-profit order index — used (feature `order-index`) to make the pre-sim
# top-K selection deterministic by profit instead of trusting the caller's
# pre-sort (see ADR-024). Optional: default off for direct crate builds only;
# both consumer paths — the `degenbot` umbrella and the `degenbot_rs` cdylib
# — enable it (B5L2XA).
degenbot-order-index = { path = "../degenbot-order-index", optional = true }

[features]
# Deterministic profit-descending (+ id tie-break) pre-sim selection via
# degenbot-order-index, replacing the "candidates arrive pre-sorted" contract.
# Default off so a direct crate build keeps the caller's pre-sort contract;
# both consumer paths (the `degenbot` umbrella + the `degenbot_rs` cdylib)
# enable it (B5L2XA).
order-index = ["dep:degenbot-order-index"]

[dev-dependencies]
tokio = { version = "^1.53", features = ["macros", "rt"] }
degenbot-rpc = { path = "../degenbot-rpc", features = ["test-utils"] }
serde_json = { version = "^1.0" }
