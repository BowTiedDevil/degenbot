[package]
name = "degenbot-executor"
description = "Pure-Rust cmd-executor domain — simulation warmup-slot storage math (Solidity mapping-slot keccak layout)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.3" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-core = { path = "../degenbot-core" }
thiserror = { version = "^2.0" }

[features]
# ADR-031 walker: the facts-driven Plan walker is the sole producer.
# Kept as a named (default) feature for A3 compatibility; the dispatch no
# longer branches on it (the reference build_*_plan producers are removed).
default = ["walk"]
walk = []

[dev-dependencies]
proptest = "^1.11"
