[package]
name = "degenbot-fork"
description = "Pure-Rust Anvil fork lifecycle + dev-RPC core (alloy node-bindings)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# NOTE: `"node-bindings"` MUST be explicit — alloy's `full` feature array
# (v2.1.1) includes `provider-ipc` + `provider-anvil-api` but NOT
# `node-bindings`. Without it, `alloy::node_bindings::Anvil` is unresolved
# (cfg-gated re-export in alloy/src/lib.rs). Verified by the IPC spike.
alloy = { version = "^2.4", features = ["full", "node-bindings", "transport-throttle"] }
degenbot-core.workspace = true
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }

[features]
default = []
# Test-only constructors visible to downstream crates' tests.
test-utils = []
