[package]
name = "degenbot-submission"
description = "Pure-Rust EIP-1559 transaction signing + fee finalization — operator-key holding LocalSigner + TxEnvelope/Typed2718 type-2 encoding."
keywords = ["mev", "eip-1559", "signing", "transactions"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
alloy = { version = "^2.4", features = ["full", "signer-local", "network"] }
degenbot-core.workspace = true
# The typed config schema + 12-factor loader: the sidecar bin sources every
# migrated knob from the loaded `BotConfig` (strategy.backrun facet +
# logging artifacts) and resolves the chain-node join through the shared
# `DEGENBOT_RPC_HTTP_CHAINID_<id>`/`DEGENBOT_DB_PATH` resolvers.
degenbot-config.workspace = true
# T4 economics metrics record through the bot crate's instruments module —
# one-way (bot never depends on submission); default builds get the inert
# stub twin so this adds no metrics code without the `otel` feature.
degenbot-bot.workspace = true
# `AlloyProvider` (the typed `eth_sendRawTransaction`/`eth_feeHistory`/
# `eth_createAccessList` surfaces the N6 submit orchestration consumes —
# ZUZANP typed, no `make_request` escape hatch).
degenbot-rpc.workspace = true
# Per-session run artifacts: the sidecar's stdout fmt sink and the default
# JSONL trace path. The `tracing` feature supplies the MakeWriter bridge.
degenbot-runs = { workspace = true, features = ["tracing"] }
# The frame pipeline (WKPZQK): frame-replay seam + journal-pool extraction
# (degenbot-simulation) over the bot crate's workspace/planning scope.
degenbot-simulation.workspace = true
# The zero-warmup `WarmupSlots` the frame-replay handle's override set rides.
degenbot-executor.workspace = true
# The journal extractor's descriptor-map type (`extract_pool_post_states`).
hashbrown.workspace = true
# Slot layouts (V2 reserves slot, CL slot0/tick layouts) + `ClSlotLayout`.
degenbot-pools.workspace = true
# `WarmCodeCacheInner::shared_default()` returns a parking_lot RwLock.
parking_lot = "^0.12" 
degenbot-decoders.workspace = true
# The sidecar bin's DB-backed connector index (DFYDYI B3) reads the
# workspace DB once at startup.
degenbot-db.workspace = true

# V3 pool CREATE2 resolution (the router wire never names the pool).
degenbot-uniswap.workspace = true
thiserror = { version = "^2.0" }
# OTel tier-1 spans (RMHQAR, epic 2LXPPV): plain `tracing` spans - the
# process-wide subscriber (degenbot-bot/degenbot-python) exports them;
# no OTel dependency here (core-crate rule).
tracing = { version = "^0.1" }
# Console subscriber for the sidecar bin (observe-mode visibility; the
# OTel layering is the bot crates job).
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "registry", "fmt", "env-filter"
, "time"
] }
# Async runtime for the dispatcher's `active_tasks` `JoinSet` (auto-discards
# completed tasks) + the by-reference `current_block` `Mutex<u64>` clock read
# across consumer/monitor task boundaries (ADR-005 standalone core).
tokio = { version = "^1.53", features = ["rt", "sync", "time", "macros"] }

# The anchored touched-set discovery walker: the frame pipeline's cycle
# finder runs the shared pathfinding DFS over the connector index's edge set.
degenbot-pathfinding.workspace = true

# Gated (not default) so pure-Rust consumers build without pulling pyo3.
# Enables `impl From<degenbot_submission::SubmissionError> for pyo3::PyErr` so
# the `degenbot-python` binding layer can `?`-propagate signing/fee errors as a
# `PyErr` (mirrors `degenbot-core`/`degenbot-price`'s `pyo3` feature).
pyo3 = { version = "^0.29", features = ["abi3-py312", "serde"], optional = true }

# Backrun bundle submission (GSUF22): WS relay to searchers.mevblocker.io.
serde_json = { version = "^1.0" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
tokio-tungstenite = { version = "^0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
# `test-utils` gates `AlloyProvider::from_provider` (the mock-transport
# constructor) so the §4.2 wire-shape tests can drive the submit orchestration
# without a live RPC. Production builds (the umbrella, the cdylib) never
# enable this feature.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# The frame-pipeline fixture test hand-builds `ReplayOutcome` journals
# (revm state) to drive replay→extract→admit→solve end-to-end offline.
revm = { version = "^43.0", default-features = false, features = ["std"] }
serde_json = { version = "^1.0" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
tokio-tungstenite = { version = "^0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
proptest = "^1.11"

[features]
default = []
# Enables `impl From<SubmissionError> for pyo3::PyErr`. Enabled by the
# `degenbot-python` binding crate; never enabled by the umbrella.
pyo3 = ["dep:pyo3"]
