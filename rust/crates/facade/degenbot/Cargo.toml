[package]
name = "degenbot"
description = "Umbrella Rust crate: re-exports the pyo3-free degenbot core surface (Bot state, DexIdentity presets, calc math) for standalone Rust consumers."
keywords = ["mev", "arbitrage", "evm", "uniswap", "bot"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The umbrella is pure-Rust: it pulls ONLY the pyo3-free core crates and
# re-exports them. It has NO `pyo3` dependency (verified by
# `rg 'use pyo3' rust/crates/facade/degenbot` — empty). A standalone Rust consumer
# `cargo add degenbot` gets `BotState`/`DexIdentity`/presets/calc with zero
# Python in the build graph (ADR-005 standalone claim, made concrete by
# `examples/standalone_consumer.rs`). The binding layer (`degenbot_rs` cdylib,
# built from `crates/shells/degenbot-python/`) is a separate workspace member that
# DOES pull pyo3; the umbrella never depends on it.
[dependencies]
alloy = { version = "^2.6", features = ["full"] }
serde = { version = "^1.0", features = ["derive"] }
degenbot-config.workspace = true
degenbot-aave.workspace = true
degenbot-abi.workspace = true
degenbot-math.workspace = true
hashbrown.workspace = true
degenbot-bot.workspace = true
degenbot-core.workspace = true
degenbot-ingestion.workspace = true
degenbot-db.workspace = true
degenbot-decoders.workspace = true
degenbot-execution.workspace = true
degenbot-executor.workspace = true
degenbot-fork.workspace = true
# The net-profit order index — re-exported for standalone consumers; the
# `degenbot-arbitrage` edge below enables its `order-index` feature so
# `dispatch_profitable` gets the deterministic pre-sim selection in every
# umbrella build (ADR-024).
degenbot-order-index.workspace = true
degenbot-pathfinding.workspace = true
degenbot-pool-updater.workspace = true
degenbot-pools.workspace = true
degenbot-price.workspace = true
degenbot-primitives.workspace = true
degenbot-rpc.workspace = true
# Per-session run artifacts (stdout log + trace JSONL) - engine-general and
# pyo3-free; standalone consumers reach it as `degenbot::runs`.
degenbot-runs.workspace = true
degenbot-simulation.workspace = true
degenbot-arbitrage = { workspace = true, features = ["order-index"] }
# The core batch executor (the per-batch dispatch choreography both
# first-class consumers drive) — re-exported as `degenbot::batch_executor`.
degenbot-batch-executor.workspace = true
degenbot-strategy.workspace = true
degenbot-submission.workspace = true
degenbot-substrate.workspace = true
degenbot-uniswap.workspace = true
# The role-switching worker fleet (ADR-042): FSM, budget authority,
# bounded priority dispatch, cordon posture — pyo3-free core for the
# standalone Rust consumer.
degenbot-workers.workspace = true
degenbot-eventhub.workspace = true

# The JIT's carriage is TARGET-SCOPED, not a feature: features on a
# platform-specific dependency declaration are additive and unify into the same
# package, so `degenbot-simulation` carries `evm2-jit` on Linux and nothing else
# on macOS/Windows. `cargo add degenbot` therefore gets the same engine the
# Python driver gets on Linux (ADR-089: the engine ships on, at the cost of the
# LLVM 23 link), and a non-Linux build links no LLVM. The runner arms itself from
# `simulation.sim_jit` (default true; `DEGENBOT_SIM_JIT=false` runs the
# interpreter); where no runner was compiled in, `shared_runner()` is a
# compile-time `None` and every frame interprets — the fail-soft contract.
[target.'cfg(target_os = "linux")'.dependencies]
degenbot-simulation = { workspace = true, features = ["evm2-jit"] }

[features]
# No feature is on by default: the JIT arrives through the target scope above,
# and every remaining feature here is an opt-in passthrough.
default = []

# OTel observability passthrough (Gap G6): forward
# `degenbot-bot/otel` so a `cargo add degenbot, features = ["otel"]`
# consumer reaches `degenbot::bot::{otel, metrics, instruments}`. Those
# modules are `#[cfg(feature = "otel")]` in degenbot-bot, so without this
# passthrough they are unreachable through the umbrella — the gap that left
# the pure-Rust settlement-bot example with no telemetry at all.
otel = ["degenbot-bot/otel"]
# Drain-path profiling passthrough: forwards `degenbot-bot/hotpath` so a
# `cargo add degenbot, features = ["hotpath"]` consumer compiles the
# `#[hotpath::measure]` spans on the pump → EngineStages solve path as real
# instrumentation and the pump-lifetime guard (`BlockPump::run_with_stream`,
# degenbot-bot/src/profiling.rs) flushes its report. Without this forward the
# spans stayed compile-time no-ops through the umbrella — the gap that left
# the pure-Rust settlement-bot example unable to flush a hotpath report at
# all. The guard itself stays env-gated (`DEGENBOT_HOTPATH=1`): the feature
# widens what CAN be measured, never what default runs do. The narrower
# variants (`hotpath-cpu`/`hotpath-alloc`/`hotpath-prometheus`) stay
# unforwarded — they tune profiling posture, not consumer reachability.
hotpath = ["degenbot-bot/hotpath"]
# The replay bench's statement-ledger passthrough (ADR-068 D6 measurement):
# forwards to degenbot-db's test/bench-only SQL ledger feature. Default OFF,
# mirroring degenbot-db (the ledger never compiles into production paths).
sql-ledger = ["degenbot-db/sql-ledger"]

# The replay bench (GLOSSARY "replay bench", ADR-068 D6) measures the
# statement ledger, so it only builds under the `sql-ledger` passthrough —
# `just bench-updaters` is the one command that sets it.
[[bench]]
name = "updater_replay_bench"
harness = false
required-features = ["sql-ledger"]

# The wave-2 EVM-oracle and wave-3 aave-side adversarial capture generators used
# to live here as `sql-ledger` examples. They are fixture tooling, not consumer
# starting points, so the fixture-tools migration moved them into
# `rust/tools/fixture-tools/src/bin/<name>/main.rs` as `[[bin]]` targets of
# `degenbot-fixture-tools` (each still carrying `required-features =
# ["sql-ledger"]`, now on the tool package's lane). `just check-evm-captures` /
# `just check-aave-captures` run those binaries and are unchanged as recipes.

# The two live Aave span recorders (`generate_aave_upgrade_windows` for the wave-4
# upgrade spans, `generate_aave_config_windows` for the wave-5 config-dispatch spans)
# used to live here as `sql-ledger` examples. They are fixture tooling, not consumer
# starting points, so the fixture-tools migration moved them into
# `rust/tools/fixture-tools/src/bin/<name>/main.rs` as `[[bin]]` targets of
# `degenbot-fixture-tools`, each still carrying `required-features = ["sql-ledger"]`
# on the tool package's lane. They drove the live chunk loop and replayed their SQL
# goldens through the statement-ledger wrapper here, and they do exactly that from
# their new home: a default-features target sweep must skip them instead of dying on
# E0432 (`sql_ledger` is cfg'd out of degenbot-db). Their usage blocks carry the
# current invocation.
#
# The live updater cassette recorder (`record_updater_cassette`) used to live here as a
# default-features example -- it reads no statement ledger, so it never carried a
# feature requirement. The fixture-tools migration moved it into
# `rust/tools/fixture-tools/src/bin/record_updater_cassette/main.rs` as a `[[bin]]`
# target of `degenbot-fixture-tools` with NO `required-features`, so
# `just check-dev-tools default` builds it and its `--check` arm stays offline (no
# secret `sql-ledger` requirement). Its pool / Aave / `--verify` / `aave-run` kinds,
# the configured-node resolution, the canonical cassette writer, and the argv surface
# are unchanged; its usage block carries the current invocation. The example file is
# gone with the move, so the two dev-dependency edges below are the replay bench's
# alone.
#
# The Python oracle corpus recorder (`record_py_oracle_corpus`) used to live here as a
# default-features example too -- it reads no statement ledger, so it never carried a
# feature requirement. It is fixture tooling for the fork-bound parity tests rather than
# a consumer starting point, so the same migration moved it into
# `rust/tools/fixture-tools/src/bin/record_py_oracle_corpus/main.rs` as a second
# `[[bin]]` with NO `required-features` (it opens no operator DB either), which
# `just check-dev-tools default` builds. Its scenario wiring, committed golden-key
# derivation, pinned blocks and addresses, wire-answer projection (revert-as-`null`),
# two-pass byte-identity gate, ordered endpoint pools with bounded rotation, `--check`
# arm, node override flags, and per-chain output paths travelled with the source; the
# invocation and the path anchor changed (the package's shared `paths` resolver replaces
# this crate's manifest-relative arithmetic, and `--fixtures-home` replaces `--root`).
# Its `serde` derive edge was the one direct dependency the tool package lacked, so it
# moved with it.
#
# The path-fixture recapture (`capture_path_fixture`) was the last fixture recorder to
# live here, and it moved the same way: `examples/capture_path_fixture.rs` is gone and
# `rust/tools/fixture-tools/src/bin/capture_path_fixture/main.rs` is a `[[bin]]` with NO
# `required-features` (it opens no statement ledger and no operator DB), so
# `just check-dev-tools default` builds it. Nothing about the recapture changed -- the V2
# scalar read, the V3 TickLens/bitmap scan and the V4 StateView read with their overrides,
# the Multicall3 batching, the configured-node resolution, the authored identity/narrative
# preservation, the canonical serde output, the repeatable fixture arguments, and
# `--check`'s non-mutating drift verdict all travelled with the source. It needed no
# dependency edge of its own (`alloy`, `serde_json`, and `tokio` were already plain edges)
# and no path re-anchor: every fixture is an explicit positional argv path, so no
# `--fixtures-home` was invented for it. The fixture schema and the `capture` /
# `chain_capture` / `fixture` library are owned by `degenbot-simulation`
# (`degenbot_simulation::investigation`, re-exported here as `degenbot::investigation`),
# and `tests/tier3_*` still reads its fixtures through `degenbot::investigation`.
#
# The remaining dev-dependency edges below belong to this crate's tests and its one
# retained example (`standalone_consumer`).

[dev-dependencies]

# The replay bench seeds throwaway harness DBs (temp dirs) and drives the raw
# `exchanges` row the replay suites seed (the same UPDATE the suite code runs - no
# `activate_exchange` substrate yet).
rusqlite = { version = "^0.43" }
tempfile = { version = "^3.27" }
async-trait = "0.1"
alloy = { version = "^2.6", features = ["full"] }
# The engine (ADR-089 cutover) — the parity tests drive the evm2 in-memory DB.
# From the vendored fork (rust/vendor/, ADR-096) — test-only, never part of the
# shipped dependency set.
evm2 = { workspace = true, features = ["asm-keccak", "blst", "secp256k1", "serde"] }
tokio = { version = "^1.54", features = ["rt-multi-thread", "macros"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
