[package]
name = "degenbot-pool-updater"
description = "Pure-Rust pool-updater chunk-loop core: typed RPC event fetching + decode-to-row-input mapping."
keywords = ["mev", "pools", "events", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
degenbot-db.workspace = true
# Tick-map types from degenbot-db are hashbrown maps.
hashbrown.workspace = true
degenbot-decoders.workspace = true
# Taxonomy projection (ADR-059 D1): `PoolFamily::from_identity` projects the
# pool family kernel's `Identity` onto the decode family. Pyo3-free core.
degenbot-pools.workspace = true
degenbot-core.workspace = true
degenbot-rpc.workspace = true
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# Plain rusqlite (no `bundled`) — the bundled libsqlite3-sys link is owned
# solely by degenbot-db; here we only need the Connection/Transaction types.
rusqlite = { version = "^0.40" }

[features]
default = []

[dev-dependencies]
alloy = { version = "^2.5" }
# The statement-ledger golden tests capture the chunk apply's SQL through the
# test-only `LedgerDb` wrapper (ADR-068 D3). Dev-only: the feature (and with it
# the trace hooks) never reaches production builds of this crate.
degenbot-db = { workspace = true, features = ["sql-ledger"] }
degenbot-rpc.workspace = true
# The lifecycle contract test parses the JSON-RPC requests its local stub
# node receives (method/route matching only — the crate proper never
# serializes JSON-RPC itself).
serde_json = { version = "^1" }
tempfile = { version = "^3.27" }
