[package]
name = "degenbot-price"
description = "Pure-Rust on-chain price readers — Chainlink aggregator + Aave oracle over degenbot-rpc eth_call."
keywords = ["price", "oracle", "chainlink", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.6" }
degenbot-core.workspace = true
degenbot-abi.workspace = true
degenbot-rpc.workspace = true
tracing = { version = "^0.1" }
thiserror = { version = "^2.0" }

# Gated (not default) so pure-Rust consumers build without pulling pyo3.
# Enables `impl From<degenbot_price::PriceError> for pyo3::PyErr` so the
# `degenbot-python` binding layer can `?`-propagate reader errors as a
# `PyErr` (mirrors `degenbot-core`/`degenbot-rpc`'s `pyo3` feature).
pyo3 = { version = "^0.30", features = ["abi3-py312", "serde"], optional = true }

# The integration test drives the reader over a successful `eth_call` answered
# from recorded chain data: `OfflineProvider` is a real `AlloyProvider` over an
# in-memory transport, so no RPC mock enters the crate and the decode path under
# test is the one a node feeds.
[dev-dependencies]
serde_json = { version = "^1.0" }
tokio = { version = "^1.54", features = ["macros", "rt"] }

[features]
default = []
# Enables `impl From<PriceError> for pyo3::PyErr`. Enabled by the
# `degenbot-python` binding crate; never enabled by the umbrella.
pyo3 = ["dep:pyo3"]
