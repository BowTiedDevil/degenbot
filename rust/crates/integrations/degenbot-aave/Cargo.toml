[package]
name = "degenbot-aave"
description = "Pure-Rust Aave V3 domain crate: the updater chunk-loop (transactional apply of decoded Aave events under one rusqlite Transaction) + the position-analysis math (health-factor / LTV / eMode / isolation) + the Aave V3 fixed-point math libraries (WadRayMath / PercentageMath)."
keywords = ["mev", "aave", "lending", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
degenbot-core.workspace = true
degenbot-config.workspace = true
degenbot-db.workspace = true
degenbot-decoders.workspace = true
degenbot-rpc.workspace = true
rusqlite = { version = "^0.40" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros", "sync"] }
tracing = { version = "^0.1" }

[dev-dependencies]
# The golden-capture replay suite (ADR-068): the test-only `LedgerDb`
# wrapper (the `sql-ledger` feature) captures the chunk apply SQL trace;
# temp dirs host the throwaway harness DBs. Dev-only - the feature never
# reaches production builds of this crate.
degenbot-db = { workspace = true, features = ["sql-ledger"] }
tempfile = { version = "^3.27" }
# The wave-3 replay suite's negative probes mutate a recorded answer inside
# the parsed cassette (re-signed through the writer's own digest fn).
serde_json = { version = "^1" }

[features]
default = []
