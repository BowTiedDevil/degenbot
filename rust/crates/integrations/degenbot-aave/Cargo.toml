[package]
name = "degenbot-aave"
description = "Pure-Rust Aave V3 domain crate: the updater chunk-loop (transactional apply of decoded Aave events under one rusqlite Transaction) + the position-analysis math (health-factor / LTV / eMode / isolation) + the Aave V3 fixed-point math libraries (WadRayMath / PercentageMath)."
keywords = ["mev", "aave", "lending", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.6" }
degenbot-core.workspace = true
degenbot-config.workspace = true
# ADR-070: this crate is an updater shell — it owns DB writes, so it is one of
# the four crates allowed to enable the writer substrate. Bot/engine crates
# never do.
degenbot-db = { workspace = true, features = ["writer"] }
degenbot-decoders.workspace = true
degenbot-rpc.workspace = true
rusqlite = { version = "^0.43" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }

[dev-dependencies]
# The golden-capture replay suite (ADR-068): the test-only `LedgerDb`
# wrapper (the `sql-ledger` feature) captures the chunk apply SQL trace;
# temp dirs host the throwaway harness DBs. Dev-only - the feature never
# reaches production builds of this crate.
degenbot-db = { workspace = true, features = ["sql-ledger"] }
# The replay suites read the committed cassettes through the cassette module's
# artifact codec (`.json.zst` packages). Dev-only: the product tree compiles no
# zstd (ADR-084 D3).
degenbot-rpc = { workspace = true, features = ["cassette-artifacts"] }
tempfile = { version = "^3.27" }
# The wave-3 replay suite's negative probes mutate a recorded answer inside
# the parsed cassette (re-signed through the writer's own digest fn).
serde_json = { version = "^1" }
# The scripted chain the activation/verification unit tests read against is an
# alloy `Transport`, which is a `tower::Service`; same declaration as
# `degenbot-rpc`'s.
tower = { version = "^0.5", default-features = false }

[features]
default = []
