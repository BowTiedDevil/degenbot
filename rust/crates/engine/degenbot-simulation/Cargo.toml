[package]
name = "degenbot-simulation"
description = "In-process evm2 simulation executor + dispatch fan-out (pyo3-free core; ADR-019 D4 fold, ADR-089 engine)."
keywords = ["simulation", "evm2", "evm", "mev"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The alloy umbrella (single source, matches degenbot-rpc's convention). The
# umbrella's `DynProvider`/`Provider`/`Ethereum` back the RPC-side cold-fetch
# seam. `full` brings the RPC types + provider-http.
alloy = { version = "^2.5", features = ["full"] }
# EIP-7928 block access lists — the CANONICAL decode for the opt-in BAL prefetch
# (`sim::evm2::bal_prefetch`): the RLP types come from the same alloy family the
# RPC layer speaks, never a hand-written parser. `rlp` is the raw
# `debug_getRawBlockAccessList` representation; `serde` the official
# `eth_getBlockAccessList` JSON one — one type, two codecs.
alloy-eip7928 = { version = "0.4.11", features = ["rlp", "serde"] }
# evm2 — THE engine (ADR-089 cutover; ADR-091 retired revm), through the
# vendored fork (rust/vendor/, ADR-096): imported as `evm2`, published as
# `degenbot-evm2` because upstream's crate is unpublished. Features are the
# pure-Rust precompile backends (no GMP/MCL/aws-lc native builds).
# `async` enables the AsyncDatabase coroutine seam — the coroutine
# replacement for the sync `BlockingAsyncDb` adapter; corosensei is pure Rust.
evm2 = { workspace = true, features = [
    "asm-keccak",
    "async",
    "blst",
    "bn",
    "map-foldhash",
    "parse",
    "portable",
    "secp256k1",
    "std",
] }
# evm2-jit — the JIT interpreter runner (ADR-089), from the same vendored
# fork as evm2.
# `llvm` compiles against LLVM 23 (`llvm-config`/`llvm-config-23`; the F45
# devcontainer's `llvm-devel`).
evm2-jit = { workspace = true, optional = true, features = [
    "asm-keccak",
    "llvm",
] }
# Named for the OptimizationLevel enum (the tuning knobs' type), which evm2-jit's
# curated root re-export does not surface.
evm2-jit-runtime = { workspace = true, optional = true }
# Tick-map fixtures mirror the pools hashbrown maps.
hashbrown.workspace = true
degenbot-core.workspace = true
degenbot-config.workspace = true
# `WarmupSlots` + `compute_simulation_warmup_slots` + `mapping_slot` + the
# `encode_cmd_stream`/`EncodeOptions` types the sim orchestration consumes —
# crossed from the executor leaf.
degenbot-executor.workspace = true
# `PathInfo` / `HopInfo` — the neutral opportunity descriptors (ADR-098 D1).
degenbot-execution.workspace = true
# `sqrt_price_math` — the engine's proven V3 amount math, so the harness
# computes V3 hop outputs byte-consistent with the `PoolV3` stub.
degenbot-math.workspace = true
# `AlloyProvider` — the typed RPC provider the in-process sim's cold-miss
# fallback (`BlockingAsyncDb` over `AlloyAsyncDb`) + the access-list /
# feeHistory paths consume. The `SimulateContext.provider` field holds a borrowed `&AlloyProvider`.
degenbot-rpc.workspace = true
# `BotState` (ADR-003 state owner; ADR-005 standalone-core) — the snapshot
# surface (`registered_pools_snapshot`) + the typed pool-state
# structs BotStateDb reads. Depends on `degenbot-pools` (state structs) +
# `degenbot-uniswap` (DexIdentity).
degenbot-bot.workspace = true
# ADR-067: the state owner + seam types (BotState, executor_hop, sim_anchor,
# divergence_probe, session registry) moved to the substrate crate.
degenbot-substrate.workspace = true
degenbot-pools.workspace = true
# `V4PoolId` — the V4 pool identifier type (crossed from the decoders leaf for
# the V4 swap-event decoder + the swap-capture inspector).
degenbot-decoders.workspace = true
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# `Serialize` derive for the inspector captured structs (`CallTrace`,
# `CapturedSwap`) — the diagnostic surface crosses the FFI as `#[pyclass]`
# thin shells (ADR-019 D7).
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
# `parking_lot::RwLock` — backs the cross-block persistent `WarmCodeCacheInner`
# (the bytecode + account-existence layer) AND the `BotState` lock type
# (matches `degenbot-bot` so the `Option<Arc<RwLock<BotState>>>` fan-out param
# is the same lock family).
parking_lot = "^0.13"
# `futures_util::future::join` — the read hub issues its storage batch and its
# multi-account batch concurrently (one round, two round trips in flight).
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }

# `tower::Service` — the JSON-RPC transport seam the scratch chain serves (the
# same shape the degenbot-rpc recording/replay transports implement).
tower = { version = "^0.5", default-features = false }
# `rt` is required by `BlockingAsyncDb` (it blocks the async `AlloyAsyncDb`
# reads on a runtime — `BlockingAsyncDb::new` needs an ambient multi-threaded
# tokio handle). The fan-out/categorization policy + its
# `buffer_unordered`/`Semaphore` concurrency retired with the strategy
# relocation to `degenbot-arbitrage` (ADR-019 D4/D7). `sync` carries the read
# hub's per-requester answer channels (`tokio::sync::oneshot` — a channel, not a
# runtime).
tokio = { version = "^1.54", features = ["rt", "sync"] }

[build-dependencies]
# build.rs's builtins-symbol export — optional, enabled by the evm2-jit
# feature (the same vendored fork as evm2).
evm2-jit-build = { workspace = true, optional = true }

# The phase-6 offline engine benchmark: all four modes need
# the JIT runner, so the example builds only with the `evm2-jit` feature.
[[example]]
name = "sim_mode_bench"
path = "examples/sim_mode_bench.rs"
required-features = ["evm2-jit"]

# The production executor's AOT prep lane: compiles
# `contracts/cmd_executor_runtime_bytecode.txt` into the durable artifact store
# the process-shared JIT holder opens, and proves the artifact loads back as
# `ProgramKind::Aot`.
[[example]]
name = "aot_prepare_executor"
path = "examples/aot_prepare_executor.rs"
required-features = ["evm2-jit"]

# The cold-miss cost probe (the coroutine fan-out investigation): a latency-
# injecting RPC stand-in measures where cold storage misses cost wall time and
# whether N fibers overlap them. Needs no JIT, so it carries no
# `required-features`.
[[example]]
name = "cold_miss_fanout_probe"
path = "examples/cold_miss_fanout_probe.rs"

# The JIT-composition probe: does the production capture (slots + swaps)
# survive off the Inspector hook, so compiled execution can carry it?
[[example]]
name = "capture_seam_probe"
path = "examples/capture_seam_probe.rs"
required-features = ["evm2-jit"]

# The JIT spine's fail-soft + verdict-parity gate (needs the runner type).
[[test]]
name = "jit_spine"
path = "tests/jit_spine.rs"
required-features = ["evm2-jit"]

# The frame-replay path's compiled-path gate: program residency survives
# across replays (needs the runner type).
[[test]]
name = "frame_replay_jit"
path = "tests/frame_replay_jit.rs"
required-features = ["evm2-jit"]

[features]
default = []
# The evm2 pilot engine (src/sim/evm2). Opt-in parallel implementation;
# off in every default lane, retired by the hard cutover.
# The evm2 engine is THE engine (ADR-089 cutover): the dep is
# non-optional and the feature alias is gone; the JIT stays opt-in.
# evm2-jit-build is the build.rs's builtins-symbol export (the README's
# required wiring), from the same vendored fork as evm2.
evm2-jit = ["dep:evm2-jit", "dep:evm2-jit-build", "dep:evm2-jit-runtime"]
# The executor-grammar harness (`src/harness/`) is an investigation/oracle lab
# with no production consumer: the shipped crate root is the engine (`sim`), the
# fixture driver (`oracle`), and the capture generator (`capture`). Every
# dependent (`degenbot-arbitrage`, `degenbot-batch-executor`,
# `degenbot-strategy`, `degenbot-submission`, the umbrella, the cdylib, the
# console) therefore links none of it. The crate's own harness-driven tests opt
# in through `required-features`, and the test/lint lanes carry
# `degenbot-simulation/test-harness` explicitly so the lab stays executed
# (ADR-084 D2b/D3). The sources stay put; the feature gates compilation only.
test-harness = []

[dev-dependencies]
# sha256 for the tier-3 harness bytecode drift guard (`tier3_harness_artifacts.rs`)
# — the manifest hashes the git-tracked harness sources, so a harness edit
# without a rebuild fails the default suite. sha2 is already in the lock (via
# alloy); this is a dev-only linkage.
sha2 = "0.11"
# `rt-multi-thread` is the flavor the `BlockingAsyncDb` cold path needs: its
# reads block on the ambient tokio runtime, and under a `CurrentThread`
# runtime `BlockingAsyncDb::new` returns `None`.
# The hub's public-seam tests drive caller-drained rounds directly, so the
# `#[tokio::test]` macros and the multi-threaded flavor are all they need.
tokio = { version = "^1.54", features = ["macros", "rt-multi-thread"] }
# `test-utils` gates the pending-tx pump's frame-injection support
# (`PendingTxPump::push`) so the §4.2 wire-shape tests + the parity fixture can
# feed the typed dispatch without a live node. (`AlloyProvider::from_provider`
# is ungated — the offline provider builds on it at runtime.) Production builds
# (the umbrella, the cdylib) never enable this feature.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# `compute_simulation_warmup_slots` + the `EncodeOptions` type the smoke test's
# `SimulatePath` fixture constructs.
degenbot-executor.workspace = true
# `PathInfo`/`HopInfo`/`V2HopInfo` — the neutral opportunity descriptors.
degenbot-execution.workspace = true
# `DexVariant` for the `BotStateDb` tripwire tests (register a tracked V2 pool
# so `pool_id_by_address` resolves) — dev-only, no production linkage.
degenbot-uniswap.workspace = true
# `IntHopState` — the executor grammar harness computes byte-consistent V2
# hop outputs from the seeded reserves (mirroring the tier-3 V2 oracle) so the
# encoded path round-trips cleanly.
# `proptest` — property-driven fixtures for the relocated Tier-3 CL parity
# oracles (tier3_v3 / v4 / pancake_v3 swap-vs-reference-bytecode). They live here
# because they drive `degenbot_simulation::oracle`; a dev-dep back from
# degenbot-pools would be a publish-blocking cycle
# (pools -> simulation -> bot -> pools), and the release policy is to never
# publish with --no-verify.
proptest = "^1.12"
# `hex` — revert-reason hex formatting in the relocated tier-3 CL parity oracles
# (inline `hex::encode`).
hex = "^0.4"

# Integration tests that drive the executor-grammar harness. `required-features`
# is the only way an integration test can depend on a feature of the crate it
# tests: these targets compile where a lane enables `test-harness` and are
# skipped elsewhere instead of dying on a cfg'd-out module. The tier-3 artifact
# drift guard is deliberately absent — it hashes files, not the harness API, so
# it runs in the harness-free default build too.

[[test]]
name = "harness_artifact_probes"
required-features = ["test-harness"]

[[test]]
name = "harness_declarative"
required-features = ["test-harness"]

[[test]]
name = "harness_poolv3"
required-features = ["test-harness"]

[[test]]
name = "spike_derivation"
required-features = ["test-harness"]

