[package]
name = "degenbot-simulation"
description = "In-process revm simulation executor + dispatch fan-out (pyo3-free core; ADR-019 D4 fold)."
keywords = ["simulation", "revm", "evm", "mev"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# revm — the canonical Rust EVM (audited, used by Reth/Foundry/many L2s).
# Default-revmm features (std + secp256k1 + c-kzg + blst + portable + tracer —
# all mainnet precompiles) are enumerated explicitly. `alloydb` enables
# `AlloyDB` (the RPC-backed DatabaseAsyncRef). `asyncdb` enables
# `DatabaseAsyncRef` + `WrapDatabaseAsync` (the async→sync Database bridge).
revm = { version = "^43.0", default-features = false, features = [
    # `default-features = true` + the two toggles the frame-replay seam needs
    # (the strategy path leaves both at their default `false`):
    # - `optional_balance_check` — the pending-tx balance-relaxation policy
    #   (`ScratchEvm` sets `cfg.disable_balance_check`, see `frame_replay`);
    # - `optional_no_base_fee` — the projected-basefee fallback
    #   (`cfg.disable_base_fee`).
    # All other revm defaults (std, secp256k1, c-kzg, blst, portable, tracer —
    # all mainnet precompiles) are enumerated explicitly below. `dev` is NOT
    # enabled — owner-funding uses explicit `CacheDB::insert_account_info` (the
    # owner is genuinely credited), keeping the strategy sim a faithful
    # mainnet execution (no balance-check bypass).
    "alloydb",
    "asyncdb",
    "blst",
    "c-kzg",
    "optional_balance_check",
    "optional_no_base_fee",
    "portable",
    "secp256k1",
    "std",
    "tracer",
] }
# The alloy umbrella (single source, matches degenbot-rpc's convention). The
# umbrella's `DynProvider`/`Provider`/`Ethereum` are the same types revm's
# `AlloyDB<N, P>` consumes. `full` brings the RPC types + provider-http.
alloy = { version = "^2.5", features = ["full"] }
# Tick-map fixtures mirror the pools hashbrown maps.
hashbrown.workspace = true
degenbot-core.workspace = true
degenbot-config.workspace = true
# `WarmupSlots` + `compute_simulation_warmup_slots` + `mapping_slot` + the
# `encode_cmd_stream`/`PathInfo`/`HopInfo`/`EncodeOptions` types the sim
# orchestration consumes — crossed from the executor leaf.
degenbot-executor.workspace = true
# `sqrt_price_math` — the engine's proven V3 amount math, so the harness
# computes V3 hop outputs byte-consistent with the `PoolV3` stub.
degenbot-math.workspace = true
# `AlloyProvider` — the typed RPC provider the in-process sim's cold-miss
# fallback (`WrapDatabaseAsync<AlloyDB>`) + the access-list / feeHistory paths
# consume. The `SimulateContext.provider` field holds a borrowed `&AlloyProvider`.
degenbot-rpc.workspace = true
# `BotState` (ADR-003 state owner; ADR-005 standalone-core) — the snapshot
# surface (`registered_pools_snapshot`) + the typed pool-state
# structs BotStateDb reads. Depends on `degenbot-pools` (state structs) +
# `degenbot-uniswap` (DexIdentity).
degenbot-bot.workspace = true
# ADR-067: the state owner + seam types (BotState, executor_hop, sim_anchor,
# divergence_probe, session registry) moved to the substrate crate.
degenbot-substrate.workspace = true
degenbot-pools.workspace = true
# `V4PoolId` — the V4 pool identifier type (crossed from the decoders leaf for
# the V4 swap-event decoder + the swap-capture inspector).
degenbot-decoders.workspace = true
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# `Serialize` derive for the inspector captured structs (`CallTrace`,
# `CapturedSwap`) — the diagnostic surface crosses the FFI as `#[pyclass]`
# thin shells (ADR-019 D7).
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
# `parking_lot::RwLock` — backs the cross-block persistent `WarmCodeCacheInner`
# (the bytecode + account-existence layer) AND the `BotState` lock type
# (matches `degenbot-bot` so the `Option<Arc<RwLock<BotState>>>` fan-out param
# is the same lock family).
parking_lot = "^0.13"
# `tower::Service` — the JSON-RPC transport seam the scratch chain serves (the
# same shape the degenbot-rpc recording/replay transports implement).
tower = { version = "^0.5", default-features = false }
# `rt` is required by `WrapDatabaseAsync` (it blocks the async `AlloyDB`
# `DatabaseAsyncRef` calls on a runtime — `WrapDatabaseAsync::new` needs a
# current-thread tokio handle). The fan-out/categorization policy + its
# `buffer_unordered`/`Semaphore` concurrency retired with the strategy
# relocation to `degenbot-arbitrage` (ADR-019 D4/D7).
tokio = { version = "^1.54", features = ["rt"] }

[features]
default = []
# The executor-grammar harness (`src/harness/`) is an investigation/oracle lab
# with no production consumer: the shipped crate root is the engine (`sim`), the
# fixture driver (`oracle`), and the capture generator (`capture`). Every
# dependent (`degenbot-arbitrage`, `degenbot-batch-executor`,
# `degenbot-strategy`, `degenbot-submission`, the umbrella, the cdylib, the
# console) therefore links none of it. The crate's own harness-driven tests opt
# in through `required-features`, and the test/lint lanes carry
# `degenbot-simulation/test-harness` explicitly so the lab stays executed
# (ADR-084 D2b/D3). The sources stay put; the feature gates compilation only.
test-harness = []

[dev-dependencies]
# sha256 for the tier-3 harness bytecode drift guard (`tier3_harness_artifacts.rs`)
# — the manifest hashes the git-tracked harness sources, so a harness edit
# without a rebuild fails the default suite. sha2 is already in the lock (via
# alloy/revm); this is a dev-only linkage.
sha2 = "0.11"
# `examples/rpc_cache_fanout.rs` uses `#[tokio::main(flavor = "multi_thread")]`
# — `WrapDatabaseAsync<AlloyDB>` blocks on the ambient tokio runtime, which
# requires a multi-thread runtime (`CurrentThread` returns `None`).
tokio = { version = "^1.54", features = ["macros", "rt-multi-thread"] }
# `test-utils` gates the pending-tx pump's frame-injection support
# (`PendingTxPump::push`) so the §4.2 wire-shape tests + the parity fixture can
# feed the typed dispatch without a live node. (`AlloyProvider::from_provider`
# is ungated — the offline provider builds on it at runtime.) Production builds
# (the umbrella, the cdylib) never enable this feature.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# `compute_simulation_warmup_slots` + the `PathInfo`/`HopInfo`/`V2HopInfo`/
# `EncodeOptions` types the smoke test's `SimulatePath` fixture constructs.
degenbot-executor.workspace = true
# `DexVariant` for the `BotStateDb` tripwire tests (register a tracked V2 pool
# so `pool_id_by_address` resolves) — dev-only, no production linkage.
degenbot-uniswap.workspace = true
# `IntHopState` — the executor grammar harness computes byte-consistent V2
# hop outputs from the seeded reserves (mirroring the tier-3 V2 oracle) so the
# encoded path round-trips cleanly.
# `proptest` — property-driven fixtures for the relocated Tier-3 CL parity
# oracles (tier3_v3 / v4 / pancake_v3 swap-vs-revm). They live here because they drive `degenbot_simulation::oracle`;
# a dev-dep back from degenbot-pools would be a publish-blocking cycle
# (pools -> simulation -> bot -> pools), and the release policy is to never
# publish with --no-verify.
proptest = "^1.12"
# `hex` — revert-reason hex formatting in the relocated tier-3 CL parity oracles
# (inline `hex::encode`).
hex = "^0.4"

# Integration tests that drive the executor-grammar harness. `required-features`
# is the only way an integration test can depend on a feature of the crate it
# tests: these targets compile where a lane enables `test-harness` and are
# skipped elsewhere instead of dying on a cfg'd-out module. The tier-3 artifact
# drift guard is deliberately absent — it hashes files, not the harness API, so
# it runs in the harness-free default build too.

[[test]]
name = "harness_artifact_probes"
required-features = ["test-harness"]

[[test]]
name = "harness_declarative"
required-features = ["test-harness"]

[[test]]
name = "harness_poolv3"
required-features = ["test-harness"]

[[test]]
name = "spike_derivation"
required-features = ["test-harness"]
