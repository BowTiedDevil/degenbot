[package]
name = "degenbot-submission"
description = "Pure-Rust transaction-submission mechanism — operator-key holding LocalSigner + EIP-1559 type-2 encoding, nonce-leased dispatch, raw/relay broadcast, receipt monitoring, and submission-ledger reconciliation."
keywords = ["mev", "eip-1559", "signing", "transactions"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5", features = ["full", "signer-local", "network"] }
# The relay POSTs (flashbots-compatible eth_sendBundle over HTTPS). Ordered
# fan-out lives in relay.rs; rustls matches the bot crate's reqwest pinned
# feature set (# no default-tls native openssl).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
degenbot-core.workspace = true
# T4 economics metrics record through the bot crate's instruments module —
# one-way (bot never depends on submission); default builds get the inert
# stub twin so this adds no metrics code without the `otel` feature.
degenbot-bot.workspace = true
degenbot-substrate.workspace = true
# `AlloyProvider` (the typed `eth_sendRawTransaction`/`eth_feeHistory`/
# `eth_createAccessList` surfaces the N6 submit orchestration consumes —
# typed, with no `make_request` escape hatch).
degenbot-rpc.workspace = true
# Per-session run artifacts: the driver's stdout fmt sink and the default
# JSONL trace path. The `tracing` feature supplies the MakeWriter bridge.
degenbot-runs = { workspace = true, features = ["tracing"] }
# The non-poisoning `Mutex` the ledger, dispatcher, and head-reconciliation
# state hold across monitor-task boundaries: one strategy's panic cannot wedge
# the rest.
parking_lot = "^0.13"
thiserror = { version = "^2.0" }
# OTel tier-1 spans: plain `tracing` spans - the
# process-wide subscriber (degenbot-bot/degenbot-python) exports them;
# no OTel dependency here (core-crate rule).
tracing = { version = "^0.1" }
# Async runtime for the dispatcher's `active_tasks` `JoinSet` (auto-discards
# completed tasks) + the by-reference `current_block` `Mutex<u64>` clock read
# across consumer/monitor task boundaries (ADR-005 standalone core).
tokio = { version = "^1.54", features = ["rt", "sync", "time", "macros"] }

# Gated (not default) so pure-Rust consumers build without pulling pyo3.
# Enables `impl From<degenbot_submission::SubmissionError> for pyo3::PyErr` so
# the `degenbot-python` binding layer can `?`-propagate signing/fee errors as a
# `PyErr` (mirrors `degenbot-core`/`degenbot-price`'s `pyo3` feature).
pyo3 = { version = "^0.30", features = ["abi3-py312", "serde"], optional = true }

# Backrun bundle submission: WS relay to searchers.mevblocker.io.
serde_json = { version = "^1.0" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
tokio-tungstenite = { version = "^0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
# Test-only: the OTel span-capture layer (`lib.rs` `span_capture`) installs a
# `registry()` subscriber to read back recorded span fields; no shipped path
# builds a subscriber here (the process-wide one is a consumer's job).
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "registry", "fmt", "env-filter", "time"] }
# Test-only: the ledger and head-reconciliation `#[cfg(test)]` modules and the
# `mock_third_family`/`hosted_driver_ambient_runtime` integration tests drive a
# real `Hub` (the pending-tx feed the backrun driver registers).
degenbot-eventhub.workspace = true
# `test-utils` gates the pending-tx pump's frame-injection support
# (`PendingTxPump::push`) so the §4.2 wire-shape tests can feed the submit
# orchestration without a live node. (`AlloyProvider::from_provider` is
# ungated — the offline provider builds on it at runtime.) Production builds
# (the umbrella, the cdylib) never enable this feature.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# `hosted_driver_ambient_runtime` wraps an async DB (`WrapDatabaseAsync`) as the
# revm read surface a driver's ambient runtime polls; `asyncdb` is what exposes
# it now that no production dependency pulls it in transitively.
revm = { version = "^43.0", default-features = false, features = ["std", "asyncdb"] }
serde_json = { version = "^1.0" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
tokio-tungstenite = { version = "^0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
proptest = "^1.12"

[features]
default = []
# Enables `impl From<SubmissionError> for pyo3::PyErr`. Enabled by the
# `degenbot-python` binding crate; never enabled by the umbrella.
pyo3 = ["dep:pyo3"]
