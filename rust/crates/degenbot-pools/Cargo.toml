[package]
name = "degenbot-pools"
description = "Value-only pool identity/state structs + stateless swap simulation for the degenbot pool families."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.3" }
thiserror = { version = "^2.0" }
parking_lot = { version = "^0.12" }
degenbot-decoders = { path = "../degenbot-decoders" }
degenbot-uniswap = { path = "../degenbot-uniswap" }
degenbot-v2-math = { path = "../degenbot-v2-math" }
degenbot-cl-math = { path = "../degenbot-cl-math" }
degenbot-curve-math = { path = "../degenbot-curve-math" }
degenbot-balancer-math = { path = "../degenbot-balancer-math" }
degenbot-solidly-math = { path = "../degenbot-solidly-math" }

[dev-dependencies]
proptest = "^1.11"
serde_json = "^1.0"
hex = "^0.4"
# revm drives the Tier-3b end-to-end `Pool.swap` oracle: it deploys real
# v3-core/v4-core bytecode into an offline CacheDB and calls swap, so the Rust
# `v3_simulate_swap` / `v4_simulate_swap` are compared against the canonical
# on-chain swap logic byte-for-byte (ergo epic UP5NH6, task 2LTKVO). A
# dev-dep only — does NOT pull revm into the core lib build (cargo tree on
# default features excludes dev-deps), so the no-pyo3-in-cores invariant is
# unaffected.
revm = { version = "^42.0", default-features = true }
# The tier-3 on-chain oracle driver (deploy -> seed -> call -> classify) now
# lives in `degenbot-simulation::oracle` (ADR-020 landing zone), and the
# tier-3 CL oracles drive the real pool bytecode through it. A dev-dep only.
degenbot-simulation = { path = "../degenbot-simulation" }
