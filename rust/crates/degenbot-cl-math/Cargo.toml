[package]
name = "degenbot-cl-math"
description = "Pure-Rust ports of Uniswap V3/V4 concentrated-liquidity math libraries."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-core = { path = "../degenbot-core" }
thiserror = { version = "^2.0" }

[dev-dependencies]
proptest = "^1.10"
