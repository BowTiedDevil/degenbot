[package]
name = "degenbot-cl-math"
description = "Pure-Rust ports of Uniswap V3/V4 concentrated-liquidity math libraries."
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-core = { path = "../degenbot-core" }
thiserror = { version = "^2.0" }

[dev-dependencies]
proptest = "^1.10"
