[package]
name = "degenbot-cl-math"
description = "Pure-Rust ports of Uniswap V3/V4 concentrated-liquidity math libraries."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.2" }
degenbot-core = { path = "../degenbot-core" }
thiserror = { version = "^2.0" }

[dev-dependencies]
proptest = "^1.11"
serde_json = "^1.0"
# Tier-3a byte-exact oracle (ergo OZRQS6, epic UP5NH6): loads forge/solc-
# compiled SwapMath-harness bytecode + drives it via revm `transact` against
# `compute_swap_step_v3`/`v4` under proptest. Dev-only (test target); the
# no-pyo3-in-cores check builds default features (`cargo tree -p` excludes
# dev-deps) so this does NOT pull revm into the core lib build — and revm
# carries no pyo3 regardless.
revm = { version = "^42.0", default-features = true }
