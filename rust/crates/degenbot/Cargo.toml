[package]
name = "degenbot"
description = "Umbrella Rust crate: re-exports the pyo3-free degenbot core surface (Bot state, DexIdentity presets, calc math) for standalone Rust consumers."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

# The umbrella is pure-Rust: it pulls ONLY the pyo3-free core crates and
# re-exports them. It has NO `pyo3` dependency (verified by
# `rg 'use pyo3' rust/crates/degenbot` — empty). A standalone Rust consumer
# `cargo add degenbot` gets `BotState`/`DexIdentity`/presets/calc with zero
# Python in the build graph (ADR-005 standalone claim, made concrete by
# `examples/standalone_consumer.rs`). The binding layer (`degenbot_rs` cdylib,
# built from `crates/degenbot-python/`) is a separate workspace member that
# DOES pull pyo3; the umbrella never depends on it.
[dependencies]
degenbot-aave = { path = "../degenbot-aave" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-balancer-math = { path = "../degenbot-balancer-math" }
degenbot-bot = { path = "../degenbot-bot" }
degenbot-cl-math = { path = "../degenbot-cl-math" }
degenbot-core = { path = "../degenbot-core" }
degenbot-curve-math = { path = "../degenbot-curve-math" }
degenbot-db = { path = "../degenbot-db" }
degenbot-decoders = { path = "../degenbot-decoders" }
degenbot-evm-math = { path = "../degenbot-evm-math" }
degenbot-executor = { path = "../degenbot-executor" }
degenbot-fork = { path = "../degenbot-fork" }
degenbot-pathfinding = { path = "../degenbot-pathfinding" }
degenbot-pool-updater = { path = "../degenbot-pool-updater" }
degenbot-pools = { path = "../degenbot-pools" }
degenbot-price = { path = "../degenbot-price" }
degenbot-rpc = { path = "../degenbot-rpc" }
degenbot-simulation = { path = "../degenbot-simulation" }
degenbot-backrun-strategy = { path = "../degenbot-backrun-strategy" }
degenbot-solidly-math = { path = "../degenbot-solidly-math" }
degenbot-solvers = { path = "../degenbot-solvers" }
degenbot-submission = { path = "../degenbot-submission" }
degenbot-uniswap = { path = "../degenbot-uniswap" }
degenbot-v2-math = { path = "../degenbot-v2-math" }

[dev-dependencies]
alloy = { version = "^2.3", features = ["full"] }
revm = { version = "^42.0", default-features = false }
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
