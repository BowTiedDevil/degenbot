[package]
name = "degenbot-rpc"
description = "Pure-Rust Ethereum RPC provider, contract interface, and subscription core."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.3", features = ["full", "transport-throttle", "json-rpc"] }
dashmap = { version = "^6.2" }
degenbot-abi = { path = "../degenbot-abi" }
degenbot-cl-math = { path = "../degenbot-cl-math" }
degenbot-core = { path = "../degenbot-core" }
degenbot-pools = { path = "../degenbot-pools" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
parking_lot = { version = "^0.12" }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }
tower = { version = "^0.5", default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "registry"] }

[features]
default = []
# Test-only constructors (e.g. `AlloyProvider::from_provider`) visible to
# downstream crates' tests. In a library crate `#[cfg(test)]` is not visible to
# consumers' tests, so this feature is the seam.
test-utils = []
