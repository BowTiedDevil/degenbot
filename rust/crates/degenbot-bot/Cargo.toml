[package]
name = "degenbot-bot"
description = "Rust-owned bot state (BotState) + Möbius solvers + unified Uniswap V2/V3/V4 engine."
keywords = ["mev", "arbitrage", "bot", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4", features = ["full", "transport-throttle"] }
# `async_trait` makes the construction-I/O core traits dyn-compatible (they're
# held as `Arc<dyn DbConstruction + Send + Sync>` on `ConstructionIo`). The
# macro desugars `async fn` to `-> Pin<Box<dyn Future + Send>>` — the standard
# pattern alloy itself uses for `dyn Provider`.
async-trait = { version = "^0.1" }
dashmap = { version = "^6.2" }
degenbot-abi.workspace = true
degenbot-math.workspace = true
degenbot-core.workspace = true
degenbot-db.workspace = true
degenbot-decoders.workspace = true
degenbot-rpc.workspace = true
degenbot-pools.workspace = true
degenbot-solvers.workspace = true
degenbot-executor.workspace = true
degenbot-uniswap.workspace = true
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
# hotpath: drain-path profiling tracer (ADR-005 core, pyo3-free). The crate is a
# non-optional dependency so the `#[hotpath::measure]` attributes resolve, but
# with `default-features = false` it expands to no-op stubs (see hotpath's
# `lib_off.rs`) — zero compile-time or runtime cost in default builds. Enable
# the `hotpath` / `hotpath-cpu` / `hotpath-alloc` features below (or in a
# consumer crate) to turn the macros into real instrumentation.
hotpath = { version = "^0.23", default-features = false }
parking_lot = { version = "^0.12" }
rand = { version = "^0.10" }
rayon = { version = "^1.12" }
tracing = { version = "^0.1" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }

[features]
# Drain-path profiling tracer bullet (see `src/profiling.rs`). Enable with
# `--features hotpath` (timing+threads), `hotpath-cpu` (CPU sampling, Linux/macOS
# only), or `hotpath-alloc` (allocation accounting). Operationally gated by the
# `DEGENBOT_HOTPATH=1` env var so default runs never construct the guard.
hotpath = ["hotpath/hotpath", "hotpath/threads"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dev-dependencies]
proptest = "^1.11"
# Test-only constructors (e.g. AlloyProvider::from_provider) used by the
# bot_core block-pump tests.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# Captures alloy/tungstenite tracing for the `ws_getlogs_large_filter_diagnostic`
# ignored test (reconnect-cycle investigation, 2026-07-12).
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
