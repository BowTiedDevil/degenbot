[package]
name = "degenbot-bot"
description = "Rust-owned bot state (BotState) + Möbius solvers + unified Uniswap V2/V3/V4 engine."
keywords = ["mev", "arbitrage", "bot", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4", features = ["full", "transport-throttle"] }
# `async_trait` makes the construction-I/O core traits dyn-compatible (they're
# held as `Arc<dyn DbConstruction + Send + Sync>` on `ConstructionIo`). The
# macro desugars `async fn` to `-> Pin<Box<dyn Future + Send>>` — the standard
# pattern alloy itself uses for `dyn Provider`.
async-trait = { version = "^0.1" }
dashmap = { version = "^6.2" }
degenbot-abi.workspace = true
degenbot-math.workspace = true
degenbot-core.workspace = true
degenbot-db.workspace = true
degenbot-decoders.workspace = true
degenbot-rpc.workspace = true
degenbot-pools.workspace = true
degenbot-solvers.workspace = true
degenbot-executor.workspace = true
degenbot-uniswap.workspace = true
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
# hotpath: drain-path profiling tracer (ADR-005 core, pyo3-free). The crate is a
# non-optional dependency so the `#[hotpath::measure]` attributes resolve, but
# with `default-features = false` it expands to no-op stubs (see hotpath's
# `lib_off.rs`) — zero compile-time or runtime cost in default builds. Enable
# the `hotpath` / `hotpath-cpu` / `hotpath-alloc` features below (or in a
# consumer crate) to turn the macros into real instrumentation.
# OpenTelemetry tracer bullet (epic KDUED5). All four are optional: default
# builds compile zero OTel code. Version-locked trio: tracing-opentelemetry
# 0.33 is built against opentelemetry(-sdk) 0.32; bump them together.
# opentelemetry-otlp: OTLP/HTTP-protobuf over rustls (no OpenSSL system dep);
# http-proto pulls in the trace (+metrics proto) signal set.
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["trace", "metrics", "experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio-current-thread"] }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }
# Regular (optional) counterpart of the dev-dependency below: init_otel_tracing
# composes a tracing-subscriber registry at the call site, so the crate needs
# it at runtime, not just in tests.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "registry", "fmt", "env-filter", "time"] }
hotpath = { version = "^0.23", default-features = false }
parking_lot = { version = "^0.12" }
rand = { version = "^0.10" }
rayon = { version = "^1.12" }
tracing = { version = "^0.1" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }
opentelemetry-prometheus = { version = "0.32.0", optional = true }
prometheus = { version = "0.14.0", default-features = false, optional = true }
tokio-util = { version = "0.7.19", optional = true }

[features]
# OpenTelemetry tracer bullet (see src/otel.rs). Enable with --features otel.
# Unlike the hotpath bullet this feature has no env gate: init_otel_tracing()
# is an explicit call site (pure-Rust consumers); the Python-driven path
# (degenbot-python, epic task K6PCKP) adds the layer to its own registry behind
# DEGENBOT_OTEL=1. Release wheels and just build-rust-extension do NOT enable
# this feature (the PyPI maturin build overrides the dev feature list, same
# story as hotpath), so shipped artifacts carry zero OTel footprint.
# T1 metrics pipeline rides the same feature gate: opentelemetry-prometheus
# (Prometheus text-format reader for Grafana scrapes) + the prometheus crate
# (registry + TextEncoder). Same zero-footprint rule as the trace deps.
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:opentelemetry-prometheus", "dep:prometheus", "dep:tokio-util"]
# Drain-path profiling tracer bullet (see `src/profiling.rs`). Enable with
# `--features hotpath` (timing+threads), `hotpath-cpu` (CPU sampling, Linux/macOS
# only), or `hotpath-alloc` (allocation accounting). Operationally gated by the
# `DEGENBOT_HOTPATH=1` env var so default runs never construct the guard.
hotpath = ["hotpath/hotpath", "hotpath/threads"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
opentelemetry-prometheus = ["dep:opentelemetry-prometheus"]
prometheus = ["dep:prometheus"]
tokio-util = ["dep:tokio-util"]

[dev-dependencies]
proptest = "^1.11"
# Test-only constructors (e.g. AlloyProvider::from_provider) used by the
# bot_core block-pump tests.
degenbot-rpc = { workspace = true, features = ["test-utils"] }
# In-memory span exporter seam for asserting exported spans without a live
# collector (epic KDUED5): the `testing` feature exposes
# opentelemetry_sdk::trace::InMemorySpanExporter. Feature-unified with the
# optional opentelemetry_sdk dep in test builds.
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }

# Captures alloy/tungstenite tracing for the `ws_getlogs_large_filter_diagnostic`
# ignored test (reconnect-cycle investigation, 2026-07-12).
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
