[package]
name = "degenbot-solvers"
description = "Value-only multi-hop arbitrage solver math — Möbius closed-form (V2/CL) + golden-section (Solidly/Curve/Balancer) + QuantAMM basket, with the hop-state intake contract (ADR-015)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.2" }
thiserror = { version = "^2.0" }
num-bigint = { version = "^0.5" }
num-integer = { version = "^0.1" }
degenbot-v2-math = { path = "../degenbot-v2-math" }
degenbot-cl-math = { path = "../degenbot-cl-math" }
degenbot-pools = { path = "../degenbot-pools" }
degenbot-balancer-math = { path = "../degenbot-balancer-math" }
degenbot-curve-math = { path = "../degenbot-curve-math" }
degenbot-solidly-math = { path = "../degenbot-solidly-math" }
degenbot-uniswap = { path = "../degenbot-uniswap" }

[dev-dependencies]
proptest = "^1.11"
criterion = { version = "^0.8", default-features = false, features = ["cargo_bench_support"] }
# Network-gated V3 mainnet-fixture reproduction (ergo E7ALWT): the live trap
# captured a +13 V3-hop over-prediction whose bias is INDEPENDENT of amount —
# pointing at a topology-specific `compute_crossing` divergence the synthetic
# parity sweep (regular, symmetric ticks) cannot construct. These deps fetch
# the real pool state on demand; the test is env-gated so CI never hits the net.
degenbot-rpc = { path = "../degenbot-rpc" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros"] }


[[bench]]
name = "digest"
harness = false
