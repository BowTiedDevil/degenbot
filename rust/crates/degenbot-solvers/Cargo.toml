[package]
name = "degenbot-solvers"
description = "Value-only multi-hop Möbius solver math (V2 constant-product + V3 concentrated-liquidity path solving)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.0" }
degenbot-v2-math = { path = "../degenbot-v2-math" }
degenbot-cl-math = { path = "../degenbot-cl-math" }
degenbot-pools = { path = "../degenbot-pools" }

[dev-dependencies]
proptest = "^1.0"