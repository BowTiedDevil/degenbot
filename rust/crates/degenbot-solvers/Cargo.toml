[package]
name = "degenbot-solvers"
description = "Value-only multi-hop arbitrage solver math — Möbius closed-form (V2/CL) + golden-section (Solidly/Curve/Balancer) + QuantAMM basket, with the hop-state intake contract (ADR-015)."
keywords = ["mev", "arbitrage", "solver", "math"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
serde_json = { version = "^1.0" }
num-bigint = { version = "^0.5" }
num-integer = { version = "^0.1" }
degenbot-math.workspace = true
degenbot-pools.workspace = true
degenbot-uniswap.workspace = true
# Hot solver maps: foldhash cl-cache tables + visited walk guard.
hashbrown.workspace = true
# hotpath: solver-phase profiling (ADR-005 core, pyo3-free). Non-optional,
# default-features = false -> no-op stubs in default builds; the
# `hotpath` feature enables real instrumentation.
hotpath = { version = "^0.24", default-features = false }

[features]
hotpath = ["hotpath/hotpath", "hotpath/threads"]

[dev-dependencies]
rayon = { version = "^1.12" }
proptest = "^1.11"
parking_lot = { version = "^0.12" }
criterion = { version = "^0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = { version = "^3.27" }
# Network-gated V3 mainnet-fixture reproduction (ergo E7ALWT): the live trap
# captured a +13 V3-hop over-prediction whose bias is INDEPENDENT of amount —
# pointing at a topology-specific `compute_crossing` divergence the synthetic
# parity sweep (regular, symmetric ticks) cannot construct. These deps fetch
# the real pool state on demand; the test is env-gated so CI never hits the net.
degenbot-rpc.workspace = true
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros"] }


[[bench]]
name = "digest"
harness = false
