# Species manifest — the single source of fork / manager-deployment identity
# (ADR-059 D3). A fork that differs from its family only in identifiers (the
# DB `kind` discriminator, subclass table, per-chain factory + CREATE2 init
# code hash or V4 manager address, fee denominator, storage-layout id) is an
# entry here rather than a hand-maintained constant in each consumer.
#
# `src/species.rs` parses + validates this file once per process; the
# degenbot-db routing helpers project it (`schema::table::v2_v3_subclass_table`,
# `discovery_read`'s family lists, `snapshot::v3_kind_liquidity_table`), so the
# enumerations cannot drift from the file.
#
# Validated invariants (a violation aborts at first use):
#   * every `kind` is unique and non-empty;
#   * `family = "v4"` carries `table = "managed"`; every other family names a
#     table in `schema::table::V2_V3_SUBCLASS_TABLES`;
#   * every V3 species carries `slot_layout` + `fee_denominator`;
#   * `stable` is V2-only (the Aerodrome `stable` subclass column);
#   * each chain carries the identifiers its family uses.
#
# Per-chain identifiers mirror the species rows in the canonical
# `src/degenbot/registry/deployments.json`. That file still owns the CREATE2
# deployer and the Aerodrome implementation address, and reconciling the two
# (making deployments.json a projection of this manifest) is the species
# chunk's work.

