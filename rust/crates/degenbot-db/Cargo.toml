[package]
name = "degenbot-db"
description = "SQLite persistence substrate for the degenbot Rust core — pyo3-free read handle with an Alembic-aware schema gate."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

# Pure-Rust persistence leaf: rusqlite (bundled libsqlite3-sys, no system
# SQLite required) + alloy primitives for Address/U256/B256 decode at the row
# boundary. NO pyo3, NO tokio, NO sqlx — the read fns are short synchronous
# SQLite lookups (CONTEXT.md "degenbot-db substrate" decisions 1-3). Verified
# pyo3-free under default features by `just check-no-pyo3-in-cores`.
[dependencies]
alloy = { version = "^2.0" }
parking_lot = { version = "^0.12" }
rusqlite = { version = "^0.31", features = ["bundled", "backup"] }
thiserror = { version = "^2.0" }

[dev-dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
tempfile = { version = "^3.0" }