[package]
name = "degenbot-balancer-math"
description = "Pure-Rust ports of Balancer V2 FixedPoint / LogExpMath / WeightedMath / StableMath."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[dependencies]
alloy = { version = "^2.2" }

[dev-dependencies]
proptest = "^1.11"
criterion = { version = "^0.8", default-features = false, features = ["cargo_bench_support"] }


[[bench]]
name = "leaves"
harness = false
