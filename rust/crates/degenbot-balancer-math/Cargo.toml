[package]
name = "degenbot-balancer-math"
description = "Pure-Rust ports of Balancer V2 FixedPoint / LogExpMath / WeightedMath / StableMath."
keywords = ["balancer", "amm", "math", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4" }

[dev-dependencies]
proptest = "^1.11"
criterion = { version = "^0.8", default-features = false, features = ["cargo_bench_support"] }


[[bench]]
name = "leaves"
harness = false
