[package]
name = "degenbot-fixture-tools"
description = "Record, check, and regenerate the committed fixtures and the test-input generators. Non-publishable development tooling: no product build links it and no `cargo test` lane depends on it."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dependency shape: FIVE binaries -- the live updater cassette recorder, the Python
# oracle corpus recorder, the path-fixture recapture, the concentrated-liquidity
# capture generator, and the three-hop production-calldata encoder -- are DEFAULT
# targets of this package (none reads the statement ledger, so no feature may hide
# them), and the four SQL-ledger binaries need those same crates. Cargo has no per-target
# dependency selection, so every crate the default binaries link must be a plain edge
# here; the feature cannot narrow what a default target already needs.
#
# Consequence, stated plainly: the default tree is NO LONGER the package alone. A
# default `cargo check -p degenbot-fixture-tools --all-targets` links the facade and
# its graph (alloy, rusqlite, tempfile, serde_json, tokio) plus the two product crates
# the capture generator reads (`degenbot-pools`, `degenbot-rpc`) exactly as the
# `fixture-sql-ledger` lane did, and the ledger FEATURE is the only thing the lane
# still adds. Edges point only from this tool package to product crates; no product
# crate may depend on a tool -- which is precisely why the capture generator belongs
# here: `degenbot-rpc` already depends on `degenbot-pools`, so the generator could not
# sit beside the kernel whose goldens it produces without closing a publish cycle, and
# a top-level tool may depend on BOTH.
#
# What each edge is for: `alloy` builds the scenario primitives/transports the
# generators drive AND the recorders' `Address`/`keccak256` handling (plus the
# recapture's `Address`/`B256` arguments and the capture generator's
# `Address`/`B256`/`I256`/`U256` pool state), `rusqlite`
# seeds the throwaway harness DB each recorded chunk runs against, `tempfile` owns
# those throwaway homes, `serde_json` serializes the seed manifest the live span
# recorders write beside each cassette (its KEY ORDER is part of the committed
# bytes, so the edge carries `preserve_order` exactly as the facade's does), the
# recorders' JSON documents, the recapture's canonical fixture output (which is
# why `preserve_order` matters there too: a re-sorted key order would rewrite every
# committed fixture's bytes), and the capture generator's JSONL rows (the CL replay's
# schema, read back by `concentrated_liquidity_solve_replay`), `serde` carries the
# corpus recorder's `Serialize` derive, and `tokio` is the recorders' and the
# recapture's `#[tokio::main]` entry and the capture generator's two throwaway
# `Runtime::new()` reads.
#
# The capture generator's other two edges are its product halves: `degenbot-pools` for
# the V3 pool state, the tick-word source trait, `v3_simulate_swap`,
# `build_int_v3_sequence` and the piecewise solver, and `degenbot-rpc` for
# `AlloyProvider`, the `Slot0Prefix` / `liquidity` reads and `AlloyTickWordSource`.
# `hashbrown` is the pool-state `HashMap` the registration params take -- the same
# map type `degenbot-pools` itself uses, which is why its workspace edge (and its
# `default-hasher`) is the honest one to name rather than `std`'s.
[dependencies]
# The umbrella facade owns the fixture schema and the recorders that read it.
# It also re-exports the three crates the generators import (`degenbot::db`,
# `degenbot::rpc`, `degenbot::simulation`), so the ledger replay and the scratch
# EVM arrive through this one edge rather than three more.
degenbot = { workspace = true }

# The capture generator's two product halves, as their own edges because that is what
# the source imports (no facade re-export). `degenbot-rpc` depends on `degenbot-pools`,
# and this package depending on both is the cycle break that let the generator leave
# `degenbot-rpc`'s example surface (see the header note).
degenbot-rpc.workspace = true
degenbot-pools.workspace = true

# The three-hop calldata helper's two halves, again as their own edges because that is
# what its source imports: `degenbot-execution` for the neutral `PathInfo`/`HopInfo`
# family payloads it builds, and `degenbot-executor` for the production
# `encode_cmd_3_hop` + `EncodeOptions` it calls. Neither is optional and neither carries
# a feature: the helper is a default-features target, so its crates must be plain edges
# exactly like the rest.
degenbot-execution.workspace = true
degenbot-executor.workspace = true

# The pool-registration params carry a `hashbrown::HashMap` (the map type
# `degenbot-pools` uses for tick data), so the generator names the same crate and its
# `default-hasher` feature rather than rebuilding it from `std`'s map.
hashbrown.workspace = true

# `full` matches the facade's own declaration (the lane's facade edge unifies to it
# anyway), and it is the honest one to write: the generators use `alloy::primitives`
# (addresses/words/keccak), the `b256!`/`I256` aliases, and `alloy::transports` for the
# recording seam's `boxed()` chain.
alloy = { version = "^2.5", features = ["full"] }
rusqlite = { version = "^0.42" }
tempfile = { version = "^3.27" }

# The seed manifest (`<window>.seed.json`) is `serde_json` output, and the offline
# replay suites read it back; `preserve_order` keeps the struct-literal key order the
# committed artifacts already carry instead of sorting it into a `BTreeMap` order.
serde_json = { version = "^1.0", features = ["preserve_order"] }

# The Python oracle corpus recorder's `#[derive(Serialize)]` corpus document. Only the
# derive is used (its field order IS the committed JSON byte order), and it is the one
# direct edge the facade example had that this package did not.
serde = { version = "^1.0", features = ["derive"] }

# The recorders' async entry point (`#[tokio::main]`) plus the capture generator's two
# throwaway `Runtime::new()` reads (its slot0/liquidity pass and the tick-word source it
# keeps for the backfill), with the same features the facade's dev-target graph carried.
# Nothing else here needs it.
tokio = { version = "^1.54", features = ["rt-multi-thread", "macros"] }

[features]
default = []

# SQL statement-ledger passthrough (`degenbot` -> `degenbot-db/sql-ledger`). The
# programs that replay their goldens through the ledger build only under it, and
# each of those `[[bin]]` entries carries its own `required-features` so a
# default check skips it deliberately instead of failing on a cfg'd-out module.
# This forward exists in no other tool package: the ledger is fixture-tools'
# lane alone.
#
# A forward is not a resolved tree. On Linux this lane inherits the facade's
# target-scoped `degenbot-simulation/evm2-jit` dependency, so the vendored JIT
# family is in the lane's `cargo tree` output with no feature of this package in
# the chain -- a property of the product graph, not of this forward.
#
# The feature carries the ledger and NOTHING ELSE. It has no `dep:` entries any
# more: since the default binaries (the recorders, the recapture, and the capture
# generator) need this package's crates too, they are plain non-optional edges, and
# `dep:` cannot name a non-optional dependency. That is why the `fixture-sql-ledger` lane differs from the
# `default` lane by exactly the ledger feature.
sql-ledger = ["degenbot/sql-ledger"]

# The nine programs this package carries, split by whether they touch the
# statement ledger.
#
# FOUR replay their SQL goldens through the statement-ledger wrapper, hence the
# `sql-ledger` requirement -- the same requirement their `[[example]]` stanzas
# carried in the facade before the move, so a default check skips every one of
# them deliberately.
[[bin]]
name = "generate_evm_oracle_captures"
path = "src/bin/generate_evm_oracle_captures/main.rs"
required-features = ["sql-ledger"]

[[bin]]
name = "generate_aave_adversarial_captures"
path = "src/bin/generate_aave_adversarial_captures/main.rs"
required-features = ["sql-ledger"]

# The two LIVE span recorders: each drives the real `run_aave_update` chunk loop over
# a `RecordingTransport` against a node, then replays the recorded bytes through the
# statement ledger. Their `--check` arm is the same offline drift gate shape as the
# two generators above, but a full run (and therefore the drift proof) needs a live
# endpoint -- report them as compile-verified, never as live-verified.
[[bin]]
name = "generate_aave_upgrade_windows"
path = "src/bin/generate_aave_upgrade_windows/main.rs"
required-features = ["sql-ledger"]

[[bin]]
name = "generate_aave_config_windows"
path = "src/bin/generate_aave_config_windows/main.rs"
required-features = ["sql-ledger"]

# The live updater cassette recorder, and the exception to the rule above: it
# replays nothing through the statement ledger (its `--check` arm re-serializes each
# cassette through the recorder's canonical writer and re-checks the entry digests,
# all offline), so it carries NO `required-features` and no feature lane can hide it.
# It is a default target: `just check-dev-tools default` builds it precisely because
# that lane is what proves a default-feature build of this package still works. Its
# argv surface is unchanged from the facade example it replaces -- `--check
# <cassette.json>...`, the `pool` / `aave` / `aave-run` kinds, the `--verify`
# verification-surface arm, `--node` over configured-node resolution, and `--out`.
[[bin]]
name = "record_updater_cassette"
path = "src/bin/record_updater_cassette/main.rs"

# The Python oracle corpus recorder: the other default-features target on the same
# rule -- it opens no statement ledger and no operator DB, so no feature lane may hide
# it. Both of its arms need a node that serves the pinned state (there is no offline
# arm): `--check` re-records every scenario twice and compares the bytes with the corpus
# on disk. The argv surface gained the shared `--fixtures-home` override in place of the
# old `--root` anchor; `--scenario`, `--check`, the three repeatable node flags, and
# `--pace-ms` are unchanged.
[[bin]]
name = "record_py_oracle_corpus"
path = "src/bin/record_py_oracle_corpus/main.rs"

# The path-fixture recapture: the third default-features target on the same rule -- it
# opens no statement ledger and no operator DB, so no feature lane may hide it. Both of
# its arms need a live archive node at each fixture's `target_block` (there is no offline
# arm): the default arm rewrites each named fixture with canonical serde formatting, and
# `--check` computes the same refresh, prints the drifted state keys and exits 1, writing
# nothing. Every fixture is an explicit positional argv path, so it resolves no fixture
# home and takes no `--fixtures-home`; `--check`, `--scan lens|bitmap`, `--tick-lens`,
# `--state-view`, and the repeatable fixture list are unchanged from the facade example
# it replaces.

[[bin]]
name = "capture_path_fixture"
path = "src/bin/capture_path_fixture/main.rs"

# The concentrated-liquidity capture generator: the fourth default-features target on the
# same rule -- it opens no statement ledger and no operator DB, so no feature lane may hide
# it. It is the ONLY sanctioned producer of exact-wei goldens for the CL replay corpus, and
# it needs a live archive node at the pinned block (there is no offline arm and no
# `--check`): a run reads the curated V3 pools' slot0/liquidity, backfills their tick maps
# through `v3_simulate_swap`, builds each pool's production `IntV3TickRangeSequence`, forms
# and solves the 2-hop all-concentrated-liquidity paths, and writes the JSONL plus a
# `.block` sidecar. The single optional positional output argument is unchanged; with none,
# the committed corpus fixture under
# `rust/crates/foundation/degenbot-pools/tests/fixtures/` is the default, resolved from the
# repository root (`degenbot_fixture_tools::paths`) instead of the old manifest-relative
# sibling arithmetic. Its four environment keys (`DEGENBOT_CLCAP_RPC`,
# `DEGENBOT_CLCAP_BLOCK`, `DEGENBOT_CLCAP_MAX_FETCHES`, `DEGENBOT_CLCAP_PATH_CAP`) and their
# defaults are unchanged.

[[bin]]
name = "concentrated_liquidity_capture_gen"
path = "src/bin/concentrated_liquidity_capture_gen/main.rs"

# The three-hop production-calldata helper: the fifth default-features target on the same
# rule -- it reads no statement ledger and opens no database of any kind, so no feature
# lane may hide it. It is the OFFLINE test oracle for the Ape execution matrix
# (`tests/executor/`): one JSON request document as argv[1] in, the hex command stream
# `encode_cmd_3_hop` produced out. That stdout contract and the binary name are the stable
# part of this row, which is why `just build-executor-three-hop-encoder` stages the binary
# at the artifact path that matrix reads. No node, no fixture home, no environment key.

[[bin]]
name = "encode_three_hop"
path = "src/bin/encode_three_hop/main.rs"
