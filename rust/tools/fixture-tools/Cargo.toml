[package]
name = "degenbot-fixture-tools"
description = "Record, check, and regenerate the committed fixtures and the test-input generators. Non-publishable development tooling: no product build links it and no `cargo test` lane depends on it."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dependency shape: ONE binary -- the live updater cassette recorder -- is a DEFAULT
# target of this package (it reads no statement ledger, so no feature may hide it),
# and the four SQL-ledger binaries need those same crates. Cargo has no per-target
# dependency selection, so every crate the default binary links must be a plain edge
# here; the feature cannot narrow what the default target already needs.
#
# Consequence, stated plainly: the default tree is NO LONGER the package alone. A
# default `cargo check -p degenbot-fixture-tools --all-targets` links the facade and
# its graph (alloy, rusqlite, tempfile, serde_json, tokio) exactly as the
# `fixture-sql-ledger` lane did, and the ledger FEATURE is the only thing the lane
# still adds. Edges point only from this tool package to product crates; no product
# crate may depend on a tool.
#
# What each edge is for: `alloy` builds the scenario primitives/transports the
# generators drive AND the recorder's `Address`/`keccak256` handling, `rusqlite`
# seeds the throwaway harness DB each recorded chunk runs against, `tempfile` owns
# those throwaway homes, `serde_json` serializes the seed manifest the live span
# recorders write beside each cassette (its KEY ORDER is part of the committed
# bytes, so the edge carries `preserve_order` exactly as the facade's does) and the
# recorder's probe payload, and `tokio` is the recorder's `#[tokio::main]` entry.
[dependencies]
# The umbrella facade owns the fixture schema and the recorders that read it.
# It also re-exports the three crates the generators import (`degenbot::db`,
# `degenbot::rpc`, `degenbot::simulation`), so the ledger replay and the scratch
# EVM arrive through this one edge rather than three more.
degenbot = { workspace = true }

# `full` matches the facade's own declaration (the lane's facade edge unifies to it
# anyway), and it is the honest one to write: the generators use `alloy::primitives`
# (addresses/words/keccak), the `b256!`/`I256` aliases, and `alloy::transports` for the
# recording seam's `boxed()` chain.
alloy = { version = "^2.5", features = ["full"] }
rusqlite = { version = "^0.42" }
tempfile = { version = "^3.27" }

# The seed manifest (`<window>.seed.json`) is `serde_json` output, and the offline
# replay suites read it back; `preserve_order` keeps the struct-literal key order the
# committed artifacts already carry instead of sorting it into a `BTreeMap` order.
serde_json = { version = "^1.0", features = ["preserve_order"] }

# The updater cassette recorder's async entry point (`#[tokio::main]`), with the same
# features the facade's dev-target graph carried for it. Nothing else here needs it.
tokio = { version = "^1.54", features = ["rt-multi-thread", "macros"] }

[features]
default = []

# SQL statement-ledger passthrough (`degenbot` -> `degenbot-db/sql-ledger`). The
# programs that replay their goldens through the ledger build only under it, and
# each of those `[[bin]]` entries carries its own `required-features` so a
# default check skips it deliberately instead of failing on a cfg'd-out module.
# This forward exists in no other tool package: the ledger is fixture-tools'
# lane alone.
#
# A forward is not a resolved tree. On Linux this lane inherits the facade's
# target-scoped `degenbot-simulation/evm2-jit` dependency, so the vendored JIT
# family is in the lane's `cargo tree` output with no feature of this package in
# the chain -- a property of the product graph, not of this forward.
#
# The feature carries the ledger and NOTHING ELSE. It has no `dep:` entries any
# more: since the default binary (the recorder) needs this package's crates too,
# they are plain non-optional edges, and `dep:` cannot name a non-optional
# dependency. That is why the `fixture-sql-ledger` lane differs from the `default`
# lane by exactly the ledger feature.
sql-ledger = ["degenbot/sql-ledger"]

# The five programs this package carries, split by whether they touch the
# statement ledger.
#
# FOUR replay their SQL goldens through the statement-ledger wrapper, hence the
# `sql-ledger` requirement -- the same requirement their `[[example]]` stanzas
# carried in the facade before the move, so a default check skips every one of
# them deliberately.
[[bin]]
name = "generate_evm_oracle_captures"
path = "src/bin/generate_evm_oracle_captures/main.rs"
required-features = ["sql-ledger"]

[[bin]]
name = "generate_aave_adversarial_captures"
path = "src/bin/generate_aave_adversarial_captures/main.rs"
required-features = ["sql-ledger"]

# The two LIVE span recorders: each drives the real `run_aave_update` chunk loop over
# a `RecordingTransport` against a node, then replays the recorded bytes through the
# statement ledger. Their `--check` arm is the same offline drift gate shape as the
# two generators above, but a full run (and therefore the drift proof) needs a live
# endpoint -- report them as compile-verified, never as live-verified.
[[bin]]
name = "generate_aave_upgrade_windows"
path = "src/bin/generate_aave_upgrade_windows/main.rs"
required-features = ["sql-ledger"]

[[bin]]
name = "generate_aave_config_windows"
path = "src/bin/generate_aave_config_windows/main.rs"
required-features = ["sql-ledger"]

# The ONE live updater cassette recorder, and the exception to the rule above: it
# replays nothing through the statement ledger (its `--check` arm re-serializes each
# cassette through the recorder's canonical writer and re-checks the entry digests,
# all offline), so it carries NO `required-features` and no feature lane can hide it.
# It is a default target: `just check-dev-tools default` builds it precisely because
# that lane is what proves a default-feature build of this package still works. Its
# argv surface is unchanged from the facade example it replaces -- `--check
# <cassette.json>...`, the `pool` / `aave` / `aave-run` kinds, the `--verify`
# verification-surface arm, `--node` over configured-node resolution, and `--out`.
[[bin]]
name = "record_updater_cassette"
path = "src/bin/record_updater_cassette/main.rs"
