[package]
name = "degenbot-engine-lab"
description = "Bot, simulation, arbitrage, JIT, fan-out, and BAL measurement instruments. Non-publishable development tooling: not an operator CLI and not a product code path."

version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dependency shape: the corpus support behind `src/lib.rs` is DEFAULT-feature
# code, so the crates it names are plain edges -- Cargo has no per-target
# dependency selection, and the support is shared by JIT and non-JIT
# instruments alike. Every edge still points from this tool to a product crate,
# never back, and a lane only ADDS its own forward: `evm2-jit` turns the JIT
# spine on and `prometheus` the bot exporter, and neither is enabled here.
[dependencies]
# The corpus support builds a production-policy evm2 EVM, deploys the real
# `cmd_executor` creation artifact from the executor's release home, and
# encodes the replayed frame through the production composers -- so the
# simulation engine, the command grammar, and the neutral opportunity
# descriptors the encoding consumes are all direct edges rather than arrivals
# through a re-export.
degenbot-simulation.workspace = true
degenbot-executor.workspace = true
degenbot-execution.workspace = true

# The EVM the corpus is built and measured on: `Evm`/`InMemoryDB`, the block
# env, the ethereum tx registry, and `Version`/`ExecutionConfig`. The engine's
# feature set unifies with the `degenbot-simulation` edge above, which is what
# asks for the production precompile/keccak backends; naming them again here
# would be a second copy of the same decision.
evm2.workspace = true

# The alloy umbrella, matching the simulation edge: the corpus frames are typed
# `TxEip1559` recovered envelopes (`alloy::consensus`), the fixture stubs are
# `sol!` interfaces, and the probe compares `Address`/`B256` sets.
alloy = { version = "^2.5", features = ["full"] }

# The typed RPC provider the cold-miss probe's snapshot-backed stand-in node
# serves (`AlloyProvider::from_provider`). Plain, not `test-utils`: the offline
# provider the fan-out legs build is ungated.
degenbot-rpc.workspace = true

# The transport seam that stand-in implements — `tower::Service` over alloy's
# JSON-RPC request/response packets — and the JSON its members carry.
tower = { version = "^0.5", default-features = false }
serde_json = { version = "^1.0" }

# `join_all` drives the session fan-out probe's multi-fan-out submission: the
# per-fan-out sessions run concurrently and the merged report needs their
# combined facts.
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }

# The cross-block `WarmCodeCacheInner` the steady-state legs front the engine
# with is a `parking_lot` lock, and the multi-threaded runtime the prefetch lane
# enters is the ambient-runtime shape that lock's owner expects. `macros` is the
# session fan-out probe's `#[tokio::main]`.
parking_lot = "^0.13"
tokio = { version = "^1.54", features = ["rt", "rt-multi-thread", "macros"] }

# The bot profiler's guard and exporter, reachable only through `prometheus`.
degenbot-bot = { workspace = true, optional = true }

# The JIT runner the `evm2-jit` lane compiles and runs.
evm2-jit = { workspace = true, optional = true }

[features]
default = []

# The JIT engine lane: the vendored `evm2-jit` edge (its curated root re-exports
# the `evm2_evm` interpreter runner and the `runtime` config the capture-seam
# probe installs) plus `degenbot-simulation/evm2-jit`, which is the `-build` and
# `-runtime` edges and the build script's builtins-symbol export. The programs
# that need it declare it in their own `required-features`, so a default check
# compiles no LLVM codegen.
evm2-jit = ["dep:evm2-jit", "degenbot-simulation/evm2-jit"]

# The bot profiler's Prometheus exporter lane (the guard's `/metrics` listener,
# `degenbot-bot/hotpath-prometheus`). It is the exporter lane only: it is not
# the pool profiling lane, which lives in `degenbot-solver-lab`.
prometheus = ["degenbot-bot/hotpath-prometheus"]

# The JIT-composition probe: does the production capture (access-list slots +
# swap events) survive OFF the `Inspector` hook, so compiled execution can
# carry it? It needs the runner type, so it is a `required-features` target and
# a default check skips it deliberately.
# The parent-linked BAL carry-forward live probe: EVERY canonical block of the
# captured corpus range advanced through the production decode/advance pipeline
# (`ReadHubCache::advance_bal`) against a live node, with every candidate
# anchor's carried values compared against INDEPENDENT cold-node reads at that
# anchor. It compiles no JIT program, so it declares no `required-features`:
# the default lane builds it, and `evm2-jit` remains the lane the JIT-gated
# targets open.
[[bin]]
name = "bal_carry_probe"
path = "src/bin/bal_carry_probe/main.rs"

# The full-clone versus delta-chain snapshot measurement: the same BAL
# carry-forward advances driven through the production full-clone control
# (`ReadHubCache::advance_bal`) and the parent-linked delta-chain prototype
# (`DeltaSnapshotCache::advance_bal`) at realistic working-set sizes, with a
# committed real-coverage correctness leg and a planted-divergence negative
# probe. It compiles no JIT program, so it declares no `required-features`:
# the default lane builds it, and `evm2-jit` remains the lane the JIT-gated
# targets open.
[[bin]]
name = "bal_delta_snapshot_probe"
path = "src/bin/bal_delta_snapshot_probe/main.rs"

# The canonical-head lifecycle live probe: real mainnet heads driven through the
# production BAL head driver, the prepare (BAL fetch and decode) and apply
# stages measured separately, the readiness a caller sees between them, and an
# offline waiter leg over a controllably deferred transport; every settled
# write compared against an independent cold read. It compiles no JIT program,
# so it declares no `required-features`: the default lane builds it, and
# `evm2-jit` remains the lane the JIT-gated targets open.
[[bin]]
name = "bal_head_lifecycle_probe"
path = "src/bin/bal_head_lifecycle_probe/main.rs"

[[bin]]
name = "capture_seam_probe"
path = "src/bin/capture_seam_probe/main.rs"
required-features = ["evm2-jit"]

# The cold-miss cost + coroutine fan-out probe (the evm2 coroutine-fan-out
# decision instrument): a latency-injecting RPC stand-in measures where cold
# storage misses cost wall time and whether N fibers overlap them. It compiles
# no JIT program, so it declares no `required-features`: the default lane builds
# and runs it, and `evm2-jit` remains the lane the JIT-gated targets open.
[[bin]]
name = "cold_miss_fanout_probe"
path = "src/bin/cold_miss_fanout_probe/main.rs"

# The session-scheduler captured-data benchmark: the recorded production fan-out
# read walks driven through the committed `ReadHub` under the committed W/F
# bound, walled against serial / hybrid / fibers / per-lane reads under one
# latency model, with a slot-count sensitivity table, the multi-fan-out
# submission bound, and a cross-leg read-digest identity gate (planted-divergence
# negative control). It compiles no JIT program, so it declares no
# `required-features`: the default lane builds and runs it, and `evm2-jit`
# remains the lane the JIT-gated targets open.
[[bin]]
name = "session_fanout_probe"
path = "src/bin/session_fanout_probe/main.rs"

# The per-worker EVM fan-out probe (the ADR-089 concurrency-trio decision
# instrument): one dispatch fan-out driven four ways -- serial over a shared
# `&mut evm`, per-worker threads, per-candidate fibers on the batched-round
# scheduler, and the warm re-drive -- with cross-leg verdict identity gated. It
# compiles no JIT program either, so it declares no `required-features` and the
# default lane builds and runs it; `evm2-jit` stays the JIT-gated targets' lane.
[[bin]]
name = "worker_fanout_probe"
path = "src/bin/worker_fanout_probe/main.rs"

# The ADR-089 phase-6 offline engine benchmark: one corpus, six engine modes
# (interp / jit-block / jit-pool / aot / replay / replay-jit), first-run vs
# steady-state latency, and the JIT backend's compile telemetry. Every mode
# compiles or replays through the runner, so it is a `required-features` target
# on the same lane the capture probe opened; a default check skips it.
[[bin]]
name = "sim_mode_bench"
path = "src/bin/sim_mode_bench/main.rs"
required-features = ["evm2-jit"]
