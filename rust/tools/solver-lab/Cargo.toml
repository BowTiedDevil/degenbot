[package]
name = "degenbot-solver-lab"
description = "Solver and order-index replay, measurement, and stress instruments. Non-publishable development tooling: no product build links it and no merge gate blocks on it."

version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dependency shape: the default lane is NOT the package alone, because the
# synthetic corpus generator is a default-features target that reads pool state
# through `degenbot-pools` -- Cargo has no per-target dependency selection, so
# every crate a default target links is a plain edge here. Every edge still
# points from this tool to a product crate, never back. The crates the other two
# programs need stay optional, so their lanes are still the only thing that
# *enables* a capability family.
[dependencies]
# The production tick-range sequences the generator writes and the solver entry
# points both replays re-run; `capture-fixtures` is the feature that adds the
# fixture reader the replays resolve their default capture path through.
degenbot-pools = { workspace = true }

# The tick math the synthetic geometry is built from and the V2 hop state the
# mixed replay reconstructs. Its own edge because that is what the source
# imports (no re-export of `degenbot-pools` covers either item).
degenbot-math = { workspace = true }

# Capture rows carry `U256` decimals and JSON documents: both replays parse them
# and the generator emits them, so both edges are plain ones on the same rule as
# `degenbot-pools` above.
alloy = { version = "^2.6" }
serde_json = { version = "^1.0" }

# The scale probe's fan-out: it builds its own `rayon::ThreadPoolBuilder` pools
# at every thread count it sweeps, so the scheduler under measurement is a
# direct edge, not a transitive arrival. Optional and activated by
# `capture-fixtures` (the probe reads a capture), so the default lane compiles
# neither it nor the probe.
rayon = { version = "^1.12", optional = true }
# The probe's production-diagnostics arm enters the `degenbot.arb.solve` span
# per item, and measuring that closure shape is the arm's whole point, so the
# facade is a direct edge. Optional on the same `capture-fixtures` activation as
# `rayon`, on the `hotpath` rule below: `degenbot-pools` carries `tracing`
# non-optionally, so the crate is already in every tree that reaches it and this
# edge only makes the NAME available to this package when the probe's lane is on.
# No other program here names a span, no subscriber is installed, and this is
# never an exporter or a listener.
tracing = { version = "^0.1", optional = true }

# The net-profit order index the strategy microbench measures. Its default
# feature set already carries the hull index, and the `envelope` forward below
# names the lane explicitly so the dependency edge and the lane stay one
# decision rather than a silently inherited default.
degenbot-order-index = { workspace = true, optional = true }
# The microbench's generated points are typed in `U256`, which its source names as
# `alloy_primitives` directly, so that edge is declared here too rather than
# reached through a re-export. Optional on the same `envelope` activation as the
# index above: a default tree compiles neither edge and builds neither program.
alloy-primitives = { version = "^1.7", default-features = false, features = ["std"], optional = true }
# Solver-phase function profiling. `degenbot-pools` carries this dependency
# non-optionally (no-op stubs by default) and matches the version, so the crate
# itself is in every tree that reaches `degenbot-pools`; it is optional here so
# only the `hotpath` lane *enables* real measurement. It is the pool profiling
# crate, NOT the bot's Prometheus exporter.
hotpath = { version = "^0.32.0", default-features = false, optional = true }

[features]
default = []

# Capture-fixture I/O: the committed `.jsonl[.zst]` corpora the replays read,
# plus the two edges only the scale probe names -- the `rayon` scheduler it
# sweeps (a real addition: no default tree here carries it) and the `tracing`
# span its diagnostics arm enters (already present through `degenbot-pools`'s
# own non-optional edge). Activating this lane is the one thing that makes
# either name available to this package; neither is a declared default
# dependency.
capture-fixtures = ["degenbot-pools/capture-fixtures", "dep:rayon", "dep:tracing"]

# The instrumented cache strategies the cache-lab replay compares against the
# full-rebuild reference. The cache-lab binaries also read a capture, so the
# dedicated lane enables `capture-fixtures` beside this one.
cache-lab = ["degenbot-pools/cache-lab"]

# The ambient walk telemetry this replay's `drain_ns` readout reads, forwarded to
# the crate that owns it. Off by default: a plain `capture-fixtures,cache-lab`
# build still replays, still prints the matrix, and the ns split comes back
# zeroed, because the replay's collector-drain assertion sits behind this cfg.
# It reaches `degenbot-pools` alone -- no exporter, no `/metrics` listener, and
# no `degenbot-bot` edge.
telemetry = ["degenbot-pools/telemetry"]

# Solver-phase function profiling: the per-invocation opt-in for the
# functions-timing run. Never the bot exporter lane — this forward never enables
# `hotpath/hotpath-prometheus`, never starts a `/metrics` listener, and never
# reaches `degenbot-bot`.
hotpath = ["degenbot-pools/hotpath", "hotpath/hotpath", "hotpath/threads"]

# The convex-hull net-profit order index the strategy microbench measures, and the
# `U256` its hard-coded point generator is typed in. Both edges are optional and
# `dep:`-named, so this lane is the only thing that adds either to a build.
envelope = ["degenbot-order-index/envelope", "dep:alloy-primitives"]

# The programs this package carries so far, split by which lane each one needs.
#
# FIVE programs read the committed `.jsonl[.zst]` corpora through
# `degenbot-pools`'s fixture reader, so each carries `required-features` and a
# default check skips it deliberately instead of failing on a cfg'd-out module;
# the cache lab names its second forward beside the reader. One more program reads
# no capture at all and is gated on the `envelope` lane alone.

[[bin]]
name = "concentrated_liquidity_solve_replay"
path = "src/bin/concentrated_liquidity_solve_replay/main.rs"
required-features = ["capture-fixtures"]

[[bin]]
name = "mixed_solve_replay"
path = "src/bin/mixed_solve_replay/main.rs"
required-features = ["capture-fixtures"]

# The entry A/B readout: it reads a capture through the same fixture reader and
# runs both solve entries over every all-concentrated-liquidity path, so the
# reader is its only required forward. `hotpath` is an optional second build
# shape of the same binary (the functions-timing run over the
# `concentrated_liquidity_solve.*` labels), never a `required-features` entry.

[[bin]]
name = "entry_ab_readout"
path = "src/bin/entry_ab_readout/main.rs"
required-features = ["capture-fixtures"]

# Exact I1024/BigInt vs normalized I512 shifted-piece arithmetic. The capture
# reader is its only required forward; telemetry is an optional second shape.
[[bin]]
name = "mobius_normalization_readout"
path = "src/bin/mobius_normalization_readout/main.rs"
required-features = ["capture-fixtures"]

# The cache-lab replay: it reads a capture through the same fixture reader and
# solves every state through the instrumented cache strategies, so its lane is
# both forwards. Neither is a profiler, a ledger, or a database lane. Its
# `telemetry` forward is optional and never a `required-features` entry: the
# collector-drain assertion compiles only in that second build shape.

[[bin]]
name = "concentrated_liquidity_cache_lab"
path = "src/bin/concentrated_liquidity_cache_lab/main.rs"
required-features = ["capture-fixtures", "cache-lab"]

# The rayon scale probe: the one program here that measures the solver's
# fan-out instead of a path's result. It reads a capture through the same
# fixture reader, then re-runs production `solve_path_with_min_profit` under its
# own `rayon` pools at each swept thread count; `--paths`, `--serial-passes` and
# `--ns` are per-run caps on that sweep. Its golden-lite profit check filters the
# measured set (a path that fails it is excluded, never silently kept) and is
# never a timing threshold.

[[bin]]
name = "rayon_scale_probe"
path = "src/bin/rayon_scale_probe/main.rs"
required-features = ["capture-fixtures"]

# The block-epoch data-plane budget probe: it builds synthetic in-memory V2/V3
# journals and tick maps and runs its hard-coded M1-M6 feasibility/performance
# matrices, reading no capture and opening no database of any kind, so it
# carries NO `required-features` and the package's default lane builds it — a
# budget instrument must be runnable without a feature lane. Its only input
# from outside the process is `/proc/self/statm` for the RSS column (Linux
# only).
[[bin]]
name = "stateview_feasibility_probe"
path = "src/bin/stateview_feasibility_probe/main.rs"

# The synthetic corpus generator reads no capture and opens no database of any
# kind: it builds its own geometry and writes the two committed corpora, so it
# carries NO `required-features` and the package's default lane builds it. That
# is also why its write anchor (`degenbot_solver_lab::paths`) resolves from the
# repository root: the corpora belong to the pools crate's fixture home.
[[bin]]
name = "synth_corpus_gen"
path = "src/bin/synth_corpus_gen/main.rs"

# The order-index strategy microbench: it generates its points in source and reads
# no capture, no node, no environment key, and no database, but it does need the
# hull index (and the `U256` its points are typed in), so its lane is `envelope`
# alone. Measurement, not a gate: it hard-codes its 1M and 10M runs and carries no
# pass/fail threshold, so no routine lane executes it.

[[bin]]
name = "bench_strategies"
path = "src/bin/bench_strategies/main.rs"
required-features = ["envelope"]
