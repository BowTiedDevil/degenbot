[package]
name = "degenbot-settlement-bot-example"
description = "Rust-owned settlement-arbitrage bot — the external consumer's parity twin of examples/eth_settlement_arbitrage_v2_v3_v4_rust.py + src/degenbot/runner (epic RGZG4S; docs/architecture/rust-settlement-bot-parity.md). Depends ONLY on the umbrella `degenbot` crate (+ toml for config.toml reads), exercising exactly what `cargo add degenbot` gives a pure-Rust bot builder — including its gaps."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# External-consumer fidelity: ONLY the umbrella (+ toml to read the Python
# config.toml cascade layers [rpc]/[ws]/[database]). If a core capability is
# needed, it must become reachable through `degenbot` — the compile error IS
# the gap-discovery mechanism (see the parity ledger).
degenbot = { path = "../../crates/degenbot", features = ["otel"] }
# `alloy` is required for the U256/Address/Bytes value types the public
# `degenbot::arbitrage` fee seam and `degenbot::submission` seams name in
# their signatures (a `cargo add degenbot` consumer naming those seams needs
# it too). Nothing here bypasses a degenbot surface.
alloy = { version = "^2.5", features = ["full"] }
toml = "^1"
# serde_json is the driver-local JSON codec for the operator Unix-socket
# channel (the Rust twin of Python's stdlib json). Like toml it is a
# driver-local format codec, not a core capability: the wire framing/op
# semantics live in the example, and the output serializer is hand-written to
# match json.dumps byte-for-byte (see operator_channel).
serde_json = "^1"
# The driver async runtime (the asyncio analogue). "net" backs the operator
# Unix socket, "signal" the inert operator mode's Ctrl-C exit. The umbrella
# already depends on tokio; this is the pure-Rust consumer owning its own
# task/claim primitives — NOT a core capability lifted into the example.
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync", "net", "signal"] }
# Telemetry boot wiring (Gap G6). The driver composes its
# console subscriber + optional OTel layer from the core `degenbot::bot::otel`
# / `degenbot::bot::metrics` surfaces, exactly as `degenbot-python` composes
# its own registry. `tracing` is required because the `op_info!`/`op_warn!`
# facade macros expand to `::tracing::...` at the call site;
# `tracing-subscriber` is the console sink. Version-locked to the same line
# the core optional deps pin.
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "registry", "fmt", "env-filter", "time"] }
degenbot-eventhub = { version = "0.6.0-alpha.13", path = "../../crates/degenbot-eventhub" }

[dev-dependencies]
# start_paused + tokio::time::advance give the session-watch tests a
# controlled clock instead of real sleeps ("test-util" enables paused time).
tokio = { version = "^1.53", features = ["test-util"] }
