# degenbot Rust workspace — pure virtual manifest.
#
# The workspace root holds ONLY the `[workspace]` declaration + the `[profile.*]`
# blocks (Cargo only honors `[profile]` at the workspace root — keep them here).
# The workspace contains 31 crates plus two non-publishable examples. Crates are
# explicitly grouped by architectural role under
# `crates/{foundation,engine,integrations,shells,facade}/`; examples live under
# `examples/`. The Python binding is a shell beside the Rust-facing core rather
# than an implementation peer.
#
# Engine and foundation crates are pyo3-free under their default features;
# `degenbot_rs` enables selected crates' `pyo3` features so the
# `From<Error> for PyErr` conversions are available at the binding layer. Verify
# with `just check-no-pyo3-in-cores`.

# Shared package metadata inherited by every member crate via `<field>.workspace
# = true` (ADR-009 single-source-of-truth versioning). The version literal here
# is the *only* version in the Rust tree; the binding crate `degenbot_rs`
# (`crates/shells/degenbot-python/`) inherits it, and maturin reads that crate's
# version to set the published wheel's — so one edit moves both halves.
[workspace.package]
version = "0.6.0-alpha.13"
edition = "2021"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/BowTiedDevil/degenbot"
authors = ["BowTiedDevil <devil@bowtieddevil.com>"]

# Single source of truth for lint policy across all workspace members
# (ADR: centralize per-crate [lints] duplication). Every member inherits these
# via `[lints] workspace = true`, so adjusting a clippy group or adding a lint
# is a one-line edit here instead of a per-crate sweep. This is the in-tree
# POLICY; the push gate's `cargo clippy -- --deny warnings` is what escalates
# the warn-level groups to hard failure at push/CI time.
[workspace.lints.rust]
warnings = "deny"
# cargo-llvm-cov builds set --cfg coverage and the instrumented tests carry
# #[cfg_attr(coverage, ignore)] for timing-sensitive pins; declare the name so
# default (non-instrumented) builds accept the attribute instead of
# erroring on an unknown cfg.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage, values(none()))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic safety - must handle errors, not crash
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"

# The "no cheating" rule
# NOTE: allow_attributes_without_reason would ALSO demand a reason on every #[expect]
# (882 expects, only 19 reasoned) - too costly. keep allow_attributes (outer) + a CI rg guard for inner #![allow].
allow_attributes = "deny"

# Code hygiene - no debug leftovers
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Prevents deadlocks
await_holding_lock = "deny"

# Libraries shouldn't exit
exit = "deny"

[workspace.dependencies]
degenbot = { version = "0.6.0-alpha.13", path = "crates/facade/degenbot" }
# Internal path deps carry explicit version requirements here so the 30
# publishable crates pass cargo publish manifest validation. Keep these
# version literals in sync with [workspace.package].version (lockstep, ADR-009).
degenbot-aave = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-aave" }
degenbot-abi = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-abi" }
degenbot-arbitrage = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-arbitrage" }
degenbot-bot = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-bot" }
degenbot-cli = { version = "0.6.0-alpha.13", path = "crates/shells/degenbot-cli" }
degenbot-cli-core = { version = "0.6.0-alpha.13", path = "crates/shells/degenbot-cli-core" }
degenbot-core = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-core" }
degenbot-config = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-config" }
degenbot-db = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-db" }
degenbot-decoders = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-decoders" }
degenbot-execution = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-execution" }
degenbot-executor = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-executor" }
degenbot-eventhub = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-eventhub" }
degenbot-fork = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-fork" }
degenbot-ingestion = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-ingestion" }
degenbot-math = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-math" }
degenbot-order-index = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-order-index" }
degenbot-pathfinding = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-pathfinding" }
degenbot-pool-updater = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-pool-updater" }
degenbot-pools = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-pools" }
degenbot-price = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-price" }
degenbot-rpc = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-rpc" }
degenbot-runs = { version = "0.6.0-alpha.13", path = "crates/integrations/degenbot-runs" }
degenbot-simulation = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-simulation" }
degenbot-solvers = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-solvers" }
degenbot-strategy = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-strategy" }
degenbot-submission = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-submission" }
degenbot-uniswap = { version = "0.6.0-alpha.13", path = "crates/foundation/degenbot-uniswap" }
degenbot-workers = { version = "0.6.0-alpha.13", path = "crates/engine/degenbot-workers" }
# hashbrown: foldhash-based HashMap/HashSet for the hot maps (small int/string
# keys generated in-process — no DoS surface). 0.17.1 + foldhash 0.2.0 already
# resolve transitively (indexmap 2.14 / lru 0.18), so this direct dependency
# unifies the graph instead of growing it. default-hasher = foldhash.
hashbrown = { version = "0.17", features = ["default-hasher"] }
# indexmap: insertion-ordered set/map. `IndexSet` is the recency ledger's bucket
# set (epic MROOY7 task 7S4QAG) — hashbrown offers no ordered variant, and the
# ledger needs order-preserving mutation: `shift_remove` on promotion, a
# `split_off` head/tail split on a partial drain, and `mem::take` for a
# whole-bucket drain. 2.14.2 already resolves transitively (alloy et al.), so
# this direct dep unifies the graph rather than growing it.
indexmap = "2"
# zstd: decode-only use for the committed .jsonl.zst capture fixtures
# (degenbot-solvers/src/capture_fixture.rs). arrays avoids building the
# legacy/mt C code paths we never touch.
zstd = { version = "0.14", default-features = false, features = ["arrays"] }

[workspace]
resolver = "3"
members = [
    "crates/facade/degenbot",
    "crates/foundation/degenbot-abi",
    "crates/foundation/degenbot-config",
    "crates/foundation/degenbot-core",
    "crates/foundation/degenbot-db",
    "crates/foundation/degenbot-decoders",
    "crates/foundation/degenbot-eventhub",
    "crates/foundation/degenbot-executor",
    "crates/foundation/degenbot-math",
    "crates/foundation/degenbot-order-index",
    "crates/foundation/degenbot-pathfinding",
    "crates/foundation/degenbot-pools",
    "crates/foundation/degenbot-rpc",
    "crates/foundation/degenbot-uniswap",
    "crates/engine/degenbot-arbitrage",
    "crates/engine/degenbot-bot",
    "crates/engine/degenbot-execution",
    "crates/engine/degenbot-simulation",
    "crates/engine/degenbot-solvers",
    "crates/engine/degenbot-strategy",
    "crates/engine/degenbot-submission",
    "crates/engine/degenbot-workers",
    "crates/integrations/degenbot-aave",
    "crates/integrations/degenbot-fork",
    "crates/integrations/degenbot-ingestion",
    "crates/integrations/degenbot-pool-updater",
    "crates/integrations/degenbot-price",
    "crates/integrations/degenbot-runs",
    "crates/shells/degenbot-cli",
    "crates/shells/degenbot-cli-core",
    "crates/shells/degenbot-python",
    # Non-publishable samples live outside the role-grouped product crates.
    "examples/degenbot-execution-sample",
    # The external umbrella-consumer example depends through `degenbot` like an
    # out-of-workspace `cargo add degenbot` user.
    "examples/settlement_bot",
]
# Keep unqualified Cargo commands focused on the two first-class pure-Rust
# entry points. The PyO3 binding and non-publishable samples remain workspace
# members, but dedicated recipes must select them explicitly.
default-members = [
    "crates/facade/degenbot",
    "crates/shells/degenbot-cli",
]

# Release profile.
#
# IMPORTANT framing for the two first-class consumers (see AGENTS.md): Cargo
# only honors `[profile.*]` from the top-level package being built — profile
# settings in the manifests of *dependencies* are ignored entirely. So every
# block below tunes ONLY degenbot's own in-repo builds (the `degenbot_rs`
# cdylib and in-workspace `cargo test`/`clippy`).
#
# The pure-Rust consumer (`cargo add degenbot`, building the umbrella crate
# into their own binary — see `examples/standalone_consumer.rs`) is entirely
# unaffected: their build reads *their* workspace's `[profile.release]`, which
# applies uniformly across the whole dependency graph including these crates.
# Their binary's LTO/codegen is theirs to own, not this file's.
#
# Within this workspace, the only shipped runtime artifact is the `degenbot_rs`
# cdylib (the Python extension, built from `crates/shells/degenbot-python`), and it
# gets the heavy optimizations — `lto = "thin"` + `strip` + `codegen-units = 1`.
# `lto`/`strip` are profile-level (Cargo has no per-package `lto`), so they
# apply workspace-wide, but the final thin-LTO link only spans codegen units
# that survive into the cdylib.
#
# The pure-Rust core crates (`degenbot-core`, `-concentrated-liquidity-math`, `-abi`, `-rpc`,
# `-bot`) get per-package overrides below: more `codegen-units` for faster
# compilation during a cdylib release build. They are libraries consumed (and
# inlined at the final link) by the cdylib, so the looser per-package codegen
# does not meaningfully hurt runtime — the cdylib's thin LTO re-converges.
#
# If a Rust bot is ever shipped as a *binary built inside this workspace* (no
# `[[bin]]` target exists today — all members are libraries), revisit this:
# the per-package loosening and the cdylib-singular framing would then apply
# to that second shipped artifact. Downstream consumers building it from the
# umbrella are unaffected regardless.
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.release.package.degenbot-core]
codegen-units = 16
[profile.release.package.degenbot-math]
codegen-units = 16
[profile.release.package.degenbot-pools]
codegen-units = 16
[profile.release.package.degenbot-price]
codegen-units = 16
[profile.release.package.degenbot-abi]
codegen-units = 16
[profile.release.package.degenbot-rpc]
codegen-units = 16
[profile.release.package.degenbot-fork]
codegen-units = 16
[profile.release.package.degenbot-bot]
codegen-units = 16
[profile.release.package.degenbot-decoders]
codegen-units = 16
[profile.release.package.degenbot-uniswap]
codegen-units = 16
[profile.release.package.degenbot-pathfinding]
codegen-units = 16
[profile.release.package.degenbot-db]
codegen-units = 16
[profile.release.package.degenbot-executor]
codegen-units = 16
[profile.release.package.degenbot-submission]
codegen-units = 16

# Dev profile (default for `cargo test` / `just dev`): favor representative
# optimization over a fully unoptimized debug build, while keeping iteration
# substantially cheaper than release. No LTO or stripping; line-tables-only
# debug info preserves useful backtraces without the full development DWARF cost.
# This is intentionally opt-level 1: the development extension
# should exercise representative optimized code, and release remains the only
# profile that pays for thin LTO and stripping.
[profile.dev]
# More codegen units for faster incremental dev builds across all crates.
opt-level = 1
# "Relaxed debug-info" (per the comment above, but it was omitted until the
# 422G rust/target incident): line tables keep `RUST_BACKTRACE`, perf, and
# flamegraphs resolving to file:line while dropping the variable/type DWARF
# that bloated every test binary to ~0.5 GiB x hundreds of hash variants.
# Ad-hoc deep debugging a single suite: RUSTFLAGS="-C debuginfo=2 cargo test ...
# (Rust >= 1.71 syntax: "line-tables-only"; older spellings: -C debuginfo=1.)
debug = "line-tables-only"
