# degenbot Rust workspace — pure virtual manifest.
#
# The workspace root holds ONLY the `[workspace]` declaration + the `[profile.*]`
# blocks (Cargo only honors `[profile]` at the workspace root — keep them here).
# The seven pyo3-free core crates + the `degenbot_rs` PyO3 binding layer are all
# workspace *members* nested under `crates/`, mirroring the `polars` repo layout
# where `polars-python` sits as a peer of `polars-core`/`-ops`/`-plan`/etc.
# (ergo UG6FKN follow-up / ADR-005 deferral: the binding layer was lifted out of
# the workspace root into `crates/degenbot-python/`.)
#
# Cores are pyo3-free under their default features; `degenbot-python` enables each
# core's `pyo3` feature so the `From<Error> for PyErr` conversions are available
# at the binding layer. Verify with `just check-no-pyo3-in-cores`.

[workspace]
resolver = "2"
members = [
    "crates/degenbot-core",
    "crates/degenbot-cl-math",
    "crates/degenbot-abi",
    "crates/degenbot-rpc",
    "crates/degenbot-bot",
    "crates/degenbot-decoders",
    "crates/degenbot-uniswap",
    "crates/degenbot-python",
]

# Release profile.
#
# The `degenbot_rs` cdylib (the Python extension, built from
# `crates/degenbot-python`) gets the heavy optimizations — `lto = "thin"` +
# `strip` + `codegen-units = 1` — because it is the shipped runtime artifact.
# `lto`/`strip` are profile-level (Cargo has no per-package `lto`), so they apply
# workspace-wide, but the final thin-LTO link only spans codegen units that
# survive into the cdylib.
#
# The pure-Rust core crates (`degenbot-core`, `-cl-math`, `-abi`, `-rpc`,
# `-bot`) get per-package overrides below: more `codegen-units` for faster
# compilation during a cdylib release build. They are libraries consumed (and
# inlined at the final link) by the cdylib, so the looser per-package codegen
# does not meaningfully hurt runtime — the cdylib's thin LTO re-converges.
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.release.package.degenbot-core]
codegen-units = 16
[profile.release.package.degenbot-cl-math]
codegen-units = 16
[profile.release.package.degenbot-abi]
codegen-units = 16
[profile.release.package.degenbot-rpc]
codegen-units = 16
[profile.release.package.degenbot-bot]
codegen-units = 16
[profile.release.package.degenbot-decoders]
codegen-units = 16
[profile.release.package.degenbot-uniswap]
codegen-units = 16

# Dev profile (default for `cargo test` / `just dev`): keep compilation fast.
# No LTO, relaxed debug-info so the pure-Rust cores (`cargo test -p <crate>`)
# rebuild quickly during the red-green loop.
[profile.dev]
# More codegen units for faster incremental dev builds across all crates.
codegen-units = 16
