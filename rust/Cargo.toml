[package]
authors = ["BowTiedDevil <devil@bowtieddevil.com>"]
name = "degenbot_rs"
description = "Rust implementations used by the degenbot Python package."
edition = "2021"
publish = false
repository = "https://github.com/BowTiedDevil/degenbot"
license = "MIT"

[lints.rust]
warnings = "deny"

[lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"

[lib]
name = "degenbot_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
alloy = { version = "^2.0", features = ["full", "transport-throttle"] }
dashmap = { version = "^6.1" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
log = { version = "^0.4" }
lru = { version = "^0.18" }
parking_lot = { version = "^0.12" }
pyo3 = { version = "^0.29", features = [ "abi3-py312", "serde"] }
pyo3-async-runtimes = { version = "^0.29", features = ["tokio-runtime"] }
pyo3-log = { version = "^0.13" }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.52", features = ["rt-multi-thread", "time", "macros", "sync"] }

[features]
default = ["auto-initialize"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]

[dev-dependencies]
ctor = "^1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "^1.10"

[[bench]]
name = "tick_math"
harness = false
required-features = ["auto-initialize"]

[[bench]]
name = "address_utils"
harness = false
required-features = ["auto-initialize"]

[[bench]]
name = "abi_decode"
harness = false

[[bench]]
name = "abi_encode"
harness = false

[[bench]]
name = "mobius_solver"
harness = false

[[test]]
name = "python_integration"
required-features = ["auto-initialize"]

[[test]]
name = "concurrency_stress"
required-features = ["auto-initialize"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "mobius_exact_vs_f64"
harness = false
