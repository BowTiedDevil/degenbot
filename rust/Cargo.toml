# degenbot Rust workspace — pure virtual manifest.
#
# The workspace root holds ONLY the `[workspace]` declaration + the `[profile.*]`
# blocks (Cargo only honors `[profile]` at the workspace root — keep them here).
# The workspace contains 31 crates, a non-publishable stub generator
# (rust/tools/stubgen), and two non-publishable examples. Crates are
# explicitly grouped by architectural role under
# `crates/{foundation,engine,integrations,shells,facade}/`; examples live under
# `examples/`. The Python binding is a shell beside the Rust-facing core rather
# than an implementation peer.
#
# Engine and foundation crates are pyo3-free under their default features;
# `degenbot_rs` enables selected crates' `pyo3` features so the
# `From<Error> for PyErr` conversions are available at the binding layer. Verify
# with `just check-no-pyo3-in-cores`.

# Shared package metadata inherited by every member crate via `<field>.workspace
# = true` (ADR-009 single-source-of-truth versioning). The version literal here
# is the *only* version in the Rust tree; the binding crate `degenbot_rs`
# (`crates/shells/degenbot-python/`) inherits it, and maturin reads that crate's
# version to set the published wheel's — so one edit moves both halves.
[workspace.package]
version = "0.6.0-alpha.19"
edition = "2021"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/BowTiedDevil/degenbot"
authors = ["BowTiedDevil <devil@bowtieddevil.com>"]

# Single source of truth for lint policy across all workspace members
# (ADR: centralize per-crate [lints] duplication). Every member inherits these
# via `[lints] workspace = true`, so adjusting a clippy group or adding a lint
# is a one-line edit here instead of a per-crate sweep. This is the in-tree
# POLICY; the push gate's `cargo clippy -- --deny warnings` is what escalates
# the warn-level groups to hard failure at push/CI time.
#
# The open-ended `warnings` group is deliberately NOT denied here: it would bind
# every toolchain to the lint surface of whichever vintage compiled the tree, so
# a lint the reference toolchain never had would fail compliant contributors.
# Escalation belongs to the strict tier's verdict (the reference channel - see
# scripts/toolchain_tier.sh); the named denies below stay hard everywhere.
[workspace.lints.rust]
# cargo-llvm-cov builds set --cfg coverage and the instrumented tests carry
# #[cfg_attr(coverage, ignore)] for timing-sensitive pins; declare the name so
# default (non-instrumented) builds accept the attribute instead of
# erroring on an unknown cfg. `tokio_unstable` is supplied per-build via RUSTFLAGS
# on the hotpath lanes (degenbot-bot / the degenbot-pools `solve` tree carry a `compile_error!`
# guard so a hotpath build without it fails loudly instead of silently dropping
# the tokio RuntimeMetrics).
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage, values(none()))', 'cfg(tokio_unstable)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic safety - must handle errors, not crash
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"

# The "no cheating" rule
# NOTE: allow_attributes_without_reason would ALSO demand a reason on every #[expect]
# (882 expects, only 19 reasoned) - too costly. keep allow_attributes (outer) + a CI rg guard for inner #![allow].
allow_attributes = "deny"

# Async hygiene - a future bound to `let _ =` is dropped on the spot and never runs,
# so the async body never executes (the cancelling-async talk's opening example).
# Rust cannot backstop this with unused_must_use: most futures are not #[must_use].
let_underscore_future = "deny"

# Code hygiene - no debug leftovers
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Prevents deadlocks
await_holding_lock = "deny"

# Libraries shouldn't exit
exit = "deny"

[workspace.dependencies]
degenbot = { version = "0.6.0-alpha.19", path = "crates/facade/degenbot" }
# Internal path deps carry explicit version requirements here so the 30
# publishable crates pass cargo publish manifest validation. Keep these
# version literals in sync with [workspace.package].version (lockstep, ADR-009).
degenbot-aave = { version = "0.6.0-alpha.19", path = "crates/integrations/degenbot-aave" }
degenbot-abi = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-abi" }
degenbot-batch-executor = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-batch-executor" }
degenbot-arbitrage = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-arbitrage" }
degenbot-bot = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-bot" }
degenbot-cli = { version = "0.6.0-alpha.19", path = "crates/shells/degenbot-cli" }
degenbot-cli-core = { version = "0.6.0-alpha.19", path = "crates/shells/degenbot-cli-core" }
degenbot-core = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-core" }
degenbot-config = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-config" }
degenbot-db = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-db" }
degenbot-decoders = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-decoders" }
degenbot-execution = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-execution" }
degenbot-executor = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-executor" }
degenbot-eventhub = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-eventhub" }
degenbot-fork = { version = "0.6.0-alpha.19", path = "crates/integrations/degenbot-fork" }
degenbot-ingestion = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-ingestion" }
degenbot-math = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-math" }
degenbot-order-index = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-order-index" }
degenbot-pathfinding = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-pathfinding" }
degenbot-pool-updater = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-pool-updater" }
degenbot-pools = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-pools" }
degenbot-price = { version = "0.6.0-alpha.19", path = "crates/integrations/degenbot-price" }
degenbot-rpc = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-rpc" }
degenbot-runs = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-runs" }
degenbot-simulation = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-simulation" }
degenbot-strategy = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-strategy" }
degenbot-submission = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-submission" }
degenbot-substrate = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-substrate" }
degenbot-uniswap = { version = "0.6.0-alpha.19", path = "crates/foundation/degenbot-uniswap" }
degenbot-workers = { version = "0.6.0-alpha.19", path = "crates/engine/degenbot-workers" }
# hashbrown: foldhash-based HashMap/HashSet for the hot maps (small int/string
# keys generated in-process — no DoS surface). 0.17.1 + foldhash 0.2.0 already
# resolve transitively (indexmap 2.14 / lru 0.18), so this direct dependency
# unifies the graph instead of growing it. default-hasher = foldhash.
hashbrown = { version = "0.17", features = ["default-hasher"] }
# indexmap: insertion-ordered set/map. `IndexSet` is the recency ledger's bucket
# set — hashbrown offers no ordered variant, and the
# ledger needs order-preserving mutation: `shift_remove` on promotion, a
# `split_off` head/tail split on a partial drain, and `mem::take` for a
# whole-bucket drain. 2.14.2 already resolves transitively (alloy et al.), so
# this direct dep unifies the graph rather than growing it.
indexmap = "2"
# zstd: decode-only use for the committed .jsonl.zst capture fixtures
# (degenbot-pools/src/solve/capture_fixture.rs). arrays avoids building the
# legacy/mt C code paths we never touch.
zstd = { version = "0.14", default-features = false, features = ["arrays"] }

[workspace]
resolver = "3"
members = [
    "crates/facade/degenbot",
    "crates/foundation/degenbot-abi",
    "crates/foundation/degenbot-config",
    "crates/foundation/degenbot-core",
    "crates/foundation/degenbot-db",
    "crates/foundation/degenbot-decoders",
    "crates/foundation/degenbot-eventhub",
    "crates/foundation/degenbot-executor",
    "crates/foundation/degenbot-math",
    "crates/foundation/degenbot-order-index",
    "crates/foundation/degenbot-pathfinding",
    "crates/foundation/degenbot-pools",
    "crates/foundation/degenbot-substrate",
    "crates/foundation/degenbot-rpc",
    "crates/foundation/degenbot-uniswap",
    "crates/engine/degenbot-arbitrage",
    "crates/engine/degenbot-batch-executor",
    "crates/engine/degenbot-bot",
    "crates/engine/degenbot-execution",
    "crates/engine/degenbot-simulation",
    "crates/engine/degenbot-strategy",
    "crates/engine/degenbot-submission",
    "crates/engine/degenbot-workers",
    "crates/integrations/degenbot-aave",
    "crates/integrations/degenbot-fork",
    "crates/integrations/degenbot-price",
    # ADR-084 D4: transport/IO the stack depends on is foundation — ingestion,
    # runs, and pool-updater moved out of integrations (W4).
    "crates/foundation/degenbot-ingestion",
    "crates/foundation/degenbot-pool-updater",
    "crates/foundation/degenbot-runs",
    "crates/shells/degenbot-cli",
    "crates/shells/degenbot-cli-core",
    "crates/shells/degenbot-python",
    # Non-publishable samples + the ADR-066 stub generator live outside the
    # role-grouped product crates.
    "examples/degenbot-execution-sample",
    # The external umbrella-consumer example depends through `degenbot` like an
    # out-of-workspace `cargo add degenbot` user.
    "examples/settlement_bot",
    "tools/stubgen",
]
# Keep unqualified Cargo commands focused on the two first-class pure-Rust
# entry points. The PyO3 binding and non-publishable samples remain workspace
# members, but dedicated recipes must select them explicitly.
default-members = [
    "crates/facade/degenbot",
    "crates/shells/degenbot-cli",
]

# Release profile.
#
# Cargo only honors `[profile.*]` from the top-level package being built, so
# this block tunes ONLY this workspace's own builds (the `degenbot_rs` cdylib
# and in-workspace `cargo test`/`clippy`). A pure-Rust consumer building the
# umbrella crate into their own binary reads their workspace's profile, not
# this one.
#
# Within this workspace the only shipped runtime artifact is the `degenbot_rs`
# cdylib (the Python extension). It is pinned to `codegen-units = 1` below so
# the final thin-LTO link gets maximal codegen granularity; `lto`/`strip` have
# no per-package form and stay profile-level. Everything else — every member
# library, present and future, and all third-party dependencies — compiles at
# 16 codegen units and is re-converged by that same final link. New crates
# inherit this with no manifest edit; the shape is gate-enforced
# (`just check-profile-policy`) and recorded in ADR-088. A second shipped
# binary artifact would take its own `codegen-units = 1` pin at that decision.
[profile.release]
lto = "thin"
strip = true
codegen-units = 16

[profile.release.package.degenbot_rs]
codegen-units = 1

# Dev profile (default for `cargo test` / `just dev`): favor representative
# optimization over a fully unoptimized debug build, while keeping iteration
# substantially cheaper than release. No LTO or stripping; line-tables-only
# debug info preserves useful backtraces without the full development DWARF cost.
# This is intentionally opt-level 1: the development extension
# should exercise representative optimized code, and release remains the only
# profile that pays for thin LTO and stripping.
[profile.dev]
# More codegen units for faster incremental dev builds across all crates.
opt-level = 1
# "Relaxed debug-info" (per the comment above, but it was omitted until the
# 422G rust/target incident): line tables keep `RUST_BACKTRACE`, perf, and
# flamegraphs resolving to file:line while dropping the variable/type DWARF
# that bloated every test binary to ~0.5 GiB x hundreds of hash variants.
# Ad-hoc deep debugging a single suite: RUSTFLAGS="-C debuginfo=2 cargo test ...
# (Rust >= 1.71 syntax: "line-tables-only"; older spellings: -C debuginfo=1.)
debug = "line-tables-only"
