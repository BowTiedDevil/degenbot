# nextest profiles for degenbot's Rust workspace.
# Run with: just test-rust-nextest (or cargo nextest run ... --profile ci).
# The ci profile writes per-test durations as JUnit XML (sort `time` to rank
# slow tests); `just test-timing` does that ranking.

[profile.ci]
retries = 0
# Mark anything over 10s as slow; over 20s (2x) fail it so regressions are visible.
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.ci.junit]
path = "nextest-ci.junit.xml"

# The release-profile leg (`just test-rust-nextest-release`). Same fail-fast-free
# policy as `ci`, in its OWN profile so its JUnit report lands under
# `<target>/nextest/release-ci/` and never overwrites the whole-workspace dev
# run's report (`just test-timing` reads `ci`).
[profile.release-ci]
retries = 0
slow-timeout = { period = "10s", terminate-after = 2 }

[profile.release-ci.junit]
path = "nextest-release-ci.junit.xml"
