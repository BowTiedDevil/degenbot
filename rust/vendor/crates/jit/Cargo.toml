[package]
name = "degenbot-evm2-jit"
description = "EVM bytecode compiler"

version = "0.6.0-alpha.19"
authors = ["DaniPopes <57450786+DaniPopes@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies", "development-tools", "no-std"]
keywords = ["bytecode", "ethereum", "evm", "execution", "interpreter"]
repository = "https://github.com/BowTiedDevil/degenbot"
exclude = [".github/", "benches/", "fuzz/", "tests/"]

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
test = false
doctest = false

[dependencies]
evm2.workspace = true
evm2-jit-backend.workspace = true
evm2-jit-builtins = { workspace = true, features = ["ir"] }
evm2-jit-codegen.workspace = true
evm2-jit-context.workspace = true
evm2-jit-llvm = { workspace = true, optional = true }
evm2-jit-runtime.workspace = true

[build-dependencies]
evm2-jit-build.workspace = true

[features]
default = ["llvm"]
llvm = ["dep:evm2-jit-llvm", "evm2-jit-codegen/llvm", "evm2-jit-runtime/llvm"]
asm-keccak = ["evm2-jit-codegen/asm-keccak", "evm2-jit-runtime/asm-keccak"]
