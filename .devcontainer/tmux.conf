# degenbot devcontainer tmux config — installed to /etc/tmux.conf by the
# Dockerfile so it applies to every container user. Pi's TUI uses 24-bit RGB
# colors; this config makes them render correctly when pi is launched inside
# tmux via ssh-attach.sh instead of collapsing to a dim 16-color palette.

# 256-color inside tmux (tmux 3.6b already defaults to this — stated for
# clarity; the inner TERM pi sees is tmux-256color, which advertises 256).
set -g default-terminal "tmux-256color"

# Forward truecolor (24-bit RGB) escapes through tmux. ssh-attach.sh
# propagates the host's COLORTERM=truecolor into the container so pi emits
# RGB sequences; this override tells tmux the outer terminal supports the
# `Tc` capability, so it passes RGB through unmodified instead of quantizing
# to the 256-color palette (the cause of the near-invisible grey / red
# accents). The `*` wildcard matches whatever host TERM was propagated.
set -ag terminal-overrides ",*:Tc"

# Kitty keyboard protocol / extended keys (see pi docs/tmux.md). Forwards
# Shift+Enter, Ctrl+Enter, Alt+Enter distinctly instead of collapsing them
# to plain Enter. Requires tmux 3.5+; the container ships tmux 3.6b.
set -g extended-keys on
set -g extended-keys-format csi-u

# Reasonable defaults for long-running sessions.
set -g mouse on
set -g escape-time 10
set -g history-limit 100000