# prek hook configuration — https://prek.j178.dev/
#
# Run `just setup-git-hooks` once after cloning to install these into git's
# hooks (pre-commit, commit-msg, pre-push). Hooks can also be run on demand
# with `uv run prek run` / `uv run prek run --all-files`.

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"
hooks = [
  # --- pre-commit -----------------------------------------------------------
  # Fast, non-mutating checks that catch a bad commit the instant it is made
  # instead of at push time. ALL are check-only (`*-check` just recipes, no
  # `--fix`), so they can never dirty staged files. The whole-crate lints run
  # over the full repo (always_run + pass_filenames = false); pre-commit stashes
  # unstaged changes first, so a failure is always a real defect introduced by
  # the commit being made, never by unrelated uncommitted work.

  # File-scoped (run on staged files only). Fix with
  # `npx markdownlint-cli2 --fix <file>` if it fails.
  { id = "markdownlint", name = "Markdown lint", language = "system", entry = "npx --yes markdownlint-cli2", types = ["markdown"], stages = ["pre-commit"] },

  # Forbid `# noqa: ...PLC0415`. This lint is suppressed project-wide by a
  # shared ruff config; the suppression must never be re-enabled per-line.
  { id = "forbid-noqa-PLC0415", name = "forbid noqa for PLC0415", language = "pygrep", entry = "noqa:.*PLC0415", types = ["python"], stages = ["pre-commit"] },

  # Whole-crate lints (always_run, pass_filenames = false). Ordered fastest
  # first so formatting drift fails early before the heavier clippy/ty passes.
  { id = "rust-fmt-check",   name = "Rust fmt check",      language = "system", entry = "just fmt-check",                stages = ["pre-commit"], always_run = true, pass_filenames = false },
  { id = "python-fmt-check", name = "Python fmt check",   language = "system", entry = "just fmt-check-python",         stages = ["pre-commit"], always_run = true, pass_filenames = false },
  { id = "rust-no-pyo3",     name = "Rust no-pyo3 cores", language = "system", entry = "just check-no-pyo3-in-cores",   stages = ["pre-commit"], always_run = true, pass_filenames = false },
  { id = "rust-clippy",      name = "Rust clippy",        language = "system", entry = "just lint-rust-check",         stages = ["pre-commit"], always_run = true, pass_filenames = false },
  { id = "python-lint",      name = "Python lint",         language = "system", entry = "just lint-python-check",       stages = ["pre-commit"], always_run = true, pass_filenames = false },

  # --- commit-msg -----------------------------------------------------------
  # Validate the commit message against .commitlintrc.yml. prek appends the
  # commit-message temp file as the trailing argument to `--edit`.
  { id = "commitlint", name = "commitlint", language = "system", entry = "npx --yes @commitlint/cli --edit", stages = ["commit-msg"] },

  # --- pre-push -------------------------------------------------------------
  # Gate the push on the slower build + test suite plus a commit-message
  # re-lint (safety net for `git commit --no-verify`). The faster lints already
  # ran at commit time, so only the expensive work remains here.
  #
  # 1. commitlint-push — re-lint every commit message in the outgoing push
  #    range. prek's pre-push stage consumes git's push-line stdin and does not
  #    forward it to hooks, so the range is computed from the upstream tracking
  #    ref instead (mirrors `just lint-commits`).
  #
  # 2. Build + test suite — mirrors ci.yml's rust-build/rust-test and Python
  #    build/test jobs (always_run = true, pass_filenames = false). python-build
  #    (maturin develop) produces the .so that python-test imports, so it must
  #    precede python-test.
  #
  # Bypass with `git push --no-verify` (CI still runs), or re-run a subset
  # manually with `prek run --hook-stage pre-push --skip rust-test` etc.
  { id = "commitlint-push", name = "commitlint (push range)", language = "system", entry = "scripts/hooks/commitlint-push.sh", stages = ["pre-push"], always_run = true, pass_filenames = false },

  # Rust track (mirrors ci.yml: rust-build, rust-test).
  { id = "rust-build", name = "Rust build", language = "system", entry = "just build-rust-extension", stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "rust-test",  name = "Rust tests", language = "system", entry = "just test-rust",             stages = ["pre-push"], always_run = true, pass_filenames = false },

  # Python track: build (maturin develop) then test.
  { id = "python-build", name = "Python build (maturin)", language = "system", entry = "just dev",         stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "python-test",  name = "Python tests",            language = "system", entry = "just test-python", stages = ["pre-push"], always_run = true, pass_filenames = false },
]