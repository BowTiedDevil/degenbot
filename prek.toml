# prek hook configuration — https://prek.j178.dev/
#
# Run `just setup-git-hooks` once after cloning to install these into git's
# hooks (pre-commit, commit-msg, pre-push). Hooks can also be run on demand
# with `uv run prek run` / `uv run prek run --all-files`.
#
# Local hook runs need `just` and a plain `python3` on PATH: the recipe entries
# delegate through the justfile, and recipe existence is asked of `just` itself
# (scripts/just_recipe_index.py), never read from justfile text.
#
# THE TWO-TIER CONTRACT — what a green hook means:
#   - pre-commit green means "the files THIS COMMIT contains are clean".
#     Every pre-commit check operates on the staged file list prek passes.
#     In a shared workspace two supervisors can be mid-chunk in one tree:
#     prek's stash parks tracked-unstaged changes during hooks, but leaves
#     UNTRACKED files in place — so any pre-commit check that sweeps the tree
#     instead of the staged list both blocks clean commits on another lane's
#     dirt and can go vacuous green over a tree it only partly examined.
#   - pre-push green means "the whole tree's lint and format gates pass and the
#     packages this push touches pass their tests". The tree-wide sweeps live
#     here, where a complete tree is a fair assumption, alongside the code
#     linters moved off the per-commit path and the affected-package Rust test
#     leg; the full test matrix is CI's, where its legs run as parallel jobs.
#   - Hooks that cannot operate on a file list at all live at pre-push with a
#     note saying why; hooks that take a list fail closed on an empty list
#     rather than certify a list they never saw.
#   The one documented exception to staged scoping is comment-hygiene below:
#   it deliberately scans the working tree so it can never be blinded to
#   untracked files (an index-bound enumeration once certified a commit
#   containing exactly the citations that gate exists to catch).
#
# WHY commit-message lint stays at commit time but code lint moves to push
# (the code-vs-message asymmetry):
#   - A broken commit MESSAGE is immutable: found late (at push/CI) it forces a
#     deep rebase on stale commits. So message lint must run at commit time.
#     The relaxed .commitlintrc.yml (free-form scope, 100-col limits) keeps that
#     hook low-friction — the multi-turn agent churn this used to cause is gone
#     because the rules are now lenient.
#   - Broken CODE (clippy/ty failures) is cheap to fix late with a follow-up
#     commit. Whole-repo compiling linters on every matching commit was pure
#     latency, so clippy/python-lint now run at pre-push + CI instead of gating
#     every commit.
#   - pre-push commitlint-push re-checks the pushed range as a safety net for
#     `--no-verify` bypasses; CI (ci.yml) is the authoritative full gate.

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"
hooks = [
  # --- pre-commit -----------------------------------------------------------
  # Fast, non-mutating checks over the STAGED FILES ONLY — the list prek
  # passes (and the list `prek run --files <paths>` emulates). A green result
  # certifies this commit's own content, nothing more. All are check-only
  # (no `--fix`), so they can never dirty staged files. A hook whose types
  # filter matches nothing in the commit simply does not fire — that is a
  # skip, not a pass; the scripts below additionally fail closed if invoked
  # with an empty list.

  # File-scoped (runs on the staged markdown list). The CLI pin is the
  # justfile's `markdownlint_cli` literal — the one the `just lint-markdown*`
  # recipes and CI's markdown job run (tests/test_gate_registry.py fails if they
  # disagree). Fix with `just lint-markdown` if it fails. The vendored
  # executor/ tree keeps its own docs conventions — same
  # scoping principle as the src/-only Python lint gates.
  { id = "markdownlint", name = "Markdown lint", language = "system", entry = "npx --yes markdownlint-cli2@0.24.1", types = ["markdown"], exclude = "^executor/|^logs/|^rust/vendor/", stages = ["pre-commit"] },

  # Comment hygiene (AGENTS.md / docs/comments.md): work-tracker (ergo) IDs
  # and RED/GREEN gate narration are banned in code comments. The waiver
  # list (scripts/hooks/comment-hygiene-waivers.txt) is empty and the census
  # (scripts/hooks/comment-hygiene-census.txt) is lexicon-only, so the gate
  # blocks every tracker citation outright. Its scan covers *.py and *.rs
  # (executor excluded) plus *.sh under src/ tests/ rust/crates scripts/
  # examples/ and run_bot.sh, so the trigger must match python, rust, OR
  # shell: `types` ANDs its tags (no file is both python and rust), which
  # had silently disabled this hook. One git grep plus one rg pass are
  # ~instant, so it rides the per-commit tier.
  #
  # THE documented exception to staged scoping, on purpose: pass_filenames =
  # false and the script scans the WORKING TREE (rg, not git grep) so a
  # brand-new untracked source file is examined the moment it is written.
  # An index-bound enumeration once went green on a commit containing
  # exactly the citations this gate exists to catch — do not "fix" the
  # cross-lane visibility by narrowing it back to the index. Latency budget
  # stays near-instant (one rg pass + one awk pass).
  #
  # live-invariant gate (ADR-087 D2): watches the live comment surface under AGENTS.md "Comment Hygiene"; not tripwire precedent.
  { id = "comment-hygiene", name = "Comment hygiene gate", language = "system", entry = "just lint-comment-hygiene", types_or = ["python", "rust", "shell"], stages = ["pre-commit"], pass_filenames = false },

  # The publish-blocked census (docs/gates.md section 6): every member `cargo
  # publish` cannot upload is reconciled against
  # scripts/publish-blocked-census.txt in both directions, so the population the
  # publish oracle withholds can never move in silence. File-scoped trigger over
  # the manifests the population is derived from; the gate sweeps the workspace
  # itself, so the filename list is only the trigger.
  #
  # live-invariant gate (ADR-087 D2): watches the live workspace manifests and the dependency shapes their published forms retain against their census; not tripwire precedent.
  { id = "publish-blocked", name = "publish-blocked census", language = "system", entry = "just check-publish-blocked", files = '.*Cargo\.toml$|^scripts/publish-blocked-census\.txt$|^scripts/publish_blocked\.py$|^scripts/publication_plan\.py$', stages = ["pre-commit"], pass_filenames = false },

  # The tool catalog (rust/tools/README.md) is reconciled against Cargo
  # metadata and the justfile in both directions: every cataloged public
  # example and lab [[bin]] resolves to exactly one live target (source path +
  # target name), every live target of the cataloged populations has a row,
  # lanes match [[bin]] required-features, and every referenced `just` recipe
  # exists. The trigger covers the README, the justfile, every rust manifest
  # (so a manifest-only example addition triggers without a new source file),
  # rust/tools manifests and sources, the rust/examples example crates
  # (manifests and sources), example sources, the two integration-test
  # sources, and the gate itself -- so target drift cannot bypass the gate
  # merely because no Markdown changed. The gate sweeps the workspace itself, so the filename
  # list is only the trigger.
  #
  # live-invariant gate (ADR-087 D2): watches the live Cargo targets and just recipes against rust/tools/README.md; not tripwire precedent.
  { id = "tool-catalog", name = "Tool catalog reconciliation", language = "system", entry = "just check-tool-catalog", files = '^rust/tools/README\.md$|^justfile$|^rust/.*Cargo\.toml$|^rust/tools/|^rust/examples/|^rust/.*/examples/.*\.rs$|^rust/crates/foundation/degenbot-ingestion/tests/headless_boot\.rs$|^rust/crates/engine/degenbot-bot/tests/config_smoke_boot\.rs$|^scripts/tool_catalog_check\.py$|^tests/test_tool_catalog_check\.py$', stages = ["pre-commit"], pass_filenames = false },

  # The settlement-bot parity ledger's statuses live in exactly one
  # machine-checked place — the boot gate's oracle,
  # tests/standalone_parity/fixtures/settlement_bot_boot.json
  # `expected.ledger_rows` — and the doc repeats them in three prose places.
  # This fires when the commit touches the doc, the oracle, or the gate itself,
  # and compares BOTH whole files (pass_filenames = false): a one-sided status
  # edit is exactly the drift it exists to catch, so this commit's slice is not
  # what the reconciliation needs. Two parses, instant tier.
  #
  # live-invariant gate (ADR-087 D2): watches the live parity-ledger prose against the boot-gate oracle's ledger rows; not tripwire precedent.
  { id = "parity-ledger-single-source", name = "Parity ledger single source", language = "system", entry = "just check-parity-ledger-single-source", files = '^docs/architecture/rust-settlement-bot-parity\.md$|^tests/standalone_parity/fixtures/settlement_bot_boot\.json$|^scripts/hooks/parity_ledger_single_source\.py$', stages = ["pre-commit"], pass_filenames = false },

  # The worker-census spawn sites (docs/gates.md section 3): every
  # `thread::Builder::new`, `Builder::new_multi_thread` or
  # `Builder::new_current_thread` site under rust/crates must sit in a function
  # that registers a `WorkerCensusEntry`, or be admitted by a row under a
  # written reason in scripts/hooks/worker-census-spawn-inventory.txt. Both
  # directions are reconciled (a site with no row, a row with no live site, a
  # row with no reason above it), so an unregistered thread cannot land and a
  # swept row cannot outlive its site. The trigger covers crate sources, the
  # inventory and the gate itself; the gate sweeps the tree, so the filename
  # list is only the trigger. One stdlib parse pass (~0.3 s) over the crate
  # tree, so it rides the per-commit tier.
  #
  # live-invariant gate (ADR-087 D2): watches the live spawn sites of the crate tree against their registrations and the reviewed inventory; not tripwire precedent.
  { id = "worker-census-spawn", name = "Worker-census spawn sites", language = "system", entry = "just check-worker-census-spawn", files = '\.rs$|^scripts/hooks/worker_census_spawn_gate\.py$|^scripts/hooks/worker-census-spawn-inventory\.txt$', stages = ["pre-commit"], pass_filenames = false },

  # Staged-files format gates: the same detectors as the whole-tree sweeps
  # (ruff format / rustfmt), sliced to the commit's own files, so an
  # untracked unformatted file from another lane can neither block this
  # commit nor hide inside it. Whole-tree versions of both sweeps run at
  # pre-push. rust-fmt-staged passes skip_children=true because plain
  # rustfmt recurses into a passed file's child modules, which would let an
  # unstaged sibling module fail a commit that does not contain it.
  { id = "python-fmt-staged", name = "Python fmt (staged)", language = "system", entry = "scripts/hooks/python-fmt-staged.sh", types = ["python"], exclude = "^executor/", stages = ["pre-commit"] },
  { id = "rust-fmt-staged", name = "Rust fmt (staged)", language = "system", entry = "scripts/hooks/rust-fmt-staged.sh", types = ["rust"], stages = ["pre-commit"] },

  # Stub drift at commit time (ADR-066): the committed src/degenbot/_ffi/ stubs
  # are GENERATOR OUTPUT over the binding layer's PyO3 surface, so a seam change
  # can leave them stale until `just gen-stubs` is re-run. This entry fires only
  # when a staged file touches that surface — the binding crate's src and
  # Cargo.toml, or the stub generator itself — then regenerates into a temp tree
  # with `just gen-stubs --check` and FAILS if the committed stubs would change.
  # `--check` never writes (REGEN_STUBS is unset), so it is non-mutating like the
  # other pre-commit checks; it does build the cdylib with the temporary
  # experimental-inspect feature, which is why the trigger is scoped to the rare
  # FFI-surface change rather than run on every commit.
  #
  # live-invariant gate (ADR-087 D2): watches the committed stub tree against the live `just gen-stubs` output; not tripwire precedent.
  { id = "stub-drift-staged", name = "Stub drift (staged FFI)", language = "system", entry = "just gen-stubs --check", files = '^rust/crates/shells/degenbot-python/(src/|Cargo\.toml)|^rust/tools/stubgen/(src/|Cargo\.toml)', stages = ["pre-commit"], pass_filenames = false },


  # The gate registry (ADR-102, docs/gates.md): every hook's facts -- id, stage,
  # entry, trigger, flags -- live in scripts/gates.toml, and the hook lines in
  # this file are rendered from it. The check regenerates and diffs, so a
  # hand-edited hook line (or a registry edit with no `just gates-regen`) fails
  # here instead of surfacing as a gate that quietly stopped running.
  #
  # Retiring a gate is deleting its `[[gate]]` block and running `just
  # gates-regen`: the line goes with the prose it owned. The stage separators and
  # their intros above stay, because they anchor the stage rather than the first
  # hook under it.
  #
  # live-invariant gate (ADR-087 D2): watches the live registry against the hook lines prek loads; not tripwire precedent.
  { id = "gate-registry", name = "Gate registry drift", language = "system", entry = "just gates-check", files = '^prek\.toml$|^scripts/gates\.toml$|^scripts/gate_registry\.py$|^scripts/just_recipe_index\.py$|^\.github/workflows/ci\.yml$|^docs/gates\.md$|^tests/', stages = ["pre-commit"], pass_filenames = false },

  # --- commit-msg -----------------------------------------------------------
  # The @commitlint/cli version is pinned to `just lint-commits`'s rule set, the
  # recipe CI's commitlint job runs (tests/test_commitlint_push_gate.py fails if
  # the pins disagree).
  #
  # Validate the commit message against the relaxed .commitlintrc.yml. Runs at
  # commit time so a bad message is caught the moment it is written — NOT at
  # push, when amending days-old commits would need a deep rebase. The relaxed
  # rules (free-form scope, 100-col limits, type + non-empty subject) make this
  # low-friction for humans and agents alike. prek appends the commit-message
  # temp file as the trailing `--edit` argument.
  { id = "commitlint", name = "commitlint", language = "system", entry = "npx --yes @commitlint/cli@21.2.4 --edit", stages = ["commit-msg"] },

  # --- pre-push -------------------------------------------------------------
  # Whole-tree tier: everything here assumes a COMPLETE tree. Gate the push on
  # the whole-tree format sweeps (moved off pre-commit, where tree sweeps saw
  # other lanes' untracked mid-flight files), the code linters moved off the
  # per-commit path, the Rust tests of the packages the diff touches (the
  # architecture gates run in that suite), and a commit-message range re-lint
  # (safety net for `git commit --no-verify`).
  #
  # 1. commitlint-push — re-lint every commit message in the outgoing push
  #    range (safety net). prek's pre-push stage consumes git's push-line stdin
  #    and does not forward it to hooks, so the range is computed from the
  #    upstream tracking ref instead (mirrors `just lint-commits`).
  #
  # 2. Whole-tree format sweeps — `just fmt-check` (cargo fmt --all) and
  #    `just fmt-check-python` (the tracked python tree, executor/ excluded —
  #    the population the staged python-fmt-staged hook slices). Moved here from
  #    pre-commit: a tree sweep at commit time examined untracked files other
  #    lanes left mid-flight (prek's stash parks tracked-unstaged changes but
  #    leaves untracked files alone) and blocked clean commits. The commit's
  #    own files are covered at pre-commit by the staged-slice gates above;
  #    these catch everything else before it reaches CI.
  #
  # 3. Code linters (whole crate): rust-clippy + python-lint (incl. ty). These
  #    run unconditionally over the whole tree, so a config/Cargo change can't
  #    slip a regression.
  #
  # 4. Compiled architecture gates — cargo tests on the umbrella crate run in
  #    the affected-package test leg below (and in CI's workspace run), not as
  #    duplicate per-filter push hooks. Focused `check-*` aliases remain
  #    available while diagnosing a failure.
  #
  # 5. Rust tests of the affected packages — `just test-rust-affected` runs the
  #    nextest suite for the packages the outgoing diff touches plus the
  #    packages that depend on them, and passes trivially when the diff touches
  #    no package. It is the only test leg a push carries: the whole matrix
  #    (workspace tests, golden replay, the extension build and the Python
  #    suite) is CI's, where its legs run as parallel jobs.
  #
  # 6. Fail-fast: every hook carries `fail_fast = true`, so a failing gate
  #    aborts the push and the remaining gates are skipped. Without it, prek
  #    runs the whole stage to completion and reports every failure.
  #
  # These `entry` strings ARE the push-gate manifest (ADR-074): `just pre-push`
  # runs `prek run --stage pre-push` and keeps no gate list of its own, so this
  # stage is the manifest a gate joins. The declaration itself lives in
  # scripts/gates.toml (ADR-102): the lines below are rendered from it, so a
  # gate is added, retired or re-pointed there and `just gates-regen` writes the
  # result here. Each declared gate also names its one CI coverage form there
  # (direct, contains, equivalent with a probe, or a committed-tree ci_probe),
  # which `just gates-check` validates against the workflow and the just
  # invocation graph.
  #
  # Bypass with `git push --no-verify` (CI still runs), or re-run a subset
  # manually with `prek run --stage pre-push --skip rust-test-affected` etc.
  # (add `--fail-fast` there to mirror the installed push behavior).

  # Toolchain tier first: every gate below certifies the push contract only on
  # a toolchain that meets the workspace floor (scripts/toolchain_tier.sh).
  { id = "toolchain-tier", name = "Rust toolchain tier", language = "system", entry = "just check-toolchain", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },


  # ci-parity checks the ci.yml job matrix against the local entrypoints
  # (scripts/hooks/ci-parity-manifest.txt), which carries the hook-less jobs and
  # the jobs whose local reproduction spans several recipes. This hook's own CI
  # coverage is a field of its registry entry (ci_job + ci_entry + ci_relation),
  # validated against ci.yml by `just gates-check` (ADR-102), so the two
  # cannot disagree in silence.
  { id = "ci-parity", name = "CI job parity", language = "system", entry = "scripts/hooks/ci-parity.sh", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },

  { id = "commitlint-push", name = "commitlint (push range)", language = "system", entry = "scripts/hooks/commitlint-push.sh", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },

  # Whole-tree format sweeps, moved here from pre-commit (see note 2 above).
  { id = "rust-fmt-check", name = "Rust fmt check", language = "system", entry = "just fmt-check", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },
  { id = "python-fmt-check", name = "Python fmt check", language = "system", entry = "just fmt-check-python", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },

  { id = "rust-clippy", name = "Rust clippy", language = "system", entry = "just lint-rust-check", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },
  { id = "python-lint", name = "Python lint", language = "system", entry = "just lint-python-check", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },
  # ADR-053: stubtest owns the stub<->runtime existence checks (R1/R2/R3/R4)
  # for the degenbot._ffi seam; the slimmed bespoke gate (R0 + driver-module
  # tombstones) runs in the pytest suites below.
  { id = "stubtest", name = "Stubtest drift gate", language = "system", entry = "just lint-stubtest", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },
  # ADR-087 D4 — the tripwire ratchet. A source scan of the test/gate surface
  # (rust test files, tests/, justfile, prek.toml, scripts/, docs/) for the
  # signatures of a RETIREMENT TRIPWIRE: an assertion that a deleted name is still
  # absent (`assert not hasattr`, a grep for a retired identifier), a collection
  # named for the revival asserted empty, or a prose "do not revive / re-land /
  # rebuild" ban. Deleting code is the complete retirement (D1), so such an artifact
  # does not exist here; the scan flags one and the pre-push gate fails.
  #
  # It flags and does not classify (D4): the author deletes the artifact or labels
  # it with the D2 marker, which forces the statement of what PRESENT code the gate
  # watches. The exemption is exactly that marker — there is no waiver file to grow.
  #
  # A whole-tree scan with no per-file slice, so it lives at pre-push with the other
  # whole-tree gates. Its own label, naming what it watches:
  #
  # live-invariant gate (ADR-087 D2): watches the present test/gate surface for the tripwire signatures ADR-087 D1 bans; not tripwire precedent.
  { id = "tripwire-ratchet", name = "Retirement-tripwire ratchet", language = "system", entry = "just lint-tripwire-ratchet", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },

  # ADR-101 D5 — accepted cmd_executor release packages are append-only.
  # live-invariant gate (ADR-087 D2): watches accepted cmd_executor release packages and their sequential release index; not tripwire precedent.
  { id = "executor-release-ratchet", name = "Executor release ratchet", language = "system", entry = "just check-executor-release-ratchet", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },

  # Test track: the packages the outgoing diff touches, and nothing else. The
  # whole matrix (--workspace tests, golden replay, maturin, pytest, the two
  # no-Python gates) is CI's, where its legs run as parallel jobs; the serial
  # local copy cost a session its last fifteen minutes and proved nothing a push
  # would not.
  { id = "rust-test-affected", name = "Rust tests (affected packages)", language = "system", entry = "just test-rust-affected", stages = ["pre-push"], always_run = true, pass_filenames = false, fail_fast = true },
]
