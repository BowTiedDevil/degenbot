# prek hook configuration — https://prek.j178.dev/
#
# Run `just setup-git-hooks` once after cloning to install these into git's
# hooks (pre-commit, commit-msg, pre-push). Hooks can also be run on demand
# with `uv run prek run` / `uv run prek run --all-files`.

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"
hooks = [
  # --- pre-commit -----------------------------------------------------------
  # Lint staged Markdown files (excludes deletions, like the old .githooks
  # script). Fix with `npx markdownlint-cli2 --fix <file>` if it fails.
  { id = "markdownlint", name = "Markdown lint", language = "system", entry = "npx --yes markdownlint-cli2", types = ["markdown"], stages = ["pre-commit"] },

  # Forbid `# noqa: ...PLC0415`. This lint is suppressed project-wide by a
  # shared ruff config; the suppression must never be re-enabled per-line.
  { id = "forbid-noqa-PLC0415", name = "forbid noqa for PLC0415", language = "pygrep", entry = "noqa:.*PLC0415", types = ["python"], stages = ["pre-commit"] },

  # --- commit-msg -----------------------------------------------------------
  # Validate the commit message against .commitlintrc.yml. prek appends the
  # commit-message temp file as the trailing argument to `--edit`.
  { id = "commitlint", name = "commitlint", language = "system", entry = "npx --yes @commitlint/cli --edit", stages = ["commit-msg"] },

  # --- pre-push -------------------------------------------------------------
  # Two concerns run at push time so a failure is caught strictly earlier than
  # GitHub Actions:
  #
  # 1. commit-message lint (commitlint-push) — safety net for `git commit
  #    --no-verify`. prek's pre-push stage consumes git's push-line stdin and
  #    does not forward it to hooks, so the range is computed from the upstream
  #    tracking ref instead (mirrors `just lint-commits`).
  #
  # 2. CI mirror — every lint/build/test the `ci.yml` workflow runs, in the
  #    same job order, on the full repo (pass_filenames = false,
  #    always_run = true). The lint hooks use the check-only `*-check` just
  #    recipes (no `--fix`), so they cannot dirty already-committed files and
  #    are stricter than CI: anything CI would have auto-fixed fails here.
  #
  # Bypass the lot with `git push --no-verify` (CI still runs), or re-run a
  # subset manually with `prek run --hook-stage pre-push --skip rust-test` etc.
  { id = "commitlint-push", name = "commitlint (push range)", language = "system", entry = "scripts/hooks/commitlint-push.sh", stages = ["pre-push"], always_run = true, pass_filenames = false },

  # Rust track (mirrors ci.yml: rust-check → rust-test → rust-build).
  { id = "rust-fmt-check", name = "Rust fmt check",        language = "system", entry = "just fmt-check",                stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "rust-clippy",     name = "Rust clippy",           language = "system", entry = "just lint-rust-check",         stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "rust-no-pyo3",    name = "Rust no-pyo3 cores",    language = "system", entry = "just check-no-pyo3-in-cores", stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "rust-build",      name = "Rust build",            language = "system", entry = "just build-rust-extension",     stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "rust-test",       name = "Rust tests",            language = "system", entry = "just test-rust",               stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "markdownlint-all", name = "Markdown lint (all)", language = "system", entry = "just lint-markdown",           stages = ["pre-push"], always_run = true, pass_filenames = false },

  # Python track (mirrors ci.yml: python-lint → python-test). `just dev` builds
  # the extension first, exactly as the python-lint job does.
  { id = "python-build",     name = "Python build (maturin)", language = "system", entry = "just dev",                stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "python-fmt-check", name = "Python fmt check",      language = "system", entry = "just fmt-check-python",   stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "python-lint",       name = "Python lint",            language = "system", entry = "just lint-python-check",  stages = ["pre-push"], always_run = true, pass_filenames = false },
  { id = "python-test",        name = "Python tests",           language = "system", entry = "just test-python",        stages = ["pre-push"], always_run = true, pass_filenames = false },
]