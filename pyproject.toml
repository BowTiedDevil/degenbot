[build-system]
requires = ["maturin >= 1.0,<2.0"]
build-backend = "maturin"

[project]
name = "degenbot"
# Version is supplied by maturin at build time from the `_ffi` binding
# crate's [package].version, which is inherited from [workspace.package] in
# rust/Cargo.toml (ADR-009 single-source-of-truth versioning). The single
# literal lives on the Rust side; maturin bridges it into the wheel and
# normalizes the semver form to PEP 440 (e.g. 0.6.0-alpha.3 -> 0.6.0a3).
dynamic = ["version"]
authors = [
    { name="BowTiedDevil", email="devil@bowtieddevil.com" },
]
description = "Python + Rust building blocks for Uniswap (V2, V3, V4), Curve V1, Solidly V2, Balancer V2 & Aave V3 arbitrage and liquidation bots on EVM-compatible blockchains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic ~= 2.13",
    "pydantic-settings ~= 2.15",
    "tenacity ~= 9.1",
    "tomlkit ~= 0.15",
]
license = {text = "MIT"}
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://www.degencode.com"
Repository = "https://github.com/BowTiedDevil/degenbot"
Tracker = "https://github.com/BowTiedDevil/degenbot/issues"
Twitter = "https://twitter.com/BowTiedDevil"

[project.scripts]
degenbot = "degenbot._cli:main"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "ERA",      # eradicate
    "ANN",      # flake8-annotations
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit
    "BLE",      # flake8-blind-except
    "FBT",      # flake8-boolean-trap
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "COM",      # flake8-commas
    "C4",       # flake8-comprehensions
    "EM",       # flake8-errmsg
    "FIX",      # flake8-fixme
    "FA",       # flake8-future-annotations
    "ICN",      # flake8-import-conventions
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "INP",      # flake8-no-pep420
    "PIE",      # flake8-pie
    "T20",      # flake8-print
    "PYI",      # flake8-pyi
    "PT",       # flake8-pytest-style
    "Q",        # flake8-quotes
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SLF",      # flake8-self
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "TC",       # flake8-type-checking
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "FLY",      # flynt
    "I",        # isort
    "N",        # pep8-naming
    "PERF",     # perflint
    "E", "W",   # pycodestyle
    "DOC",      # pydoclint
    "D",        # pydocstyle
    "F",        # pyflakes
    "PL",       # pylint
    "UP",       # pyupgrade
    "FURB",     # refurb
    "RUF",      # ruff-specific rules
    "TRY",      # tryceratops
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "error-suffix-on-exception-name",
    "non-empty-init-module",  # populated __init__.py facade modules are deliberate
    "assert",  # asserts are used often, but not as input validation
]
logger-objects = [
    "logging.logger",
    "degenbot.logger",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/pathfinding/fixtures/generate_mainnet_snapshot.py" = [
    # The snapshot generator copies rows verbatim out of the live operator DB
    # with raw sql (ATTACH + INSERT SELECT): ORM re-inserts would
    # re-derive values and lose fidelity, and the selection queries
    # deliberately mirror the shapes of `degenbot_db::pathfinding`'s SQL so a
    # schema drift surfaces here first. All identifiers are internal ints /
    # fixed table names — no user input reaches a query.
    "hardcoded-sql-expression",
    "print",     # the generator prints its summary to stdout by design
    "shebang-not-executable",  # invoked as `uv run python ...`, not directly
]
"tests/*" = [
    "ANN",      # type annotations for tests are low priority
    "ARG",
    "D",
    "DOC",
    "import-private-name",  # tests may need to import private modules
    "PLR",
    "suspicious-non-cryptographic-random-usage",
    "private-member-access",   # tests may need to access private attributes to test implementation
    "print",     # print
    "module-import-not-at-top-of-file",
]
"src/degenbot/operator/operator_channel.py" = [
    "import-outside-top-level",  # the fleet mirror home is lazy: the transport module stays independent of the compiled extension and the home mints on the first fleet-posture op
]
"src/degenbot/build_info/__init__.py" = [
    "import-outside-top-level",  # the _ffi import is lazy so the receipt helpers work (and the module imports) even where the extension is stale/broken
    "print",     # python -m degenbot.build_info prints its summary to stdout/stderr by design
]
"src/degenbot/logging.py" = [
    "no-self-use",  # `logging.Formatter.format(self, record)` is the protocol-signature override; the body legitimately ignores `self`
]
"src/degenbot/runner/**" = [
    # The surviving accommodations, each still live. The retired ones
    # (docstring style + sections, typing-only imports, unused-argument, and
    # the never-hit rules) were cleaned in code rather than exempted.
    "any-type",   # driver callables take `Any` (injected builders/consumers, hop dicts)
    "blind-except",   # registration sim-loops catch broad Exception to log + continue per-path
    "import-outside-top-level",  # lazy imports where needed
    "magic-value-comparison",  # driver constants (revert layout, block/fee thresholds) read cleaner inline
    "global-statement",  # module-top tunables / bytecode cache reassignment (intentional)
    "too-many-statements-in-try-clause",  # guarded verify try-blocks contain many statements by design
]
# Generated stubs (ADR-066): the `_ffi/*.pyi` tree is machine-emitted from the
# cdylib's PyO3 introspection chunks, then post-processed by the gen-stubs
# pipeline (ruff format + ruff check --fix). Only rules the pipeline cannot
# mechanically fix are exempted here. The key is a bare basename glob, not the
# committed path, because the pipeline's ruff pass runs on the temp output dir
# outside the repo — a path-anchored pattern would not match there and the
# drift gate's byte-for-byte contract would break. There are no other .pyi
# trees in the repository.
"*.pyi" = [
    "D",        # prose rules: docstrings are Rust doc-comment prose (IDE hover is the consumer — ADR-053), not Python docstring style
    "DOC",      # Returns:/Raises: sections: the prose is inherited verbatim from Rust
    "line-too-long",     # prose lines; ruff format wraps code, never docstring text
    "any-type",   # the seam surface is Any exactly where Rust is dynamic
    "ambiguous-unicode-character-docstring",   # Rust prose characters
    "docstring-in-stub",   # the docstrings are Rust doc-comment prose for IDE hover, not Python docstrings
    "non-self-return-type",   # __new__ mirrors the Rust constructor's declared return
    "builtin-variable-shadowing", # stub names mirror the Rust types verbatim (stubtest compares names), so a Rust `Exception` type stays `Exception`
]
"examples/*" = [
    # Demo scripts over the private ``degenbot._ffi`` seam, folded into the
    # lint gate with only these deliberate relaxations (each verified live):
    "any-type",   # the FFI seam hands back `Any` (e.g. solve results)
    "import-outside-top-level",  # lazy imports resolve under script-mode sys.path
    "import-private-name",  # the demos intentionally import the private `degenbot._ffi` seam
    "too-many-statements-in-try-clause",  # the demo main's one guarded body is broad by design
]

[tool.pytest.ini_options]
addopts = [
    "--numprocesses", "auto",
    "--dist", "loadgroup",
    "--import-mode", "importlib",
    "-m", "not slow and not base and not online_rpc",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-timeout: a hung test FAILS with a timeout report instead of parking
# its xdist worker with no failure signal. Thread method — signal is unsafe
# under asyncio/xdist. 300s gives ~200x headroom over the slowest default-run
# test (~1.6s measured); slow-marked on-demand suites get their own headroom
# via the collection hook in tests/conftest.py.
timeout = 300
timeout_method = "thread"
pythonpath = ["src", "."]
python_files = "test_*.py"
testpaths = ["tests", "README.md"]
norecursedirs = ["archive", ".hypothesis"]
filterwarnings = [
    "error", # Fail on all warnings by default
]
markers = [
    "base: tests requiring a live Base mainnet RPC or fork — excluded from default runs; run on-demand with `-m base` (offline golden-replay parity tests are marked onchain_oracle instead)",
    "ethereum: tests requiring an Ethereum mainnet RPC",
    "slow: tests that are too slow for routine local runs (e.g. pathfinding)",
    "onchain_oracle: on-chain parity test whose oracle truth is read from a golden file (tests/golden); offline in CI — see docs/architecture/golden-onchain-parity.md",
    "online_rpc: test requiring a live external RPC (mainnet/arbitrum/base archive node) — skipped in CI by default; run on-demand with `-m online_rpc`. See docs/architecture/golden-onchain-parity.md.",
]

[dependency-groups]
dev = [
    "hypothesis",
    "maturin",
    "mypy",
    "numpy",
    "prek",
    "pytest-asyncio",
    "pytest-order",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "pytest",
    "python-dotenv",
    "ruff",
    "sybil",
    "ty",
    "vulture",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["examples"]

[tool.vulture]
# Dead-code detector. Output is a triage list, not a gate: each hit
# needs a human call (rg for refs) before deletion — vulture is static
# and can't see FFI-seam callers (Rust core) or framework dispatch
# (pydantic validators, protocol params). 80% confidence is the operating point
# — the 60% tier is
# mostly framework-dispatched methods (validators, properties on
# models, enum members referenced dynamically).
min_confidence = 80
paths = ["src/degenbot"]

[tool.uv]
exclude-newer = "14 days"
link-mode = "copy"
cache-keys = [
    # Keep this boundary aligned with build_scan::scan_workspace: every Rust
    # source/build input that can affect the cdylib must invalidate the wheel
    # cache, while unrelated Python and generated files need not.
    {file = "rust/**/Cargo.toml"},
    {file = "rust/Cargo.lock"},
    {file = "rust/crates/**/src/**/*.rs"},
    {file = "rust/crates/**/build.rs"},
    {file = "rust/crates/shells/degenbot-python/build_scan.rs"},
    {file = ".cargo/config.toml"},
]

[tool.maturin]
manifest-path = "rust/crates/shells/degenbot-python/Cargo.toml"
python-source = "src"
module-name = "degenbot._ffi"
bindings = "pyo3"
# Dev/agent loop builds select the workspace [profile.dev] (opt-level 1, no
# LTO or stripping, line-tables-only debug info). This intentionally favors
# representative optimization over an unoptimized debug build while
# keeping uv-sync cdylib rebuilds substantially cheaper than release. This
# setting is consumed by local editable-install builds (`just dev`); the
# published wheel is built by the PyO3/maturin-action in
# .github/workflows/release.yml, which passes `--release` and its explicit
# feature selection — so the shipped artifact uses the
# workspace release profile (thin LTO, stripping, and its intentional
# per-package codegen-unit policy) and is unaffected by this setting.
profile = "dev"
# The default package build intentionally selects no Cargo features. This
# keeps `pip install .`, `uv build`, and ordinary maturin builds on the
# binding crate's declared defaults (the release-equivalent domain surface).
# The local development-wheel feature set lives in the binding manifest's
# `dev-features` alias and is selected explicitly by `just dev`; release
# wheels use `--release --features pyo3/extension-module` and likewise exclude
# all development-only profiling, telemetry, allocator, and mimalloc features.
python-packages = ["degenbot"]