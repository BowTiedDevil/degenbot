[build-system]
requires = ["maturin >= 1.0,<2.0"]
build-backend = "maturin"

[project]
name = "degenbot"
# Version is supplied by maturin at build time from the `_ffi` binding
# crate's [package].version, which is inherited from [workspace.package] in
# rust/Cargo.toml (ADR-009 single-source-of-truth versioning). The single
# literal lives on the Rust side; maturin bridges it into the wheel and
# normalizes the semver form to PEP 440 (e.g. 0.6.0-alpha.3 -> 0.6.0a3).
dynamic = ["version"]
authors = [
    { name="BowTiedDevil", email="devil@bowtieddevil.com" },
]
description = "Python + Rust building blocks for Uniswap (V2, V3, V4), Curve V1, Solidly V2, Balancer V2 & Aave V3 arbitrage and liquidation bots on EVM-compatible blockchains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic ~= 2.13",
    "pydantic-settings ~= 2.15",
    "sqlalchemy ~= 2.0",
    "tenacity ~= 9.1",
    "tomlkit ~= 0.15",
]
license = {text = "MIT"}
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://www.degencode.com"
Repository = "https://github.com/BowTiedDevil/degenbot"
Tracker = "https://github.com/BowTiedDevil/degenbot/issues"
Twitter = "https://twitter.com/BowTiedDevil"

[project.scripts]
degenbot = "degenbot._cli:main"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "ERA",      # eradicate
    "ANN",      # flake8-annotations
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit
    "BLE",      # flake8-blind-except
    "FBT",      # flake8-boolean-trap
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "COM",      # flake8-commas
    "C4",       # flake8-comprehensions
    "EM",       # flake8-errmsg
    "FIX",      # flake8-fixme
    "FA",       # flake8-future-annotations
    "ICN",      # flake8-import-conventions
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "INP",      # flake8-no-pep420
    "PIE",      # flake8-pie
    "T20",      # flake8-print
    "PYI",      # flake8-pyi
    "PT",       # flake8-pytest-style
    "Q",        # flake8-quotes
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SLF",      # flake8-self
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "TCH",      # flake8-type-checking
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "FLY",      # flynt
    "I",        # isort
    "NPY",      # numpy-specific
    "N",        # pep8-naming
    "PERF",     # perflint
    "E", "W",   # pycodestyle
    "DOC",      # pydoclint
    "D",        # pydocstyle
    "F",        # pyflakes
    "PL",       # pylint
    "UP",       # pyupgrade
    "FURB",     # refurb
    "RUF",      # ruff-specific rules
    "TRY",      # tryceratops
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "error-suffix-on-exception-name",
    "docstring-in-stub", # required for IDE to show wrapped Rust code info
    "non-empty-init-module", # asserts are used often, but not as input validation
    "assert",
]
logger-objects = [
    "logging.logger",
    "degenbot.logger",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"scripts/aave_replay_diff.py" = [
    "any-type",   # the drive/compare JSON-report dicts are dict[str, Any]
    "unused-function-argument",   # CLI dispatchers take unused `args` for argparse's set_defaults
    "D",        # docstring strictness (Returns:/Raises:/imperative) not enforced on the CLI
    "DOC",      # pydoclint Returns:/Raises: sections not enforced on the CLI
    "f-string-in-exception",    # short f-string error messages are fine in a script
    "import-outside-top-level",  # lazy imports avoid circular dependency with degenbot.provider
    "too-many-statements-in-try-clause",  # the drive fn's broad try/except is intentional (log+re-raise)
    "too-many-nested-blocks",  # the bisect loop nests deeply by design
    "PTH",      # os.path + os.makedirs are fine for the bisect's file-copy logic
    "unspecified-encoding",  # the JSON-dump file writes use utf-8 implicitly
    "unnecessary-assign",   # unnecessary-assign for clarity in the drive fn
    "hardcoded-password-string",     # "DEGENBOT_RPC_HTTP_CHAINID_1" is an envvar NAME, not a password
    "try-except-pass",     # the optional event-fetcher import's try/except/pass is intentional
    "hardcoded-sql-expression",     # the table-name is from a hardcoded _TABLE_ORDER list, not user input
    "SIM",      # the compare dict-comprehensions are clarity over comprehension
    "private-member-access",   # sqlalchemy's `row._mapping` is the documented dict-access API
    "raise-vanilla-args",   # raise-vanilla-args on the SystemExit messages
    "raise-within-try",   # re-raising the worker-thread error from within the try is intentional
    "print",     # the CLI prints its summary to stdout by design
]
"tests/pathfinding/fixtures/generate_mainnet_snapshot.py" = [
    # The snapshot generator copies rows verbatim out of the live operator DB
    # with raw sql (ATTACH + INSERT SELECT): SQLAlchemy ORM re-inserts would
    # re-derive values and lose fidelity, and the selection queries
    # deliberately mirror the shapes of `degenbot_db::pathfinding`'s SQL so a
    # schema drift surfaces here first. All identifiers are internal ints /
    # fixed table names — no user input reaches a query.
    "hardcoded-sql-expression",
    "print",     # the generator prints its summary to stdout by design
    "unspecified-encoding",  # fixture file writes use utf-8 implicitly
    "shebang-not-executable",  # invoked as `uv run python ...`, not directly
]
"tests/*" = [
    "ANN",      # type annotations for tests are low priority
    "ARG",
    "D",
    "DOC",
    "import-private-name",  # tests may need to import private modules
    "PLR",
    "suspicious-pickle-usage",
    "suspicious-non-cryptographic-random-usage",
    "suspicious-pickle-import",
    "private-member-access",   # tests may need to access private attributes to test implementation
    "print",     # print
    "E402",      # tests/conftest.py pins DEGENBOT_CONFIG above the degenbot import (the FFI init installs the ambient holder config at import)
]
"src/degenbot/provider/factory.py" = [
    "import-outside-top-level",  # lazy import avoids circular dependency with degenbot.provider.__init__
]
"src/degenbot/registry/deployment_loader.py" = [
    "import-outside-top-level",  # lazy imports avoid circular dependency (pool classes → uniswap → this module)
]
"src/degenbot/operator/operator_channel.py" = [
    "import-outside-top-level",  # the fleet mirror home is lazy: the transport module stays independent of the compiled extension and the home mints on the first fleet-posture op
]
"src/degenbot/build_info/__init__.py" = [
    "import-outside-top-level",  # the _ffi import is lazy so the receipt helpers work (and the module imports) even where the extension is stale/broken
    "print",     # python -m degenbot.build_info prints its summary to stdout/stderr by design
]
"src/degenbot/uniswap/deployments.py" = [
    "import-outside-top-level",  # lazy import avoids circular dependency (deployment_loader → pool classes → this module)
]
"src/degenbot/logging.py" = [
    "PLR6301",  # `logging.Formatter.format(self, record)` is the protocol-signature override; the body legitimately ignores `self`
]
"src/degenbot/runner/**" = [
    # These rules were carried forward from the ``examples/*`` accommodation the
    # backrun driver was developed under (epic 5TSYKN relocates it un-rewritten).
    # The driver is moved with no behavior change, so it inherits the same style
    # exceptions; each can be re-enabled + cleaned incrementally.
    "any-type",   # driver callables take `Any` (injected builders/consumers, hop dicts)
    "ARG",      # signatures keep meaningful-but-unused slots (e.g. v4_snapshot symmetry)
    "function-uses-loop-variable",     # registration _consume's lambdas capture the loop-bound `step`
    "blind-except",   # registration sim-loops catch broad Exception to log + continue per-path
    "D",        # docstring strictness (imperative / blank-line-after-summary)
    "DOC",      # pydoclint Return:/Raises: sections
    "boolean-type-hint-positional-argument",   # boolean flag args (dry_run / live toggles)
    "import-outside-top-level",  # lazy imports where needed
    "import-private-name",  # imports the private ``degenbot._ffi`` seam (mark_progress)
    "too-many-positional-arguments",  # public dispatch/consume signatures carry many positional args
    "magic-value-comparison",  # driver constants (revert layout, block/fee thresholds) read cleaner inline
    "global-statement",  # module-top tunables / bytecode cache reassignment (intentional)
    "too-many-statements-in-try-clause",  # guarded verify try-blocks contain many statements by design
    "TC",       # typing-only imports stay plain (cleaned by TC003 where trivial)
]
"examples/*" = [
    "any-type",   # the FFI/live-bot callables take `Any` (e.g. injected builders/consumers)
    "ARG",      # example function signatures keep meaningful-but-unused slots (logging, fakes)
    "blind-except",   # example sim loops catch broad Exception to log + continue per-path
    "D",        # docstring strictness (D100/D103/D104/D105/D107/D205/D413) not enforced on demo scripts
    "DOC",      # pydoclint Return:/Raises: sections not enforced on demo scripts
    "boolean-type-hint-positional-argument",   # boolean flag args (dry_run / live toggles) are fine in a CLI example
    "import-outside-top-level",  # lazy imports avoid circular deps + resolve under script-mode sys.path
    "import-private-name",  # the example intentionally imports the private `degenbot._ffi` seam
    "too-many-positional-arguments",  # internal example functions carry many positional args (dispatcher plumbing)
    "magic-value-comparison",  # example constants (revert layout, block/fee thresholds) read cleaner inline
    "global-statement",  # module-top tunables are reassigned from CLI args (intentional)
    "too-many-statements-in-try-clause",  # the guarded sim-verify try-blocks contain many statements by design
]

[tool.pytest.ini_options]
addopts = [
    "--numprocesses", "auto",
    "--dist", "loadgroup",
    "--import-mode", "importlib",
    "-m", "not slow and not base and not online_rpc",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", ".", "examples"]
python_files = "test_*.py"
testpaths = ["tests", "README.md"]
norecursedirs = ["archive", ".hypothesis"]
filterwarnings = [
    "error", # Fail on all warnings by default
]
markers = [
    "base: tests requiring a live Base mainnet RPC or fork — excluded from default runs; run on-demand with `-m base` (offline golden-replay parity tests are marked onchain_oracle instead)",
    "ethereum: tests requiring an Ethereum mainnet RPC",
    "slow: tests that are too slow for routine local runs (e.g. pathfinding)",
    "onchain_oracle: on-chain parity test whose oracle truth is read from a golden file (tests/golden); offline in CI — see docs/architecture/golden-onchain-parity.md",
    "online_rpc: test requiring a live external RPC (mainnet/arbitrum/base archive node) — skipped in CI by default; run on-demand with `-m online_rpc`. See docs/architecture/golden-onchain-parity.md.",
]

[dependency-groups]
dev = [
    "hypothesis",
    "maturin",
    # stubtest's vehicle ONLY (ADR-053): mypy runs as the stub<->runtime
    # consistency checker; the repo's type checker remains `ty`.
    "mypy",
    "numpy",
    "prek",
    "pytest-asyncio",
    "pytest-order",
    "pytest-randomly",
    "pytest-xdist",
    "pytest",
    "python-dotenv",
    "ruff",
    "sybil",
    "ty",
    "vulture",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["examples"]

[tool.vulture]
# Dead-code detector. Output is a triage list, not a gate: each hit
# needs a human call (rg for refs) before deletion — vulture is static
# and can't see FFI-seam callers (Rust core) or framework dispatch
# (pydantic validators, SQLAlchemy TypeDecorator signatures, protocol
# params). 80% confidence is the operating point — the 60% tier is
# mostly framework-dispatched methods (validators, properties on
# models, enum members referenced dynamically).
min_confidence = 80
paths = ["src/degenbot"]

[tool.uv]
exclude-newer = "14 days"
link-mode = "copy"
cache-keys = [
    # Keep this boundary aligned with build_scan::scan_workspace: every Rust
    # source/build input that can affect the cdylib must invalidate the wheel
    # cache, while unrelated Python and generated files need not.
    {file = "rust/**/Cargo.toml"},
    {file = "rust/Cargo.lock"},
    {file = "rust/crates/**/src/**/*.rs"},
    {file = "rust/crates/**/build.rs"},
    {file = "rust/crates/degenbot-python/build_scan.rs"},
    {file = ".cargo/config.toml"},
]

[tool.maturin]
manifest-path = "rust/crates/degenbot-python/Cargo.toml"
python-source = "src"
module-name = "degenbot._ffi"
bindings = "pyo3"
# Dev/agent loop builds in the `dev` profile (opt-level 0, no LTO) so the
# uv-sync cdylib rebuild that fires on every Rust edit (via [tool.uv]
# cache-keys) is ~5x faster: 149s (release) → ~30s (dev). This setting is
# consumed ONLY by the local editable-install build path (`uv sync` /
# `maturin develop`); the published wheel is built by the PyO3/maturin-action
# in .github/workflows/release.yml, which passes `--release`
# explicitly and replaces this development feature list — so the shipped
# artifact is unaffected by this setting and stays fully optimized. (The
# detailed lever analysis lived in rust/PERF_RESULTS.md, dropped in
# `f082db7a7`)
profile = "dev"
# Development wheels compile hotpath in (toggle at runtime via
# DEGENBOT_HOTPATH=1 — see rust/crates/degenbot-bot/src/profiling.rs), plus its
# Prometheus exporter (guard-enabled runs serve profiler /metrics on :6772, see
# docs/grafana/ALERTS.md), OTel, allocator control, and mimalloc. Release
# wheels use `--release --features pyo3/extension-module` (see
# .github/workflows/release.yml), which replaces this list and keeps only the
# binding crate defaults plus PyO3's extension-module mode. Thus shipped
# artifacts exclude hotpath — its macros are no-op `lib_off`, zero runtime
# penalty — as well as the other development-only features.
features = ["pyo3/extension-module", "degenbot-bot/hotpath", "degenbot-bot/hotpath-prometheus", "degenbot-solvers/hotpath", "degenbot-bot/allocator-ctrl", "otel", "mimalloc"]
python-packages = ["degenbot"]

