# degenbot Grafana-managed alert rules (ADR-040 epic DO5Q5E, task UI7QNH).
#
# SUPERSEDES degenbot-alerts.yml (Prometheus-managed) AFTER the operator
# mounts this file via Grafana file provisioning:
#
#   placement (docker): <grafana-cfg-dir>/provisioning/alerting/degenbot-grafana-rules.yml
#   grafana.ini: [unified_alerting] enabled = true (default in Grafana >= 9.4)
#
# The rules evaluate the SAME expressions against the SAME Prometheus
# datasource; the datasource UID below must match the operator's Prometheus
# datasource (the dashboard's DS_PROMETHEUS variable default). Edit
# GATE-POWERED DATASOURCE UID once below (or sed it at deploy time), then
# reload. After provisioning is verified in the Alerting UI, delete
# degenbot-alerts.yml (the hard cutover - do not run both surfaces at once,
# every alert would double-fire).

apiVersion: 1
groups:
  - orgId: 1
    name: degenbot-critical
    folder: degenbot
    interval: 30s
    rules:
      - uid: degenbot-process-down
        title: DegenbotProcessDown
        condition: C
        for: 2m
        annotations:
          summary: degenbot process DOWN - desync abort or crash
          description: >-
            The degenbot scrape target stopped answering (or its series
            vanished) for 2m. Covers the desync abort (ADR-040 exit stance /
            fatal buckets) and any crash - the signal that had NO owner before
            (DegenbotHeaderStall deliberately ignores down targets).
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'count(up{job="degenbot"} == 1) == 0 or absent(degenbot_blocks_observed_total)'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-header-stall
        title: DegenbotHeaderStall
        condition: C
        for: 2m
        annotations:
          summary: degenbot header stall - bot is blind
          description: >-
            No blocks observed for 2m while the scrape target is UP - the WS
            feed or the pump is dead while the chain advances.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'rate(degenbot_blocks_observed_total{init!="true"}[1m]) == 0 and on() up{job="degenbot"} == 1'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-drainer-stall
        title: DegenbotDrainerStall
        condition: C
        for: 5m
        annotations:
          summary: degenbot drainer stall - detached solve stragglers at cap
          description: >-
            Successor of the retired degenbot_drain_queue_depth gauge
            (DispatchOwner queue, removed SZJUKL): the detached-solve straggler
            backlog sits AT CAP 8 - the sidecar merge is wedged and solves are
            not landing. Healthy runs sit at 0 and drop stragglers stale.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'degenbot_detached_in_flight >= 8'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-state-head-divergence
        title: DegenbotStateHeadDivergence
        condition: C
        for: 1m
        annotations:
          summary: degenbot state head divergence (freeze signature)
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'abs(degenbot_state_head_lag_blocks{init!="true"}) >= 3'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: degenbot-warning
    folder: degenbot
    interval: 1m
    rules:
      - uid: degenbot-errors-any
        title: DegenbotErrorRate
        condition: C
        for: 0m
        annotations:
          summary: degenbot recorded failures (any kind)
          description: >-
            At least one failure recorded in 5m. The kind label is the CLOSED
            SET telemetry::error_kind (ws_completeness sim_failure
            submit_failure monitor_failure verify_mismatch drain_stall
            drain_dead); an active quarantine ALSO surfaces via
            DegenbotDesyncQuarantine (degenbot_engine_quarantined_pools).
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'sum(rate(degenbot_errors_total[5m])) > 0'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-desync-quarantine
        title: DegenbotDesyncQuarantine
        condition: C
        for: 0m
        annotations:
          summary: solver-state desync quarantined a pool
          description: >-
            A quarantine-excluded pool was active in the last 30m (ADR-040
            containment via the resolve-seam quarantine gate, gauge
            degenbot_engine_quarantined_pools). The retired
            degenbot_quarantine_events_total counter and the
            solver_state_desync errors kind are gone: the ADR-021 publish
            tripwire was retired with MROOY7 task 2UVG3E. Urgent root-cause
            work: enable the sim-divergence probe for the engine-vs-RPC
            divergence dump. The bot keeps trading its other paths.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'max_over_time(degenbot_engine_quarantined_pools[30m]) > 0'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-submit-failures
        title: DegenbotSubmitFailures
        condition: C
        for: 0m
        annotations:
          summary: degenbot submit failures
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: 'sum(rate(degenbot_submit_outcomes_total{outcome="skipped_broadcast_failed"}[10m])) > 0'
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-monitor-expiry-spike
        title: DegenbotMonitorExpirySpike
        condition: C
        for: 5m
        annotations:
          summary: degenbot monitor expiry spike
        data:
          - refId: A
            relativeTimeRange: { from: 2700, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: >-
                sum(rate(degenbot_monitor_outcomes_total{outcome="expired"}[15m]))
                / clamp_min(sum(rate(degenbot_monitor_outcomes_total[15m])), 0.001) > 0.5
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1.0005] }
      - uid: degenbot-profit-efficiency-drop
        title: DegenbotProfitEfficiencyDrop
        condition: C
        for: 10m
        annotations:
          summary: degenbot profit efficiency drop
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: >-
                degenbot_profit_missed_total
                / clamp_min(degenbot_profit_realized_total + degenbot_profit_missed_total, 1) > 0.8
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1.0005] }
      - uid: degenbot-epoch-race-slow
        title: DegenbotEpochRaceSlow
        condition: C
        for: 5m
        annotations:
          summary: degenbot epoch race slow - header to publish p95 over 2s
          description: >-
            The epoch race (ADR-041): header accept to Published-stage
            dispatch (degenbot_epoch_header_to_publish_seconds) - the edge
            where submission/delivery subscribe - has its 5m p95 above 2s.
            Warning level: money is landing but late. Investigated with the
            dashboard stage-cycle waterfall (delivery / burst / settle /
            streaming-age legs) and a degenbot.epoch trace from Jaeger.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: >-
                histogram_quantile(0.95, sum(rate(degenbot_epoch_header_to_publish_seconds_bucket[5m])) by (le)) > 2
                or vector(0)
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-epoch-stale-drops
        title: DegenbotEpochStaleDrops
        condition: C
        for: 10m
        annotations:
          summary: degenbot stale-epoch drops sustained - stage cycle spilling past the next header
          description: >-
            Stale-epoch work items are being dropped loudly by the I3
            rewind-generation fail-fast (degenbot_epoch_stale_drops) for 10m.
            The stage cycle (Streaming..Publish) is chronically spilling into
            the next epoch - early warning before the race p95 tail moves and
            before detached-in-flight backs up (DegenbotDrainerStall).
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: >-
                sum(rate(degenbot_epoch_stale_drops_total[5m])) > 0
                or vector(0)
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: degenbot-simulate-error-rate
        title: DegenbotSimulateErrorRate
        condition: C
        for: 5m
        annotations:
          summary: degenbot simulate error rate high
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: eea7hc2lizlz4d
            model:
              expr: >-
                sum(rate(degenbot_simulate_verdicts_total{outcome="error"}[10m]))
                / clamp_min(sum(rate(degenbot_simulate_verdicts_total[10m])), 0.001) > 0.1
              datasource: { type: prometheus, uid: eea7hc2lizlz4d }
              editorMode: code
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1.0005] }
