name: hotpath benchmark

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  upload:
    name: hotpath benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: hotpath-benchmark
      - name: Run benchmark and upload report
        env:
          HOTPATH_UPLOAD: 1
          HOTPATH_BENCHMARK: hotpath_bench
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=1.98.1,profile=release
          HOTPATH_OUTPUT_FORMAT: none
          # The Cargo workspace lives in rust/, which hotpath cannot infer from
          # the repository-root working directory; matches the relay's input.
          HOTPATH_SOURCE_ROOT: rust
        run: |
          cargo run -q --locked --release --manifest-path rust/Cargo.toml -p degenbot-solvers \
            --example hotpath_bench --features hotpath,hotpath-alloc,hotpath-cloud

  report:
    name: hotpath benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: hotpath-benchmark
      - name: Run benchmark and write report
        env:
          HOTPATH_BENCHMARK: hotpath_bench
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=1.98.1,profile=release
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: report.json
        run: |
          cargo run -q --locked --release --manifest-path rust/Cargo.toml -p degenbot-solvers \
            --example hotpath_bench --features hotpath,hotpath-alloc,hotpath-cloud
          test -s report.json
      - uses: actions/upload-artifact@v7
        with:
          name: hotpath-report
          path: report.json
          retention-days: 1
          if-no-files-found: error
