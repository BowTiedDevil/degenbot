name: hotpath benchmark

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Callgrind attributes instructions through the symbol table, which the
  # workspace release profile strips; keep it for the benchmark build only.
  CARGO_PROFILE_RELEASE_STRIP: "false"
  # Criterion benchmarks of `degenbot-pools/benches/digest.rs`, each its own
  # hotpath.rs series; keep in sync with the relay's matrix.
  BENCHMARKS: solve_balancer_stable_path solve_curve_path
  HOTPATH_CRITERION_ITERATIONS: "1000"
  HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.98.1,profile=release,valgrind=3.26.0
  HOTPATH_OUTPUT_FORMAT: json
  # The Cargo workspace lives in rust/, which hotpath cannot infer from the
  # repository-root working directory; matches the relay's input.
  HOTPATH_SOURCE_ROOT: rust

jobs:
  upload:
    name: hotpath benchmark (push)
    if: github.event_name == 'push'
    # Instruction counts only compare within one Valgrind build, Rust toolchain
    # and OS, so the image, the package and the toolchain are pinned.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      UPLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: hotpath-benchmark
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build benchmark
        run: |
          bin=$(cargo bench -q --locked --manifest-path rust/Cargo.toml -p degenbot-pools \
            --bench digest --features hotpath-alloc,hotpath-cloud,hotpath-callgrind \
            --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "digest" and (.target.kind | index("bench"))) | .executable')
          test -x "$bin"
          echo "BENCH_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run benchmarks natively and under Callgrind
        env:
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          mkdir -p reports
          for bench in $BENCHMARKS; do
            export HOTPATH_BENCHMARK="$bench"
            HOTPATH_OUTPUT_PATH="$RUNNER_TEMP/native-$bench.json" \
              "$BENCH_BIN" --bench --test --exact "$bench"
            if [ "$UPLOAD" = true ]; then
              export HOTPATH_UPLOAD=fail-on-error
              export HOTPATH_UPLOAD_RESPONSE_PATH="$RUNNER_TEMP/upload-$bench.json"
            fi
            HOTPATH_OUTPUT_PATH="reports/$bench.json" \
            HOTPATH_MERGE_REPORT="$RUNNER_TEMP/native-$bench.json" \
              valgrind -q --tool=callgrind --instr-atstart=no \
                --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
                "$BENCH_BIN" --bench --test --exact "$bench"
            unset HOTPATH_UPLOAD
            if [ "$UPLOAD" = true ]; then test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"; fi
            jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
              "reports/$bench.json" > /dev/null
          done

  report:
    name: hotpath benchmark (pull request)
    if: github.event_name == 'pull_request'
    # Instruction counts only compare within one Valgrind build, Rust toolchain
    # and OS, so the image, the package and the toolchain are pinned.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # No OIDC token here (fork pull requests never get one): the reports go to
    # hotpath-relay.yml as an artifact.
    permissions:
      contents: read
    env:
      UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: hotpath-benchmark
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build benchmark
        run: |
          bin=$(cargo bench -q --locked --manifest-path rust/Cargo.toml -p degenbot-pools \
            --bench digest --features hotpath-alloc,hotpath-cloud,hotpath-callgrind \
            --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "digest" and (.target.kind | index("bench"))) | .executable')
          test -x "$bin"
          echo "BENCH_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run benchmarks natively and under Callgrind
        env:
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          mkdir -p reports
          for bench in $BENCHMARKS; do
            export HOTPATH_BENCHMARK="$bench"
            HOTPATH_OUTPUT_PATH="$RUNNER_TEMP/native-$bench.json" \
              "$BENCH_BIN" --bench --test --exact "$bench"
            if [ "$UPLOAD" = true ]; then
              export HOTPATH_UPLOAD=fail-on-error
              export HOTPATH_UPLOAD_RESPONSE_PATH="$RUNNER_TEMP/upload-$bench.json"
            fi
            HOTPATH_OUTPUT_PATH="reports/$bench.json" \
            HOTPATH_MERGE_REPORT="$RUNNER_TEMP/native-$bench.json" \
              valgrind -q --tool=callgrind --instr-atstart=no \
                --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
                "$BENCH_BIN" --bench --test --exact "$bench"
            unset HOTPATH_UPLOAD
            if [ "$UPLOAD" = true ]; then test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"; fi
            jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
              "reports/$bench.json" > /dev/null
          done
      - uses: actions/upload-artifact@v7
        with:
          name: hotpath-report
          path: reports/*.json
          retention-days: 1
          if-no-files-found: error
