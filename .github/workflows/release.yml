# Single ordered release pipeline (merges the former publish-to-pypi.yaml +
# publish-to-crates-io.yml, which raced each other on the same v* tag and
# could split the version across registries). On a v* tag:
#   validate-branch, build-wheels + build-sdist (parallel)
#     -> crates.io publish (failure-prone leg runs first; failure = nothing published)
#     -> PyPI publish (needs crates leg succeeded)
#     -> GitHub Release (needs both pushes; the clean-completion signal)
# test-* tags publish only to Test PyPI (crates.io release is policy-forbidden there).
name: Release

on:
  push:
    tags:

      - 'v*'
      - 'test-*'

jobs:
  validate-branch:
    # Shared by both former workflows (identical bodies).
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Tag ${{ github.ref_name }} is not on main branch"
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on main branch"

  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (manylinux_2_28 for broader compatibility)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
            args: ""
          # Linux ARM64 (manylinux_2_28)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
            args: ""
          # macOS universal2 (single wheel for both Intel and Apple Silicon)
          - os: macos-14
            target: universal2-apple-darwin
            args: "--target universal2-apple-darwin"
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # `--features pyo3/extension-module` explicitly selects only extension
          # mode for the shipped wheel; the binding's `dev-features` alias is
          # never selected here. Its hotpath macros
          # expand to no-op `lib_off` stubs, with zero runtime penalty. See
          # rust/crates/engine/degenbot-bot/src/profiling.rs.
          args: --release --out dist --features pyo3/extension-module ${{ matrix.args }}
          sccache: 'true'
          # Pin the native (non-manylinux) legs to the same Rust as ci.yml's
          # dtolnay jobs. A floating stable toolchain would make release output
          # depend on the runner image instead of the repository policy.
          rust-toolchain: 1.98.1
          working-directory: .

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist with maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: .

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-test-pypi:
    name: Publish to Test PyPI
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [validate-branch, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/degenbot
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    # Ordering: needs the crates.io leg, so a crates.io failure skips the PyPI
    # push entirely — the upstream registries can no longer split on a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-branch, build-wheels, build-sdist, publish-crates-io]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/degenbot
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates-io:
    # Former standalone publish-to-crates-io.yml `publish` job (body verbatim).
    # Ordering: the crates.io leg runs FIRST because it is the failure-prone
    # one (new-crate rate limits, lockstep checks) — a failure here publishes
    # nothing anywhere, and a re-tag after a fix is cheap. PyPI holds the
    # wheel artifacts and is the recoverable leg (a tag-driven retry republishes).
    name: Publish (cargo-native order + new-crate rate-limit retries)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-branch, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check tag matches workspace version
        # Release-policy guard (pre-release safe): the tag (minus leading v)
        # must equal the single [workspace.package] version literal (ADR-009).
        # e.g. tag v0.6.0-alpha.5 requires version = "0.6.0-alpha.5"; a
        # v0.6.0 tag against an alpha workspace fails fast, before upload.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Release tags use PEP440 (v0.6.0a5); crates.io uses SemVer
          # (0.6.0-alpha.5), which is what the workspace literal holds. Normalize
          # the PEP440 pre-release suffixes before comparing, so v0.6.0a5 and
          # v0.6.0-alpha.5 both pass, but v0.6.0 against an alpha workspace still
          # fails fast. POST releases (v0.6.0a1.post1) are PyPI-only: no SemVer
          # form exists, so they fall through and fail closed here.
          cargo_ver=$(printf '%s' "$tag" | sed -E \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)a([0-9]+)$/\1.\2.\3-alpha.\4/' \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)b([0-9]+)$/\1.\2.\3-beta.\4/' \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)rc([0-9]+)$/\1.\2.\3-rc.\4/')
          ws_ver=$(sed -n 's/^version = //p' rust/Cargo.toml | head -n 1 | tr -d '"' | tr -d ' ')
          # ADR-009 lockstep: every [workspace.dependencies] version literal must
          # equal the workspace version, or cargo packs 0.6.0-alpha.N crates whose
          # manifests require stale sibling versions (0.6.0-alpha.N-1) — crates.io
          # rejects the upload. Fail here, before the dry-run/publish steps.
          # Only the internal degenbot-* path deps are lockstep-managed (ADR-009);
          # third-party entries in the same table (e.g. hashbrown, zstd) carry
          # their own upstream version literals and must not be compared here.
          dep_ver=$(sed -n '/^\[workspace.dependencies\]/,/^\[/p' rust/Cargo.toml | grep -o 'degenbot-[a-z0-9-]* = { version = "[^"]*", path' | sed -E 's/.*version = "([^"]+)".*/\1/' | sort -u | grep -v "^$ws_ver$" | head -n 1)
          if [ -n "$dep_ver" ]; then
            echo "[workspace.dependencies] version '$dep_ver' is out of lockstep with workspace version '$ws_ver'" >&2
            exit 1
          fi
          if [ "$cargo_ver" != "$ws_ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match [workspace.package] version '$ws_ver'" >&2
            exit 1
          fi
          echo "Tag/version match: $ws_ver"

      - name: Check crates.io token is present
        # Fail fast - before the ~4.5 min verified dry-run - when the repo secret
        # `CRATES_IO_TOKEN` is missing/empty. Otherwise cargo publish fails only
        # after verification with an opaque auth error.
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CRATES_IO_TOKEN repo secret is not set (or is empty) - add a crates.io API token at GitHub repo Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "crates.io token present"

      - name: Pre-publish verification (full verify, all members)
        # Release policy: never publish without verify. `cargo publish
        # --workspace --dry-run` packages every publishable member and
        # verifies each tarball's build (the two non-publishable members,
        # degenbot_rs + degenbot-execution-sample, are skipped by cargo).
        # A fresh CI runner has no stale local-registry state, so this is a
        # clean verification of the tag's exact tree.
        run: cargo publish --locked --workspace --dry-run --allow-dirty --manifest-path rust/Cargo.toml

      - name: Publish (cargo-native order + waits; new-crate rate-limit retry rounds)
        # First-release mechanics: docs/releases/2026-08-19-first-crates-io-release.md.
        # `cargo publish --locked --workspace` orders the publishable members itself (dependency
        # order) and polls the registry until each crate AND its local deps are
        # index-visible before proceeding — no hand-rolled topo list, no curl index
        # polling. crates.io's PublishNew bucket (1 NEW NAME per 10 min, burst 5)
        # rate-limits brand-new crate names, so each round publishes the
        # not-yet-live members and, on 429, sleeps until the server-stated
        # retry-after. Version-bump releases (PublishUpdate: 1/min, burst 30)
        # complete in round 1.
        run: |
          set -uo pipefail
          cd rust
          # The live-set audit below greps the crates.io index, which stores the
          # SEMVER literal (0.6.0-alpha.6), not the PEP440 tag (0.6.0a6). Read the
          # workspace version instead of deriving it from the tag so the grep
          # always matches what crates.io reports.
          ver=$(sed -n 's/^version = //p' Cargo.toml | head -n 1 | tr -d '"' | tr -d ' ')
          # Publishable members from cargo metadata itself (publish:null), so a
          # new non-publishable crate (publish=false -> []) is auto-skipped — no
          # hardcoded name list to drift. Today that's degenbot_rs + degenbot-execution-sample.
          read -r -a members <<< "$(cargo metadata --format-version 1 --no-deps | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log(m.packages.filter(p=>p.publish==null).map(p=>p.name).join(" "))})')"
          log=/tmp/crates-publish.log
          : > "$log"
          for round in $(seq 1 30); do
            excludes=()
            live=0
            for m in "${members[@]}"; do
              # cargo search prints `name = "version"  # description` when live; grep
              # only the anchored exact-name line so fuzzy search hits never false-match.
              if cargo search "$m" --limit 3 2>/dev/null | grep -q "^$m = \"$ver\""; then
                excludes+=(--exclude "$m")
                live=$((live + 1))
              fi
            done
            if [ "$live" -eq "${#members[@]}" ]; then
              echo "all ${#members[@]} members already live at $ver"
              exit 0
            fi
            echo "=== round $round: $live/${#members[@]} members already live at $ver — publishing the rest ==="
            if cargo publish --locked --workspace --allow-dirty "${excludes[@]}" >>"$log" 2>&1; then
              echo "=== publish complete at $ver ==="; exit 0
            fi
            # `|| true` matters: the loop runs under `bash -e`, and a missing 429
            # in the log makes this assignment exit 1 — silently skipping the
            # diagnostic + log tail below. Keep the no-match case non-fatal.
            ra=$(grep -o 'try again after [A-Za-z]*, [0-9]* [A-Za-z]* [0-9]* [0-9:]* GMT' "$log" | tail -n 1 | sed 's/try again after //' || true)
            if [ -n "$ra" ]; then
              ra_epoch=$(date -d "$ra" +%s) || { echo "::error::unparseable retry-after: $ra"; exit 1; }
              sleep_s=$(( ra_epoch - $(date +%s) + 120 ))
              echo "429 new-crate rate limit — retry-after $ra (sleeping ${sleep_s}s)"
              if [ "$sleep_s" -gt 0 ]; then sleep "$sleep_s"; fi
              continue
            fi
            echo "::error::cargo publish failed without a 429 retry-after — last 50 log lines:"
            tail -n 50 "$log"
            exit 1
          done
          echo "::error::30 rounds exhausted (new-crate rate limit longer than expected) — re-tag to continue; partial releases are recoverable at the same version"
          exit 1


  github-release:
    name: Create GitHub Release
    # Final "release completed cleanly" signal: only created when BOTH upstream
    # pushes succeeded.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-to-pypi, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes ""

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
