name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out (tag or SHA); empty = the triggering commit.'
        required: false
        type: string
        default: ''
      full_suite:
        description: 'Run every track regardless of the diff; release.yml sets it.'
        required: false
        type: boolean
        default: false

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  # Superseded pushes to the same branch/PR replace the older run instead of
  # stacking full CI invocations behind it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state is never reused within a run on ephemeral CI runners and
  # only bloats the rust-cache save. Debuginfo likewise: rust/target (and the
  # cache) shrink substantially without it.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Path gate: cheap first job that decides which tracks the event actually
  # touched. PRs diff against the merge-base, pushes against the previous
  # commit (dorny/paths-filter handles both). A tag carries no diff to filter
  # on, and a reusable workflow's callee sees the caller's event name rather
  # than `workflow_call`, so the release gate is identified by the `full_suite`
  # input release.yml passes, not by the event.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ inputs.full_suite || steps.filter.outputs.rust == 'true' || steps.filter.outputs.machinery == 'true' }}
      python: ${{ inputs.full_suite || steps.filter.outputs.python == 'true' || steps.filter.outputs.machinery == 'true' }}
      stubs: ${{ inputs.full_suite || steps.filter.outputs.stubs == 'true' || steps.filter.outputs.machinery == 'true' }}
      tier3: ${{ inputs.full_suite || steps.filter.outputs.tier3 == 'true' || steps.filter.outputs.machinery == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'rust-toolchain.toml'
              - 'tier3-oracle/artifacts/**'
              # maturin reads the build config from these; the rust job builds
              # the extension.
              - 'pyproject.toml'
              - 'uv.lock'
            python:
              - 'rust/**'
              - 'src/**'
              - 'tests/**'
              - 'contracts/vyper/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tier3-oracle/artifacts/**'
            stubs:
              - 'rust/crates/shells/degenbot-python/src/**'
              - 'rust/crates/shells/degenbot-python/Cargo.toml'
              - 'rust/tools/stubgen/**'
              - 'src/degenbot/_ffi/**'
              - 'pyproject.toml'
            tier3:
              - 'tier3-oracle/**'
              - 'contracts/vyper/**'
            # CI machinery: the gated jobs execute justfile recipes, gate
            # scripts, and this workflow file itself, so an edit to any of
            # them must re-run the gates - a machinery-only change must not
            # merge green with zero jobs run. This includes the no-Python
            # console gate and its oracle (ADR-051 D10).
            machinery:
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.cargo/config.toml'
              - 'prek.toml'

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Lint commit messages
        # On push: lint only the commits being pushed (before..after).
        # On PRs: lint all commits in the PR (merge-base..HEAD).
        # Fallback: lint the last 20 commits on the branch.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FROM="${{ github.event.before }}"
            # A force push rewrites history and orphans the `before` SHA: a fresh
            # checkout (fetch-depth:0 fetches only objects reachable from refs)
            # won't contain it, so commitlint throws "Invalid revision range".
            # Fall back to a guaranteed-present range that still covers the
            # rewritten commits (HEAD history is fully fetched).
            if ! git rev-parse --verify --quiet "${FROM}^{commit}" >/dev/null 2>&1; then
              echo "::warning::Push 'before' SHA ${FROM} is absent (likely a force push); using fallback range."
              n=$(git rev-list --count HEAD)
              if [ "$n" -gt 200 ]; then n=200; fi
              if [ "$n" -ge 1 ]; then FROM="HEAD~$((n - 1))"; else FROM="HEAD"; fi
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM=$(git merge-base origin/main HEAD)
          else
            FROM=HEAD~20
          fi
          # An empty range makes commitlint throw "Invalid revision range".
          if [ "$(git rev-list --count "${FROM}..HEAD" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "No commits in range ${FROM}..HEAD; nothing to lint."
            exit 0
          fi
          echo "Linting commits from $FROM to HEAD"
          # Pinned: a floating @commitlint/cli would make the lint rule set
          # depend on when the job runs.
          npx --yes @commitlint/cli@21.2.4 --from="$FROM" --to=HEAD

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Lint Markdown
        # No --fix: an auto-fixable violation would be corrected on the runner
        # and discarded, going green while the repository stays dirty. Fail on
        # the violation instead. Pinned for the same reason as commitlint.
        run: just lint-markdown-check

  msrv:
    name: MSRV (Rust 1.97)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust-msrv

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: ./.github/actions/llvm23

      - name: Compile workspace at MSRV
        run: just check-msrv

  rust-lint:
    # Lint and feature-lane gate: everything here fails fast on a formatting,
    # clippy, or feature-combination regression before a test binary is built,
    # and the tree-clean assertion belongs here because clippy is what writes
    # into the tree. Split out of the former consolidated `rust` job so a
    # release-profile link can never delay this signal.
    name: Rust (lint + feature lanes)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        # Shared ci-rust prefix: every path-gated job chains off the others'
        # saves, and rust-cache accounts for workspace source changes and prunes
        # stale artifacts before saving (unlike a Cargo.lock-only key).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The evm2 JIT links LLVM 23 (llvm-sys) and the umbrella's default features
      # carry `jit`, so a default-feature compile needs a toolchain the runner
      # image does not ship. The action takes the distro toolchain when the image
      # has one and the pinned prebuilt otherwise (docs/llvm-release-ci.md).
      - uses: ./.github/actions/llvm23

      - name: Check formatting
        run: just fmt-check

      - name: Run Clippy (workspace defaults)
        run: just lint-rust-check

      - name: Check workspace default features independently
        run: just check-rust-default

      - name: Check pure-Rust consumer features
        run: just check-rust-consumer

      - name: Check dev-only extension features
        run: just check-rust-dev-features

      - name: Check release-equivalent extension features
        run: just check-rust-extension-release

      - name: Assert Rust lint left the working tree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  rust-test:
    # The cargo workspace suite in the dev profile, plus the two-sided golden
    # replay, which reuses those warm dev artifacts instead of paying its own
    # compile. Whole-workspace test execution is seconds; the compile is the
    # cost, which is why this job carries nothing else.
    name: Rust (workspace tests + golden replay)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared ci-rust prefix: every path-gated job chains off the others'
        # saves, and rust-cache accounts for workspace source changes and prunes
        # stale artifacts before saving (unlike a Cargo.lock-only key).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: ./.github/actions/llvm23

      # Architecture and hygiene tests shell out to ripgrep; ubuntu-latest no
      # longer preinstalls it. Provision the same dependency as the devcontainer.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      # `test-rust-dev` is pure cargo and tolerates a missing `uv` (best-effort
      # LIBDIR probe), which is why this job installs none: the workspace lane
      # must keep working with no Python state.
      - name: Run Tests
        run: just test-rust-dev

      # The replay gate runs through `test-rust-nextest`, which resolves the
      # venv python's LIBDIR to put on LD_LIBRARY_PATH for the test binaries
      # that link libpython -- a `uv` lookup, and the runner image ships no uv.
      - name: Install uv (nextest lane LIBDIR)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync the uv environment (no extension build)
        run: uv sync --locked --dev --no-install-project

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152

      - name: Run two-sided golden replay gate (offline, blocks merge)
        run: just test-golden-replay

  rust-release-tests:
    # The shipped profile: debug_assertions off, which only `--release` gives.
    # Test binaries built there inherit release's thin LTO and stripping, so this
    # leg is link-bound (one link phase dominated the old consolidated job's wall
    # clock). Isolated so that cost is measured on its own job instead of
    # blocking the lint and dev-test verdicts.
    #
    # No LLVM 23 and no uv: the selected packages are pyo3-free core crates and
    # evm2-jit is opt-in, so no test binary links libpython or llvm-sys.
    name: Rust (release-profile tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared ci-rust prefix: every path-gated job chains off the others'
        # saves, and rust-cache accounts for workspace source changes and prunes
        # stale artifacts before saving (unlike a Cargo.lock-only key).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run release-profile tests
        run: just test-rust-release

  rust-artifacts:
    # The packaging path: the development extension build (maturin, dev profile)
    # and the publish oracle over every member that can package. Both need the
    # venv (maturin rides the dev group) and LLVM 23 (the cdylib carries `jit`).
    name: Rust (extension build + publish dry-run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared ci-rust prefix: every path-gated job chains off the others'
        # saves, and rust-cache accounts for workspace source changes and prunes
        # stale artifacts before saving (unlike a Cargo.lock-only key).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: ./.github/actions/llvm23

      # `scripts/build_extension.sh` builds through `uv run maturin`, so the lock
      # venv (which owns maturin) has to exist first. No extension install from
      # uv sync itself: the build step produces it.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync the uv environment (no extension build)
        run: uv sync --locked --dev --no-install-project

      - name: Build extension
        run: just build-rust-extension

      # The publish oracle over every member that can package: catches
      # manifest/file-inclusion regressions on every rust change, long before
      # a tag. The members the publish chain cannot upload are withheld by name
      # against the publish-blocked census (docs/gates.md section 7) and keep
      # their file-inclusion coverage through `cargo package --list`.
      # --no-verify keeps the PR gate fast (no isolated build); the verified
      # publish itself is the release workflow's pre-publish step plus the real
      # `cargo publish` (always verified - release policy forbids --no-verify
      # on publishes).
      - name: Dry-run publish of every member that can package
        run: just publish-dry-run --no-verify

  rust-policy-lanes:
    # The two public policy configurations, scheduled: `degenbot-arbitrage` and
    # `degenbot-batch-executor` each ship one policy feature, `order-index`
    # (ADR-024). Off, the caller's pre-sort IS the simulation order and the
    # pre-sim cap keeps the input prefix; on, a deterministic profit-descending
    # reorder runs before the SAME cap, so cap-binding survivor selection may
    # differ and those survivors simulate in that reordered sequence. Both are
    # supported public configurations, and each owns tests the other cannot
    # compile — which is exactly what the
    # workspace test lane in the `rust` job cannot reach: the `degenbot`
    # umbrella and the `degenbot_rs` cdylib enable the feature on their dep
    # edges, and resolver v3 unifies that across `--workspace`, so a workspace
    # build compiles the default-configuration tests out and its feature lane
    # would be indistinguishable from the default one.
    #
    # One leg per package runs BOTH configurations through
    # `test-rust-policy-lane`: the recipe narrows the selection to a direct
    # `-p` run (nextest gives --workspace precedence over -p, so the narrowing
    # is the recipe's job, not the caller's) and asserts the resolved feature
    # graph against the configuration before the suite runs. Two configurations
    # in one target dir means the second rebuilds only the policy crate and its
    # index dep. No evm2 JIT toolchain: `evm2-jit` is opt-in and no selected
    # package enables it. No node and no Foundry: these suites are offline.
    name: "Rust (policy lanes: ${{ matrix.package }})"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Independent packages: one leg failing must not cancel the other's
      # signal. Within a leg the two configurations run in sequence (each is
      # the same package's policy pair).
      fail-fast: false
      matrix:
        package:
          - degenbot-arbitrage
          - degenbot-batch-executor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      # `test-rust-policy-lane` runs the package's suites through `cargo
      # nextest` (the narrowing recipe's own choice of runner), and the runner
      # image ships no nextest. Provision it here, at the version the
      # devcontainer builds, so a red policy lane is a test verdict rather than
      # a missing tool.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152

      - name: Cache Cargo
        # Shares the ci-rust prefix so the common workspace deps are reused.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # `test-rust-nextest` is uv-required by design: it exports the venv
      # python's LIBDIR for test binaries that link libpython. The locked venv
      # is all this job needs — no extension build (that is `just dev`).
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync the uv environment (no extension build)
        run: uv sync --locked --dev --no-install-project

      - name: Default configuration (order-index off)
        run: just test-rust-policy-lane ${{ matrix.package }}

      - name: order-index configuration (order-index on)
        run: just test-rust-policy-lane ${{ matrix.package }} order-index

  cli-no-python:
    # ADR-051 D10: the console must build and run with NO Python
    # anywhere. This job deliberately does NOT provision Python (no
    # actions/setup-python) and never invokes uv; it builds the `degenbot`
    # binary from the Rust workspace alone, runs the argv smoke set
    # (--help/--version/database inspect/exchange activate+deactivate
    # idempotence) against committed Alembic fixtures copied to a temp dir, and
    # diffs the machine-checkable stdout against the checked-in oracle. The two
    # seeded-divergence steps prove the comparator can fail.
    name: CLI (no Python)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      # No Python toolchain is provisioned. Assert it statically against this
      # job's own YAML: a future edit that adds actions/setup-python,
      # astral-sh/setup-uv, or a `uv run` step is caught here.
      #
      # live-invariant gate (ADR-087 D2): watches this job's own live YAML steps for Python provisioning; not tripwire precedent.
      - name: Assert this job provisions no Python
        run: |
          job=$(awk '
            /^  cli-no-python:/ { in_job = 1 }
            in_job && /^  [a-z][a-z0-9-]*:$/ && !/^  cli-no-python:/ { in_job = 0 }
            in_job { print }
          ' .github/workflows/ci.yml)
          fail=0
          # No Python-provisioning action may be named by this job.
          if printf '%s\n' "$job" | grep -Ev '^[[:space:]]*#' | grep -v 'grep -Eq' | grep -Eq 'uses:[[:space:]]*(actions/setup-python|astral-sh/setup-uv)'; then
            echo "::error::cli-no-python must not provision Python"
            fail=1
          fi
          # No step may shell out to uv. Comment lines and this self-check's
          # own pattern line are excluded so the guard cannot match itself.
          if printf '%s\n' "$job" | grep -Ev '^[[:space:]]*#' | grep -v 'grep -Eq' | grep -Eq 'uv[[:space:]]+run([[:space:]]|$)'; then
            echo "::error::cli-no-python must not invoke uv"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "ok: no Python setup action or uv invocation in the cli-no-python job"

      - name: Build the console (Python-free)
        run: cargo build --locked -p degenbot-cli --manifest-path rust/Cargo.toml

      - name: Run the no-Python console gate
        run: bash .github/workflows/cli-no-python-gate.sh

      - name: Prove the gate has teeth (seeded expected divergence)
        run: DEGENBOT_CLI_GATE_SEED=expected bash .github/workflows/cli-no-python-gate.sh

      - name: Prove the gate has teeth (seeded live divergence)
        run: DEGENBOT_CLI_GATE_SEED=live bash .github/workflows/cli-no-python-gate.sh

  tier3-oracle:
    name: Tier-3 On-Chain Accuracy Oracle
    needs: changes
    if: needs.changes.outputs.tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Foundry (forge + solc 0.7.6)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Fetch canonical reference contracts (v2/v3/v4-core) + solc binaries
        run: tier3-oracle/bootstrap-libs.sh

      # The oracle TESTS themselves run in the consolidated `rust` job (they load
      # the committed bytecode from tier3-oracle/artifacts/ — no toolchain at
      # runtime). This job's unique role is the AUTHORITATIVE compile-vs-use
      # check: recompile every harness with the real solc/forge toolchain and
      # assert the committed bytecode matches a fresh build (catches a harness-
      # source or pinned-vendored-lib edit without a rebuild).
      - name: Verify committed harness bytecode matches a fresh compile
        run: just verify-tier3-artifacts

      # The same, for the Vyper executor (tier-3b): recompile the root
      # contracts/vyper source with the pinned vyper 0.5.0b2 and byte-compare
      # the committed artifacts. The root uv project owns the toolchain.
      - name: Install uv (executor vyper toolchain)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache uv wheel cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-executor-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-executor-

      # `build-tier3-executor-harness.sh` compiles through `uv run --no-sync
      # vyper`, which deliberately refuses to resolve a different vyper than
      # the lock pins — so the root project's venv has to already own it. That
      # is the sync half of `just bootstrap`; the extension build half is not
      # needed here and would cost a Rust compile.
      - name: Sync the executor vyper toolchain
        run: uv sync --locked --dev --no-install-project

      - name: Verify committed executor artifact matches a fresh compile
        run: just verify-tier3-executor-artifact

  python-wheel:
    # One extension build for the whole Python matrix. The five legs each ran
    # `just dev` (maturin, 217-309 s apiece) against identical source, so the
    # build moves here and travels as one abi3 wheel that serves every
    # interpreter leg. `rust-lint`/`rust-artifacts` still build the cdylib their
    # own way; this job exists only to stop the matrix repeating itself.
    #
    # The extension resolves its executor-runtime artifact against the path it
    # was compiled in, so this job and the legs must share one checkout path
    # (GitHub-hosted jobs do: `/home/runner/work/<repo>/<repo>`). A runner that
    # mounts a different path per job needs `DEGENBOT_CONTRACTS_DIR` instead.
    name: Python extension wheel
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared ci-rust prefix: every path-gated job chains off the others'
        # saves, and rust-cache accounts for workspace source changes and prunes
        # stale artifacts before saving (unlike a Cargo.lock-only key).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The cdylib links the evm2 JIT's LLVM 23, like every other Linux build of
      # default features.
      - uses: ./.github/actions/llvm23

      - name: Sync the uv environment (the wheel build needs maturin)
        run: uv sync --locked --dev --no-install-project

      - name: Build the extension wheel
        run: just build-rust-extension-wheel dist

      - name: Upload the extension wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: degenbot-extension-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  python:
    # Consolidation of the former python-lint / python-test matrix /
    # python-test-anvil jobs, which were byte-identical environments (uv +
    # Rust toolchain + maturin develop) differing only in their final
    # commands. The 3.12 floor leg absorbs the lint steps, the anvil tier,
    # and both fleet profiles; the other legs run the test suite only. 3.15 is
    # the ceiling leg.
    name: Python ${{ matrix.python-version }} (fleet ${{ matrix.fleet-profile }})
    # `python-wheel` produces the artifact every leg installs. Without this edge
    # the legs race the build and fail on `Artifact not found`; both jobs carry
    # the same `python` path gate, so a path-gated push skips them together.
    needs: [changes, python-wheel]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Independent legs: one failure must not cancel the others - the
      # forced-pinned fleet leg and the version legs carry separate signal.
      fail-fast: false
      matrix:
        # The fleet profile matrix: job A is `auto` on the
        # standard 4-vCPU runner (the REAL small-host path: the 2-5-core
        # tier boots the serial binding); job B is forced `pinned` (the
        # operator override: seats and fan-out, marked oversubscribed on
        # the sub-floor host). The 3.12 floor leg carries both profiles;
        # all others stay auto.
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        fleet-profile:
          - auto
        include:
          - python-version: "3.12"
            fleet-profile: pinned

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: ./.github/actions/llvm23

      # The extension arrives as the artifact `python-wheel` built once: these
      # legs used to run `just dev` (maturin) against identical source.
      # `install-extension-wheel` syncs the lock venv first, so everything below
      # sees the environment `just bootstrap` used to produce.
      - name: Download the extension wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: degenbot-extension-wheel
          path: dist

      - name: Install the extension wheel
        run: just install-extension-wheel dist/*.whl

      # The comment-hygiene gate (scripts/hooks/comment-hygiene.sh) runs one rg
      # pass over the WORKING TREE, and tests/test_comment_hygiene_gate.py drives
      # the real gate as its negative probe, so the pytest tier shells out to
      # ripgrep. ubuntu-latest no longer preinstalls it - the rust job provisions
      # it for the engine impl-block gate for the same reason - and a missing rg
      # is the gate REFUSING to certify rather than a reason to skip: provision
      # it here. Same dependency the .devcontainer/Dockerfile installs.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      # Foundry provides `forge` for the executor contract lane and `anvil` for
      # the standalone-anvil (T1) tier, both on the floor leg (no RPC secret is
      # ever plumbed: the offline lane takes no node and standalone-anvil runs
      # against a seeded local chain). The other legs skip both.
      - name: Install Foundry (forge + anvil)
        if: matrix.python-version == '3.12'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      # Former python-lint job (same pinned 3.12 uv environment as this leg).
      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: just check-uv-lock && just fmt-check-python

      - name: Run Python linters
        if: matrix.python-version == '3.12'
        run: just lint-python

      # The executor lane compiles the canonical Uniswap V2/V3/V4 sources from
      # the gitignored `tier3-oracle/lib` checkout (the same reference contracts
      # the Tier-3 harnesses use), so provision them on the leg that runs it.
      - name: Fetch canonical reference contracts (executor lane)
        if: matrix.python-version == '3.12'
        run: tier3-oracle/bootstrap-libs.sh

      - name: Run executor contract tests (offline Forge lane)
        if: matrix.python-version == '3.12'
        run: just test-executor-offline

      - name: Run Tests
        # Spray tripwire: `just test-python-noise-gate` runs the same suite but
        # captures the whole process output and fails on the logging-error /
        # reconnect spray signatures that historically printed post-session
        # while the exit code stayed 0.
        run: just test-python-noise-gate
        env:
          # The profile leg force (auto is the enum default - same
          # behavior as unset; pinned is the forced-override leg).
          DEGENBOT_FLEET_PROFILE: ${{ matrix.fleet-profile }}
          # The extension came from this run's wheel artifact, so `just dev`'s
          # rebuild is exactly the duplicate work this job avoids.
          DEGENBOT_EXTENSION_INSTALLED: "1"

  stub-drift:
    # ADR-066 D2/D3: the regenerate-and-diff stub gate, promoted out of the
    # default pytest selection. `just gen-stubs --check` cargo-builds
    # degenbot_rs with the temporary `experimental-inspect` feature +
    # degenbot-stubgen before introspecting the cdylib, so it is compile-coupled
    # and was the slowest default-run test (~60s) — previously paid on EVERY
    # python-test matrix leg. It runs here, once, as a dedicated gate; the
    # `stub_drift` marker keeps it out of the default suite. No extension build
    # is needed: the gate only needs uv (for the ruff format/lint pass over the
    # generated tree), the Rust toolchain, and just.
    name: Stub Drift (regen-and-diff)
    needs: changes
    if: needs.changes.outputs.stubs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Cargo
        # Shares the ci-rust prefix with the rust/python jobs so the common
        # workspace deps are reused; the `experimental-inspect` toggle only adds
        # feature-specific fingerprints, and `just dev` still selects the
        # canonical feature set from whatever the cache carries.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: ./.github/actions/llvm23

      - name: Sync the uv environment (no extension build)
        run: uv sync --locked --dev --no-install-project

      - name: Regenerate-and-diff stub gate
        run: just lint-stub-drift

  ci-green:
    # Single required-check target for branch protection: protection rules can
    # reference this one check instead of the whole path-gated set. A job that
    # was path-gated out (skipped) counts as pass; a failed or cancelled job
    # fails the aggregate. `if: always()` so the aggregate still runs when a
    # needed job failed - otherwise it would skip and report green.
    name: CI (aggregate)
    if: always()
    needs: [changes, commitlint, markdownlint, msrv, rust-lint, rust-test, rust-release-tests, rust-artifacts, rust-policy-lanes, cli-no-python, tier3-oracle, python-wheel, python, stub-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job passed or was path-gated out
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::CI is not green:"
            echo "$failed"
            exit 1
          fi
          echo "all jobs green (skipped = path-gated out)" 
