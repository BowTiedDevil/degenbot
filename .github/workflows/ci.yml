name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out (tag or SHA); empty = the triggering commit.'
        required: false
        type: string
        default: ''

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  # Superseded pushes to the same branch/PR replace the older run instead of
  # stacking full CI invocations behind it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state is never reused within a run on ephemeral CI runners and
  # only bloats the rust-cache save. Debuginfo likewise: rust/target (and the
  # cache) shrink substantially without it.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Path gate: cheap first job that decides which tracks the event actually
  # touched. PRs diff against the merge-base, pushes against the previous
  # commit (dorny/paths-filter handles both). release.yml calls this
  # workflow at a tag; that event carries no diff, so every output defaults to
  # true and the release gate runs the full matrix.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.machinery == 'true' }}
      python: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.python == 'true' || steps.filter.outputs.machinery == 'true' }}
      tier3: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.tier3 == 'true' || steps.filter.outputs.machinery == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'rust-toolchain.toml'
              - 'tier3-oracle/artifacts/**'
              # maturin reads the build config from these; the rust job builds
              # the extension.
              - 'pyproject.toml'
              - 'uv.lock'
            python:
              - 'rust/**'
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tier3-oracle/artifacts/**'
            tier3:
              - 'tier3-oracle/**'
              - 'executor/**'
            # CI machinery: the gated jobs execute justfile recipes, gate
            # scripts, and this workflow file itself, so an edit to any of
            # them must re-run the gates - a machinery-only change must not
            # merge green with zero jobs run. This includes the no-Python
            # console gate and its oracle (ADR-051 D10).
            machinery:
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.cargo/config.toml'
              - 'prek.toml'

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Lint commit messages
        # On push: lint only the commits being pushed (before..after).
        # On PRs: lint all commits in the PR (merge-base..HEAD).
        # Fallback: lint the last 20 commits on the branch.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FROM="${{ github.event.before }}"
            # A force push rewrites history and orphans the `before` SHA: a fresh
            # checkout (fetch-depth:0 fetches only objects reachable from refs)
            # won't contain it, so commitlint throws "Invalid revision range".
            # Fall back to a guaranteed-present range that still covers the
            # rewritten commits (HEAD history is fully fetched).
            if ! git rev-parse --verify --quiet "${FROM}^{commit}" >/dev/null 2>&1; then
              echo "::warning::Push 'before' SHA ${FROM} is absent (likely a force push); using fallback range."
              n=$(git rev-list --count HEAD)
              if [ "$n" -gt 200 ]; then n=200; fi
              if [ "$n" -ge 1 ]; then FROM="HEAD~$((n - 1))"; else FROM="HEAD"; fi
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM=$(git merge-base origin/main HEAD)
          else
            FROM=HEAD~20
          fi
          # An empty range makes commitlint throw "Invalid revision range".
          if [ "$(git rev-list --count "${FROM}..HEAD" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "No commits in range ${FROM}..HEAD; nothing to lint."
            exit 0
          fi
          echo "Linting commits from $FROM to HEAD"
          # Pinned: a floating @commitlint/cli would make the lint rule set
          # depend on when the job runs.
          npx --yes @commitlint/cli@21.2.4 --from="$FROM" --to=HEAD

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Lint Markdown
        # No --fix: an auto-fixable violation would be corrected on the runner
        # and discarded, going green while the repository stays dirty. Fail on
        # the violation instead. Pinned for the same reason as commitlint.
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "!**/node_modules/**" "!**/.venv/**" "!tier3-oracle/lib/**" "!logs/**" "!.scratch/**"

  msrv:
    name: MSRV (Rust 1.97)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust-msrv

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Compile workspace at MSRV
        run: just check-msrv

  rust:
    # Consolidation of the former rust-check / rust-test /
    # solver-replay-golden / rust-build / publish-dry-run jobs, which each paid
    # toolchain install + cache restore + a workspace compile. One job = one
    # target dir: clippy's dep artifacts are reused by test / golden replay /
    # build / dry-run on the same runner.
    name: Rust (lint, tests, F2 golden replay, build, publish dry-run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The engine impl-block gate shells out to ripgrep. ubuntu-latest no
      # longer preinstalls it (a missing rg made the gate misreport a tool
      # error as "impl not consolidated"), so provision it explicitly - same
      # dependency the .devcontainer/Dockerfile installs.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      # Cheapest first: a fmt/clippy failure never pays for the test build.
      - name: Check formatting
        run: just fmt-check

      - name: Check engine impl-block gate
        run: just check-engine-impl-blocks

      - name: Run Clippy (workspace defaults)
        run: just lint-rust-check

      - name: Check workspace default features independently
        run: just check-rust-default

      - name: Check pure-Rust consumer features
        run: just check-rust-consumer

      - name: Check binding-default features
        run: just check-rust-binding-default

      - name: Check dev-only extension features
        run: just check-rust-dev-features

      - name: Check release-equivalent extension features
        run: just check-rust-extension-release

      - name: Check all features (diagnostic only)
        run: just check-rust-all-features

      - name: Assert Rust lint left the working tree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Run Tests
        run: just test-rust

      # The fleet budget-algebra (the pure plan/budget
      # tiering tests) and the binding-parity gates (the pinned-vs-serial
      # outcome-corpus identity) run as a NAMED step so a fleet-tier
      # regression is readable in the check log, not buried in the suite.
      - name: Run fleet budget-algebra + binding parity gates (FF-T5)
        run: just test-fleet-parity

      - name: Run two-sided golden replay gate (offline, blocks merge)
        run: just test-golden-replay

      - name: Build extension
        run: just build-rust-extension

      # Former publish-dry-run job; its rust/ diff gate moved to the `changes`
      # job. Catches manifest/file-inclusion regressions on every rust change,
      # long before a tag. --no-verify keeps the PR gate fast (no isolated
      # build); the verified publish itself is publish-to-crates-io.yml's
      # pre-publish step plus the real `cargo publish` (always verified —
      # release policy forbids --no-verify on publishes).
      - name: Dry-run publish of all publishable members
        run: just publish-dry-run --no-verify

  cli-no-python:
    # ADR-051 D10: the console must build and run with NO Python
    # anywhere. This job deliberately does NOT provision Python (no
    # actions/setup-python) and never invokes uv; it builds the `degenbot`
    # binary from the Rust workspace alone, runs the argv smoke set
    # (--help/--version/database inspect/exchange activate+deactivate
    # idempotence) against committed Alembic fixtures copied to a temp dir, and
    # diffs the machine-checkable stdout against the checked-in oracle. The two
    # seeded-divergence steps prove the comparator can fail.
    name: CLI (no Python)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      # No Python toolchain is provisioned. Assert it statically against this
      # job's own YAML: a future edit that adds actions/setup-python,
      # astral-sh/setup-uv, or a `uv run` step is caught here.
      - name: Assert this job provisions no Python
        run: |
          job=$(awk '
            /^  cli-no-python:/ { in_job = 1 }
            in_job && /^  [a-z][a-z0-9-]*:$/ && !/^  cli-no-python:/ { in_job = 0 }
            in_job { print }
          ' .github/workflows/ci.yml)
          fail=0
          # No Python-provisioning action may be named by this job.
          if printf '%s\n' "$job" | grep -Ev '^[[:space:]]*#' | grep -v 'grep -Eq' | grep -Eq 'uses:[[:space:]]*(actions/setup-python|astral-sh/setup-uv)'; then
            echo "::error::cli-no-python must not provision Python"
            fail=1
          fi
          # No step may shell out to uv. Comment lines and this self-check's
          # own pattern line are excluded so the guard cannot match itself.
          if printf '%s\n' "$job" | grep -Ev '^[[:space:]]*#' | grep -v 'grep -Eq' | grep -Eq 'uv[[:space:]]+run([[:space:]]|$)'; then
            echo "::error::cli-no-python must not invoke uv"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "ok: no Python setup action or uv invocation in the cli-no-python job"

      - name: Build the console (Python-free)
        run: cargo build --locked -p degenbot-cli --manifest-path rust/Cargo.toml

      - name: Run the no-Python console gate
        run: bash .github/workflows/cli-no-python-gate.sh

      - name: Prove the gate has teeth (seeded expected divergence)
        run: DEGENBOT_CLI_GATE_SEED=expected bash .github/workflows/cli-no-python-gate.sh

      - name: Prove the gate has teeth (seeded live divergence)
        run: DEGENBOT_CLI_GATE_SEED=live bash .github/workflows/cli-no-python-gate.sh

  tier3-oracle:
    name: Tier-3 On-Chain Accuracy Oracle
    needs: changes
    if: needs.changes.outputs.tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.98.1

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Foundry (forge + solc 0.7.6)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Fetch canonical reference contracts (v2/v3/v4-core) + solc binaries
        run: tier3-oracle/bootstrap-libs.sh

      # The oracle TESTS themselves run in the consolidated `rust` job (they load
      # the committed bytecode from tier3-oracle/artifacts/ — no toolchain at
      # runtime). This job's unique role is the AUTHORITATIVE compile-vs-use
      # check: recompile every harness with the real solc/forge toolchain and
      # assert the committed bytecode matches a fresh build (catches a harness-
      # source or pinned-vendored-lib edit without a rebuild).
      - name: Verify committed harness bytecode matches a fresh compile
        run: just verify-tier3-artifacts

      # The same, for the Vyper executor (tier-3b): recompile the
      # vendored executor/contracts source with the pinned vyper 0.5.0a3 and
      # byte-compare the committed artifacts. The toolchain is self-contained
      # in-repo (executor/ uv project, interpreter pinned via
      # executor/.python-version — `uv run` fetches it on a fresh runner).
      - name: Install uv (executor vyper toolchain)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Cache uv wheel cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-executor-${{ hashFiles('executor/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-executor-

      - name: Verify committed executor artifact matches a fresh compile
        run: just verify-tier3-executor-artifact

  python:
    # Consolidation of the former python-lint / python-test matrix /
    # python-test-anvil jobs, which were byte-identical environments (uv +
    # Rust toolchain + maturin develop) differing only in their final
    # commands. The 3.12 floor leg absorbs the lint steps, the anvil tier,
    # and both fleet profiles; the other legs run the test suite only. 3.15 is
    # the ceiling leg.
    name: Python ${{ matrix.python-version }} (fleet ${{ matrix.fleet-profile }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Independent legs: one failure must not cancel the others - the
      # forced-pinned fleet leg and the version legs carry separate signal.
      fail-fast: false
      matrix:
        # The fleet profile matrix: job A is `auto` on the
        # standard 4-vCPU runner (the REAL small-host path: the 2-5-core
        # tier boots the serial binding); job B is forced `pinned` (the
        # operator override: seats and fan-out, marked oversubscribed on
        # the sub-floor host). The 3.12 floor leg carries both profiles;
        # all others stay auto.
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        fleet-profile:
          - auto
        include:
          - python-version: "3.12"
            fleet-profile: pinned

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.98.1

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Bootstrap development environment
        run: just bootstrap

      # Foundry provides `anvil` so the standalone-anvil (T1) tier executes on
      # the floor leg (no RPC secret is ever plumbed: standalone-anvil tests
      # run against a seeded local chain with no upstream). The other legs
      # skip that tier, matching the historical matrix behavior.
      - name: Install Foundry (anvil)
        if: matrix.python-version == '3.12'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      # Former python-lint job (same pinned 3.12 uv environment as this leg).
      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: just check-uv-lock && just fmt-check-python

      - name: Run Python linters
        if: matrix.python-version == '3.12'
        run: just lint-python

      - name: Run Tests
        # Spray tripwire: `just test-python-noise-gate` runs the same suite but
        # captures the whole process output and fails on the logging-error /
        # reconnect spray signatures that historically printed post-session
        # while the exit code stayed 0.
        run: just test-python-noise-gate
        env:
          # The profile leg force (auto is the enum default - same
          # behavior as unset; pinned is the forced-override leg).
          DEGENBOT_FLEET_PROFILE: ${{ matrix.fleet-profile }}

  stub-drift:
    # ADR-066 D2/D3: the regenerate-and-diff stub gate, promoted out of the
    # default pytest selection. `just gen-stubs --check` cargo-builds
    # degenbot_rs with the temporary `experimental-inspect` feature +
    # degenbot-stubgen before introspecting the cdylib, so it is compile-coupled
    # and was the slowest default-run test (~60s) — previously paid on EVERY
    # python-test matrix leg. It runs here, once, as a dedicated gate; the
    # `stub_drift` marker keeps it out of the default suite. No extension build
    # is needed: the gate only needs uv (for the ruff format/lint pass over the
    # generated tree), the Rust toolchain, and just.
    name: Stub Drift (regen-and-diff)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.98.1

      - name: Cache Cargo
        # Shares the ci-rust prefix with the rust/python jobs so the common
        # workspace deps are reused; the `experimental-inspect` toggle only adds
        # feature-specific fingerprints, and `just dev` still selects the
        # canonical feature set from whatever the cache carries.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Sync the uv environment (no extension build)
        run: uv sync --locked --dev --no-install-project

      - name: Regenerate-and-diff stub gate
        run: just lint-stub-drift

  ci-green:
    # Single required-check target for branch protection: protection rules can
    # reference this one check instead of the whole path-gated set. A job that
    # was path-gated out (skipped) counts as pass; a failed or cancelled job
    # fails the aggregate. `if: always()` so the aggregate still runs when a
    # needed job failed - otherwise it would skip and report green.
    name: CI (aggregate)
    if: always()
    needs: [changes, commitlint, markdownlint, msrv, rust, cli-no-python, tier3-oracle, python, stub-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job passed or was path-gated out
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::CI is not green:"
            echo "$failed"
            exit 1
          fi
          echo "all jobs green (skipped = path-gated out)" 
