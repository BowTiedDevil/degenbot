name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  # Superseded pushes to the same branch/PR replace the older run instead of
  # stacking full CI invocations behind it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state is never reused within a run on ephemeral CI runners and
  # only bloats the rust-cache save. Debuginfo likewise: rust/target (and the
  # cache) shrink substantially without it.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Path gate: cheap first job that decides which tracks the event actually
  # touched. PRs diff against the merge-base, pushes against the previous
  # commit (dorny/paths-filter handles both). The workflow_call trigger has no
  # in-repo consumer; its event carries no diff, so every output defaults to
  # true and the callee runs the full matrix.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.rust }}
      python: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.python }}
      tier3: ${{ github.event_name == 'workflow_call' || steps.filter.outputs.tier3 }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'tier3-oracle/artifacts/**'
            python:
              - 'rust/**'
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tier3-oracle/artifacts/**'
            tier3:
              - 'tier3-oracle/**'
              - 'executor/**'

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint commit messages
        # On push: lint only the commits being pushed (before..after).
        # On PRs: lint all commits in the PR (merge-base..HEAD).
        # Fallback: lint the last 20 commits on the branch.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FROM="${{ github.event.before }}"
            # A force push rewrites history and orphans the `before` SHA: a fresh
            # checkout (fetch-depth:0 fetches only objects reachable from refs)
            # won't contain it, so commitlint throws "Invalid revision range".
            # Fall back to a guaranteed-present range that still covers the
            # rewritten commits (HEAD history is fully fetched).
            if ! git rev-parse --verify --quiet "${FROM}^{commit}" >/dev/null 2>&1; then
              echo "::warning::Push 'before' SHA ${FROM} is absent (likely a force push); using fallback range."
              n=$(git rev-list --count HEAD)
              if [ "$n" -gt 200 ]; then n=200; fi
              if [ "$n" -ge 1 ]; then FROM="HEAD~$((n - 1))"; else FROM="HEAD"; fi
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM=$(git merge-base origin/main HEAD)
          else
            FROM=HEAD~20
          fi
          # An empty range makes commitlint throw "Invalid revision range".
          if [ "$(git rev-list --count "${FROM}..HEAD" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "No commits in range ${FROM}..HEAD; nothing to lint."
            exit 0
          fi
          echo "Linting commits from $FROM to HEAD"
          npx --yes @commitlint/cli --from="$FROM" --to=HEAD

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx markdownlint-cli2 --fix "**/*.md" "!node_modules/**" "!.opencode/node_modules/**" "!.venv/**"

  rust:
    # Consolidation of the former rust-check / rust-test /
    # solver-replay-golden / rust-build / publish-dry-run jobs, which each paid
    # toolchain install + cache restore + a workspace compile. One job = one
    # target dir: clippy's dep artifacts are reused by test / golden replay /
    # build / dry-run on the same runner.
    name: Rust (lint, tests, F2 golden replay, build, publish dry-run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Cheapest first: a fmt/clippy failure never pays for the test build.
      - name: Check formatting
        run: just fmt-check

      - name: Run Clippy
        run: just lint-rust

      - name: Run Tests
        run: just test-rust

      # Former standalone "Solver Golden Replay (F2 gate)" job; the golden
      # regression now fails the `rust` job.
      - name: Run two-sided golden replay gate (offline, blocks merge)
        run: |
          cd rust
          # Fail (nonzero exit) if any path regresses: profit under-shoot above
          # PROFIT_EPS, profit over-shoot past the few-wei tolerance in either
          # direction, or nondeterminism across reps. No RPC/DB needed.
          # Loop-18: the exact-wei goldens are re-anchored to blocks
          # 25879435..25879446 by cl_capture_gen (see sidecars *.jsonl.block);
          # both the single-block offline anchor and the 156-row heavy corpus
          # gate here (2s combined).
          cargo run -q -p degenbot-solvers --example cl_solve_replay -- \
            crates/degenbot-solvers/tests/fixtures/cl_capture_offline.jsonl
          cargo run -q -p degenbot-solvers --example cl_solve_replay -- \
            crates/degenbot-solvers/tests/fixtures/heavy_cl_solve_captures.jsonl

        # NOTE: make THIS `rust` job the required check in branch protection
        # (it replaces the former "Solver Golden Replay (F2 gate)" check — see
        # docs/handoffs/ci-consolidation-required-checks.md) so a golden
        # regression blocks merges.

      # Former rust-build job: near-free after the clippy/test build.
      - name: Build extension
        run: just build-rust-extension

      # Former publish-dry-run job; its rust/ diff gate moved to the `changes`
      # job. Catches manifest/file-inclusion regressions on every rust change,
      # long before a tag. --no-verify keeps the PR gate fast (no isolated
      # build); the verified publish itself is publish-to-crates-io.yml's
      # pre-publish step plus the real `cargo publish` (always verified —
      # release policy forbids --no-verify on publishes).
      - name: Dry-run publish of all publishable members
        run: cargo publish --workspace --dry-run --no-verify --allow-dirty --manifest-path rust/Cargo.toml

  tier3-oracle:
    name: Tier-3 On-Chain Accuracy Oracle
    needs: changes
    if: needs.changes.outputs.tier3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Foundry (forge + solc 0.7.6)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Fetch canonical reference contracts (v2/v3/v4-core) + solc binaries
        run: tier3-oracle/bootstrap-libs.sh

      # The oracle TESTS themselves run in the consolidated `rust` job (they load
      # the committed bytecode from tier3-oracle/artifacts/ — no toolchain at
      # runtime). This job's unique role is the AUTHORITATIVE compile-vs-use
      # check: recompile every harness with the real solc/forge toolchain and
      # assert the committed bytecode matches a fresh build (catches a harness-
      # source or pinned-vendored-lib edit without a rebuild).
      - name: Verify committed harness bytecode matches a fresh compile
        run: just verify-tier3-artifacts

      # The same, for the Vyper executor (BHL2R2 / tier-3b): recompile the
      # vendored executor/contracts source with the pinned vyper 0.5.0a3 and
      # byte-compare the committed artifacts. Since SRMMM7 the toolchain is
      # self-contained in-repo (executor/ uv project, interpreter pinned via
      # executor/.python-version — `uv run` fetches it on a fresh runner).
      - name: Install uv (executor vyper toolchain)
        uses: astral-sh/setup-uv@v7

      - name: Cache uv wheel cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-executor-${{ hashFiles('executor/uv.lock') }}

      - name: Verify committed executor artifact matches a fresh compile
        run: just verify-tier3-executor-artifact

  python:
    # Consolidation of the former python-lint / python-test matrix /
    # python-test-anvil jobs, which were byte-identical environments (uv +
    # Rust toolchain + maturin develop) differing only in their final
    # commands. The 3.12 floor leg absorbs the lint steps and the anvil tier;
    # 3.14 is the ceiling leg. 3.13 was dropped as a mid-endpoint.
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        # Shared prefix so the jobs that survive the path gate chain off each
        # other's saves. Unlike a Cargo.lock-only key, rust-cache accounts for
        # workspace source changes and prunes stale artifacts before saving.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-rust

      - name: Sync dependencies
        run: uv sync --locked --dev --all-extras

      - name: Install just
        uses: extractions/setup-just@v4

      # Foundry provides `anvil` so the standalone-anvil (T1) tier executes on
      # the floor leg (no RPC secret is ever plumbed: standalone-anvil tests
      # run against a seeded local chain with no upstream). The 3.14 leg skips
      # that tier, matching the historical matrix behavior.
      - name: Install Foundry (anvil)
        if: matrix.python-version == '3.12'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build and install Rust extension
        run: just dev

      # Former python-lint job (same pinned 3.12 uv environment as this leg).
      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: just fmt-check-python

      - name: Run Python linters
        if: matrix.python-version == '3.12'
        run: just lint-python

      - name: Run Tests
        run: just test-python
