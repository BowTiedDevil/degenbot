name: Publish to crates.io

# Tag-driven crates.io release (ergo MYYV2X, publishing epic 5UWNO3).
# Mirrors .github/workflows/publish-to-pypi.yaml: validate-branch -> publish.
# No `test-*` tags for crates.io — a test crates.io release would be
# irreversibly public; pre-releases are handled by the tag<->version match
# guard (the FIRST release is the 0.6.0-alpha.5 pre-release itself).
#
# Token: repo secret `CRATES_IO_TOKEN` (crates.io -> Account -> API Tokens),
# exposed as CARGO_REGISTRY_TOKEN (cargo's native env name).

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag is on main branch
        run: |
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Tag ${{ github.ref_name }} is not on main branch"
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on main branch"

  publish:
    name: Publish (cargo-native order + new-crate rate-limit retries)
    needs: validate-branch
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        # Pinned to the workspace `rust-version` (1.97), not @stable — the
        # published crates must build with the MSRV a consumer can have.
        uses: dtolnay/rust-toolchain@1.97

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check tag matches workspace version
        # Release-policy guard (pre-release safe): the tag (minus leading v)
        # must equal the single [workspace.package] version literal (ADR-009).
        # e.g. tag v0.6.0-alpha.5 requires version = "0.6.0-alpha.5"; a
        # v0.6.0 tag against an alpha workspace fails fast, before upload.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Release tags use PEP440 (v0.6.0a5); crates.io uses SemVer
          # (0.6.0-alpha.5), which is what the workspace literal holds. Normalize
          # the PEP440 pre-release suffixes before comparing, so v0.6.0a5 and
          # v0.6.0-alpha.5 both pass, but v0.6.0 against an alpha workspace still
          # fails fast. POST releases (v0.6.0a1.post1) are PyPI-only: no SemVer
          # form exists, so they fall through and fail closed here.
          cargo_ver=$(printf '%s' "$tag" | sed -E \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)a([0-9]+)$/\1.\2.\3-alpha.\4/' \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)b([0-9]+)$/\1.\2.\3-beta.\4/' \
            -e 's/^([0-9]+)\.([0-9]+)\.([0-9]+)rc([0-9]+)$/\1.\2.\3-rc.\4/')
          ws_ver=$(sed -n 's/^version = //p' rust/Cargo.toml | head -n 1 | tr -d '"' | tr -d ' ')
          # ADR-009 lockstep: every [workspace.dependencies] version literal must
          # equal the workspace version, or cargo packs 0.6.0-alpha.N crates whose
          # manifests require stale sibling versions (0.6.0-alpha.N-1) — crates.io
          # rejects the upload. Fail here, before the dry-run/publish steps.
          dep_ver=$(sed -n '/^\[workspace.dependencies\]/,/^\[/p' rust/Cargo.toml | grep -o 'version = "[^"]*"' | sed -E 's/version = "([^"]+)"/\1/' | sort -u | grep -v "^$ws_ver$" | head -n 1)
          if [ -n "$dep_ver" ]; then
            echo "[workspace.dependencies] version '$dep_ver' is out of lockstep with workspace version '$ws_ver'" >&2
            exit 1
          fi
          if [ "$cargo_ver" != "$ws_ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match [workspace.package] version '$ws_ver'" >&2
            exit 1
          fi
          echo "Tag/version match: $ws_ver"

      - name: Pre-publish verification (full verify, all members)
        # Release policy: never publish without verify. `cargo publish
        # --workspace --dry-run` packages every publishable member and
        # verifies each tarball's build (the two non-publishable members,
        # degenbot_rs + degenbot-execution-sample, are skipped by cargo).
        # A fresh CI runner has no stale local-registry state, so this is a
        # clean verification of the tag's exact tree.
        run: cargo publish --workspace --dry-run --allow-dirty --manifest-path rust/Cargo.toml

      - name: Publish (cargo-native order + waits; new-crate rate-limit retry rounds)
        # First-release mechanics: docs/releases/2026-08-19-first-crates-io-release.md.
        # `cargo publish --workspace` orders the publishable members itself (dependency
        # order) and polls the registry until each crate AND its local deps are
        # index-visible before proceeding — no hand-rolled topo list, no curl index
        # polling. crates.io's PublishNew bucket (1 NEW NAME per 10 min, burst 5)
        # rate-limits brand-new crate names, so each round publishes the
        # not-yet-live members and, on 429, sleeps until the server-stated
        # retry-after. Version-bump releases (PublishUpdate: 1/min, burst 30)
        # complete in round 1.
        run: |
          set -uo pipefail
          cd rust
          # The live-set audit below greps the crates.io index, which stores the
          # SEMVER literal (0.6.0-alpha.6), not the PEP440 tag (0.6.0a6). Read the
          # workspace version instead of deriving it from the tag so the grep
          # always matches what crates.io reports.
          ver=$(sed -n 's/^version = //p' Cargo.toml | head -n 1 | tr -d '"' | tr -d ' ')
          # Publishable members from cargo metadata itself (publish:null), so a
          # new non-publishable crate (publish=false -> []) is auto-skipped — no
          # hardcoded name list to drift. Today that's degenbot_rs + degenbot-execution-sample.
          read -r -a members <<< "$(cargo metadata --format-version 1 --no-deps | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log(m.packages.filter(p=>p.publish==null).map(p=>p.name).join(" "))})')"
          log=/tmp/crates-publish.log
          : > "$log"
          for round in $(seq 1 30); do
            excludes=()
            live=0
            for m in "${members[@]}"; do
              # cargo search prints `name = "version"  # description` when live; grep
              # only the anchored exact-name line so fuzzy search hits never false-match.
              if cargo search "$m" --limit 3 2>/dev/null | grep -q "^$m = \"$ver\""; then
                excludes+=(--exclude "$m")
                live=$((live + 1))
              fi
            done
            if [ "$live" -eq "${#members[@]}" ]; then
              echo "all ${#members[@]} members already live at $ver"
              exit 0
            fi
            echo "=== round $round: $live/${#members[@]} members already live at $ver — publishing the rest ==="
            if cargo publish --workspace --allow-dirty "${excludes[@]}" >>"$log" 2>&1; then
              echo "=== publish complete at $ver ==="; exit 0
            fi
            ra=$(grep -o 'try again after [A-Za-z]*, [0-9]* [A-Za-z]* [0-9]* [0-9:]* GMT' "$log" | tail -n 1 | sed 's/try again after //')
            if [ -n "$ra" ]; then
              ra_epoch=$(date -d "$ra" +%s) || { echo "::error::unparseable retry-after: $ra"; exit 1; }
              sleep_s=$(( ra_epoch - $(date +%s) + 120 ))
              echo "429 new-crate rate limit — retry-after $ra (sleeping ${sleep_s}s)"
              if [ "$sleep_s" -gt 0 ]; then sleep "$sleep_s"; fi
              continue
            fi
            echo "::error::cargo publish failed without a 429 retry-after — last 50 log lines:"
            tail -n 50 "$log"
            exit 1
          done
          echo "::error::30 rounds exhausted (new-crate rate limit longer than expected) — re-tag to continue; partial releases are recoverable at the same version"
          exit 1
