name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark"] # the `name:` of hotpath-benchmark.yml
    types: [completed]

permissions: {} # jobs get only what they declare

jobs:
  relay:
    # only successful pull request runs have a report; the action checks this too
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with BENCHMARKS in hotpath-benchmark.yml
        benchmark: [solve_balancer_stable_path, solve_curve_path]
    permissions:
      actions: read # download the artifact of the benchmark run
      id-token: write # authenticate the upload
      pull-requests: read # find the pull request the run belongs to
    concurrency: # a newer run of the same benchmark and branch supersedes an older one
      group: hotpath-relay-${{ matrix.benchmark }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@v1.0.0
        with:
          benchmark: ${{ matrix.benchmark }}
          artifact_name: hotpath-report
          report_file: ${{ matrix.benchmark }}.json
          # The Cargo workspace lives in rust/, so report locations are relative to it.
          source_root: rust
