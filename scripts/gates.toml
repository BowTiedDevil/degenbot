probe = [
  "tests/test_python_fmt_staged_gate.py::test_the_gate_checks_the_commit_with_the_project_ruff",
  "tests/test_python_fmt_staged_gate.py::test_an_empty_file_list_fails_closed",
  "tests/test_hook_ci_equivalence.py::test_python_fmt_staged_slices_the_whole_tree_sweep",
]
