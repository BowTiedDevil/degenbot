# scripts/gates.toml -- the gate registry (ADR-102).
#
# Every git hook is declared here exactly once: its id, the stage it runs at,
# the command it runs, the diff that triggers it, its flags, and the facts its
# identity needs beyond the wiring line. `prek.toml` stays the file git loads,
# but its hook lines are rendered from this registry by `just gates-regen`, and
# `just gates-check` (a pre-commit hook) fails a commit whose file has drifted.
# The prose above each rendered line lives in `prek.toml` itself, next to the
# gate it explains.
#
# Adding a gate: append one [[gate]] block below, run `just gates-regen`, and
# add its rationale comment in `prek.toml` (a new block lands without prose and
# the registry still owns its facts). Retiring one: delete the block and run
# `just gates-regen` -- the hook line and its prose go with it (ADR-087).
#
# stage       pre-commit | commit-msg | pre-push, grouped contiguously in that
#             order so prek.toml reads as three sections.
# entry       the command prek runs: `just <recipe>`, a script path, or a
#             pinned npx invocation. The recipe or script must exist.
# scope       the population the gate judges, and the one field that fixes
#             pass_filenames: `index` is the staged file list prek passes (so
#             pass_filenames cannot be false); `staged` is the commit's own
#             content the gate enumerates for itself -- git's index, as
#             `git ls-files --cached` lists it, so another lane's untracked
#             work is outside the run; and `tree` is any wider population --
#             the working tree including untracked files, the workspace, or the
#             outgoing push range (so pass_filenames cannot be true).
# data        repo-relative files the gate reconciles (a census, a catalog, a
#             config). Each must exist; an empty list is stated, never implied.
# docs        the docs/gates.md heading that documents this gate's failure
#             class (or the registry section for a wiring/format gate).
# probe       the pytest node ids that keep the gate honest: its negative or
#             drift probes. At least one, and each must name a test function
#             the committed tree defines (checked by import-free AST).
#
# CI coverage: every gate declares exactly ONE form, and the registry checks the
# workflow and the invocation graph support it -- presence in ci.yml is never
# sufficient. There is no local-only waiver.
#
#   ci_job + ci_entry + ci_relation = "direct"
#       the job invokes the hook entry verbatim ("just <recipe> [args]", or the
#       script path).
#   ci_job + ci_entry + ci_relation = "contains"
#       the job runs ci_entry, and the `just` invocation graph over
#       `just --dump` (declared dependencies plus `just <recipe>` calls in the
#       body) reaches the hook's entry recipe, carrying its arguments.
#   ci_job + ci_entry + ci_relation = "equivalent" + ci_equivalent_probe
#       the job runs a parallel whole-tree/range implementation, and the named
#       pytest node pins the two as one verdict at two populations.
#   ci_job + ci_probe
#       a committed-tree pytest node is the CI execution; `gates-check` proves
#       the node exists, and tests/test_gate_registry.py proves the default
#       pytest selection really runs it.
#
# types/types_or/files/exclude
#             the trigger, in prek's own vocabulary. `files` is a regex; a
#             whole-tree gate names the files whose change re-runs it.
# always_run/fail_fast/skip_children
#             emitted only when true. pass_filenames defaults to true and is
#             emitted only when false (a gate that sweeps the tree itself).

version = 1

# --- pre-commit --------------------------------------------------------------

[[gate]]
id = "markdownlint"
name = "Markdown lint"
stage = "pre-commit"
entry = "npx --yes markdownlint-cli2@0.24.1"
scope = "index"
docs = "The gate registry"
data = [".markdownlint.yaml"]
probe = ["tests/test_gate_registry.py::test_the_markdown_hook_lints_with_the_justfile_pin"]
types = ["markdown"]
exclude = "^executor/|^logs/|^rust/vendor/"
ci_job = "markdownlint"
ci_entry = "just lint-markdown-check"
ci_relation = "equivalent"
ci_equivalent_probe = "tests/test_gate_registry.py::test_the_markdown_hook_lints_with_the_justfile_pin"

[[gate]]
id = "comment-hygiene"
name = "Comment hygiene gate"
stage = "pre-commit"
entry = "just lint-comment-hygiene"
scope = "staged"
docs = "1. Comment hygiene"
data = []
probe = [
  "tests/test_comment_hygiene_gate.py::test_a_synthetic_citation_fails_the_gate",
  "tests/test_comment_hygiene_gate.py::test_every_retained_shape_fires_on_its_own_red_source",
  "tests/test_comment_hygiene_gate.py::test_the_scan_scope_is_the_index_not_the_working_tree",
  "tests/test_comment_hygiene_gate.py::test_the_trigger_covers_every_scanned_file_class",
  "tests/test_comment_hygiene_gate.py::test_the_committed_tree_is_clean",
]
files = '\.py$|\.rs$|\.pyi$|\.toml$|\.yml$|\.yaml$|\.sh$|\.sol$|(^|/)justfile$'
pass_filenames = false
ci_job = "policy-gates"
ci_entry = "just lint-comment-hygiene"
ci_relation = "direct"

[[gate]]
id = "publish-blocked"
name = "publish-blocked census"
stage = "pre-commit"
entry = "just check-publish-blocked"
scope = "tree"
docs = "6. Publish-blocked census"
data = ["scripts/publish-blocked-census.txt"]
probe = [
  "tests/test_publish_blocked_gate.py::test_the_committed_census_matches_the_tree",
  "tests/test_publish_blocked_gate.py::test_a_stale_row_fails_the_gate",
]
files = ".*Cargo\\.toml$|^scripts/publish-blocked-census\\.txt$|^scripts/publish_blocked\\.py$|^scripts/publication_plan\\.py$"
pass_filenames = false
ci_job = "rust-lint"
ci_entry = "just lint-rust-check"
ci_relation = "contains"

[[gate]]
id = "tool-catalog"
name = "Tool catalog reconciliation"
stage = "pre-commit"
