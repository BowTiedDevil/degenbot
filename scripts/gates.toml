name = "Gate registry drift"
stage = "pre-commit"
entry = "just gates-check"
scope = "staged"
docs = "The gate registry"
data = ["prek.toml"]
probe = [
  "tests/test_gate_registry.py::test_the_committed_registry_renders_the_committed_hook_lines",
  "tests/test_gate_registry.py::test_a_hook_missing_from_the_registry_fails",
]
files = '^prek\.toml$|^scripts/gates\.toml$|^scripts/gate_registry\.py$|^scripts/just_recipe_index\.py$|^\.github/workflows/ci\.yml$|^docs/gates\.md$|^tests/'
