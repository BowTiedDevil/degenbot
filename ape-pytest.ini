[pytest]
addopts =
    --numprocesses auto
    --import-mode importlib
pythonpath = src .
timeout = 300
timeout_method = thread
markers =
    base: tests requiring a live Base mainnet RPC or fork
    ethereum: tests requiring an Ethereum mainnet RPC
    slow: tests too slow for routine local runs
    onchain_oracle: offline replay of a recorded on-chain oracle
    online_rpc: test requiring a live external RPC
    live_drift: explicit live drift verification
    stub_drift: compile-coupled stub regeneration gate
    deployment_verify: live deployment-drift verification
    gas: executor gas benchmark and transfer-count tests
    mainnet_fork: tests requiring Ape's mainnet-fork provider
filterwarnings =
    error
    ignore::pytest.PytestAssertRewriteWarning
    ignore:websockets.legacy is deprecated.*:DeprecationWarning
    ignore:unclosed <socket.socket.*:ResourceWarning
