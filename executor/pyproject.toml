[project]
name = "executor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "eth-ape[recommended-plugins]",
    "hypothesis",
    # Hard pin: the committed tier3-oracle/artifacts/executor/ must be
    # reproducible byte-for-byte from this source with this exact compiler.
    "vyper == 0.5.0b2",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
addopts = [
    "--numprocesses", "auto",
]

[dependency-groups]
dev = [
    "pytest-xdist",
    "pytest",
]
