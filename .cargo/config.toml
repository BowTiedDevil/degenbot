# Cargo config for the degenbot workspace builds (cargo/maturin/uv all run
# from the repo root, so this file is discovered by every build path incl.
# the PyO3 cdylib rebuild and rust-analyzer's isolated target dir).
#
# Keep this file free of repository-wide rustflags. The full Tokio runtime
# metrics exposed by hotpath use tokio's unstable `RuntimeMetrics` getters;
# hotpath build recipes opt into that API with `RUSTFLAGS=--cfg tokio_unstable`
# only for the feature lanes that enable hotpath. This keeps default and
# downstream pure-Rust builds on the stable Tokio API surface.
